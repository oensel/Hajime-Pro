# PostgreSQL-Einstellungen für den Hajime-Server-Cluster (beide Server identisch).
# Nach /etc/postgresql/<version>/main/conf.d/hajime-cluster.conf kopieren.
listen_addresses = '*'
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = 1GB
hot_standby = on
hot_standby_feedback = on
# Pflicht für pg_rewind (Rückstufung eines alten Masters ohne Voll-Kopie)
wal_log_hints = on
# Synchron: ein Commit gilt erst als bestätigt, wenn der Standby ihn hat. Welcher Standby, setzt
# die App per ALTER SYSTEM (synchronous_standby_names = Name des Partners bzw. '' bei Ausfall).
synchronous_commit = on
recovery_target_timeline = 'latest'
