<svg xmlns="http://www.w3.org/2000/svg" width="712" height="332" viewBox="0 0 712 332" role="img" aria-label="Ein Notebook ist Server und über einen WLAN-Router mit Notebooks und Handys als Clients, und Dashboard verbunden. Der Drucker hängt per USB am Server-Notebook, die Videobeweis-Kamera per USB am Notebook-Client.">
<title>2: Notebook als Server im WLAN</title>
<style>
/* Layout: sechs Szenen untereinander; jede Szene ein Bild, eine Aussage. Server blau, Clients grün, Netz grau */
:root {
  --bg: #f4f6f9; --fg: #14202e; --mute: #4a5a6b; --surf: #ffffff; --line: #5d6d7e;
  --srv: #1d4ed8; --cli: #0d7a5f; --plan: #a85a00; --plan-bg: #fff4e3; --net: #e6ecf4; --rule: #d3dbe5; --ok: #0d7a5f;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1722; --fg: #e6edf5; --mute: #9fb0c3; --surf: #172334; --line: #8a9bb0;
    --srv: #6e9bff; --cli: #4fd1a8; --plan: #f0a64a; --plan-bg: #2b2112; --net: #1e2d42; --rule: #2a3a50; --ok: #4fd1a8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1722; --fg: #e6edf5; --mute: #9fb0c3; --surf: #172334; --line: #8a9bb0;
  --srv: #6e9bff; --cli: #4fd1a8; --plan: #f0a64a; --plan-bg: #2b2112; --net: #1e2d42; --rule: #2a3a50; --ok: #4fd1a8; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.55; padding-inline: 16px; padding-block: 28px 56px; }
main { max-width: 1040px; margin-inline: auto; }
h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
h2 { font-size: 1.15rem; line-height: 1.3; margin: 0 0 2px; text-wrap: balance; }
.lead { max-width: 65ch; color: var(--mute); margin: 0 0 20px; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 30px; padding: 0; list-style: none; font-size: 0.88rem; color: var(--mute); }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend svg { width: 34px; height: 14px; }
section { margin-block: 0 38px; }
.sub { margin: 0 0 10px; font-size: 0.9rem; color: var(--mute); max-width: 75ch; }
.num { font-family: var(--mono); color: var(--srv); margin-right: 8px; }
figure { margin: 0; }
.fig { overflow-x: auto; width: fit-content; max-width: 100%; background: var(--surf); border: 1px solid var(--rule); border-radius: 8px; }
.fig svg { display: block; max-width: none; color: var(--line); }
figcaption { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; margin-top: 10px; font-size: 0.9rem; color: var(--mute); }
figcaption span:first-child { flex: 1 1 36ch; max-width: 70ch; }
.tag { font-weight: 600; font-size: 0.82rem; padding: 2px 9px; border: 1px solid var(--rule); border-radius: 99px; color: var(--fg); background: var(--surf); white-space: nowrap; }
.tag.ok { color: var(--ok); border-color: var(--ok); }
.tag.geplant { color: var(--plan); border-color: var(--plan); border-style: dashed; }
.note { max-width: 70ch; margin-top: 8px; font-size: 0.92rem; color: var(--mute); }

/* SVG-Bausteine */
.g { fill: var(--surf); stroke: currentColor; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.d { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.scr { fill: var(--net); stroke: none; }
.c-srv { color: var(--srv); } .c-cli { color: var(--cli); } .c-net { color: var(--line); } .c-plan { color: var(--plan); }
.box { fill: var(--surf); stroke: var(--rule); stroke-width: 1.5; }
.box.srv { stroke: var(--srv); stroke-width: 2.2; }
.box.cli { stroke: var(--cli); stroke-width: 2; }
.box.net { fill: var(--net); stroke: var(--rule); }
.box.plan { fill: var(--plan-bg); stroke: var(--plan); stroke-width: 2; stroke-dasharray: 7 4; }
.vip { fill: none; stroke: var(--srv); stroke-width: 1.6; stroke-dasharray: 8 5; }
.ct { fill: var(--fg); font: 600 12.5px var(--sans); }
.cs { fill: var(--mute); font: 400 11.5px var(--sans); }
.s { fill: var(--mute); font: 400 11.5px var(--sans); }
.l { fill: var(--fg); font: 400 12.5px var(--sans); }
.lp { fill: var(--plan); font: 600 12px var(--sans); }
.lp2 { fill: var(--srv); font: 600 12px var(--sans); }
.ln { stroke: var(--line); stroke-width: 2; fill: none; }
.ln.srv { stroke: var(--srv); stroke-width: 2.6; }
.ln.plan { stroke: var(--plan); stroke-dasharray: 7 4; }

svg { color: var(--line); }
.bg { fill: var(--surf); stroke: var(--rule); stroke-width: 1.5; }
</style>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" style="fill: var(--line)"/></marker>
    <symbol id="i-notebook" viewBox="0 0 64 64">
      <rect class="g" x="11" y="14" width="42" height="28" rx="2.5"/><rect class="scr" x="16" y="19" width="32" height="18" rx="1"/>
      <path class="g" d="M4 46 H60 L57 52 H7 Z"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 64 64">
      <rect class="g" x="16" y="5" width="32" height="54" rx="6"/><rect class="scr" x="21" y="12" width="22" height="34" rx="1"/>
      <circle cx="32" cy="53" r="2" fill="currentColor"/>
    </symbol>
    <symbol id="i-router" viewBox="0 0 64 64">
      <path class="d" d="M16 34 L11 12 M48 34 L53 12"/><rect class="g" x="6" y="34" width="52" height="16" rx="3"/>
      <circle cx="16" cy="42" r="2" fill="currentColor"/><circle cx="24" cy="42" r="2" fill="currentColor"/>
      <path class="d" d="M24 26 Q32 18 40 26 M28 30 Q32 26 36 30"/>
    </symbol>
    <symbol id="i-printer" viewBox="0 0 64 64">
      <rect class="g" x="18" y="8" width="28" height="16" rx="1.5"/><rect class="g" x="6" y="22" width="52" height="24" rx="4"/>
      <rect class="g" x="16" y="38" width="32" height="18" rx="1.5"/><path class="d" d="M22 44 H42 M22 49 H38"/>
      <circle cx="50" cy="29" r="2" fill="currentColor"/>
    </symbol>
    <symbol id="i-thin" viewBox="0 0 64 64">
      <rect class="g" x="6" y="16" width="52" height="30" rx="3"/><path class="d" d="M14 31 H32"/>
      <circle cx="48" cy="31" r="3" fill="currentColor"/><path class="d" d="M18 46 V54 M46 46 V54"/>
    </symbol>
    <symbol id="i-cloud" viewBox="0 0 64 64">
      <path class="g" d="M18 48 H47 A11 11 0 0 0 49 26.3 A15 15 0 0 0 21 24 A12 12 0 0 0 18 48 Z"/>
    </symbol>
    <symbol id="i-globe" viewBox="0 0 64 64">
      <circle class="g" cx="32" cy="32" r="22"/><ellipse class="d" cx="32" cy="32" rx="9" ry="22"/>
      <path class="d" d="M10 32 H54 M13 21 H51 M13 43 H51"/>
    </symbol>
    <symbol id="i-paper" viewBox="0 0 64 64">
      <rect class="g" x="8" y="8" width="34" height="44" rx="2"/><rect class="g" x="20" y="14" width="34" height="44" rx="2"/>
      <path class="d" d="M27 25 H47 M27 32 H47 M27 39 H40"/>
    </symbol>
    <symbol id="i-cam" viewBox="0 0 64 64">
      <rect class="g" x="10" y="10" width="38" height="24" rx="3"/><circle class="d" cx="29" cy="22" r="7"/><circle cx="29" cy="22" r="2.5" fill="currentColor"/>
      <path class="g" d="M48 17 L58 12 V32 L48 27 Z"/><path class="d" d="M29 34 V46 M29 46 L17 58 M29 46 L41 58"/>
    </symbol>
    <symbol id="i-monitor" viewBox="0 0 64 64">
      <rect class="g" x="6" y="10" width="52" height="34" rx="3"/><rect class="scr" x="11" y="15" width="42" height="24" rx="1"/>
      <path class="d" d="M18 35 V29 M25 35 V24 M32 35 V27 M39 35 V21 M46 35 V25"/><path class="d" d="M32 44 V52 M22 53 H42"/>
    </symbol>
    <symbol id="i-speaker" viewBox="0 0 64 64">
      <rect class="g" x="10" y="22" width="14" height="20" rx="2"/><path class="g" d="M24 22 L40 11 V53 L24 42 Z"/>
      <path class="d" d="M46 24 Q52 32 46 40 M51 17 Q62 32 51 47"/>
    </symbol>
    <symbol id="i-stream" viewBox="0 0 64 64">
      <rect class="g" x="5" y="20" width="38" height="26" rx="3"/><path class="g" d="M43 30 L59 21 V45 L43 36 Z"/>
      <circle cx="13" cy="28" r="3" fill="currentColor"/>
    </symbol>
  </defs>
<rect class="bg" x="0.75" y="0.75" width="710.5" height="330.5" rx="8"/>
<rect class="box plain" x="14" y="198" width="108" height="120" rx="8"/>
<use href="#i-printer" class="c-net" x="37" y="204" width="62" height="62"/>
<text class="ct" x="68" y="288" text-anchor="middle">Drucker</text>
<text class="cs" x="68" y="305" text-anchor="middle">am Server</text>
<rect class="box srv" x="158" y="198" width="108" height="120" rx="8"/>
<use href="#i-notebook" class="c-srv" x="181" y="204" width="62" height="62"/>
<text class="ct" x="212" y="288" text-anchor="middle">Notebook</text>
<text class="cs" x="212" y="305" text-anchor="middle">Server</text>
<rect class="box net" x="302" y="198" width="108" height="120" rx="8"/>
<use href="#i-router" class="c-net" x="325" y="204" width="62" height="62"/>
<text class="ct" x="356" y="288" text-anchor="middle">WLAN-Router</text>
<text class="cs" x="356" y="305" text-anchor="middle">LAN · WLAN</text>
<rect class="box cli" x="446" y="198" width="108" height="120" rx="8"/>
<use href="#i-notebook" class="c-cli" x="469" y="204" width="62" height="62"/>
<text class="ct" x="500" y="288" text-anchor="middle">Notebooks</text>
<text class="cs" x="500" y="305" text-anchor="middle">Clients</text>
<rect class="box cli" x="590" y="198" width="108" height="120" rx="8"/>
<use href="#i-cam" class="c-cli" x="613" y="204" width="62" height="62"/>
<text class="ct" x="644" y="288" text-anchor="middle">Videobeweis</text>
<text class="cs" x="644" y="305" text-anchor="middle">Kamera · Replay</text>
<rect class="box plain" x="158" y="14" width="108" height="120" rx="8"/>
<use href="#i-speaker" class="c-net" x="181" y="20" width="62" height="62"/>
<text class="ct" x="212" y="104" text-anchor="middle">Lautsprecher</text>
<text class="cs" x="212" y="121" text-anchor="middle">am Server</text>
<rect class="box cli" x="302" y="14" width="108" height="120" rx="8"/>
<use href="#i-phone" class="c-cli" x="325" y="20" width="62" height="62"/>
<text class="ct" x="356" y="104" text-anchor="middle">Handys</text>
<text class="cs" x="356" y="121" text-anchor="middle">Clients</text>
<rect class="box cli" x="446" y="14" width="108" height="120" rx="8"/>
<use href="#i-monitor" class="c-cli" x="469" y="20" width="62" height="62"/>
<text class="ct" x="500" y="104" text-anchor="middle">Dashboard</text>
<text class="cs" x="500" y="121" text-anchor="middle">Beamer / Monitor</text>
<line class="ln " x1="122" y1="258" x2="158" y2="258" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text class="s" x="140" y="250" text-anchor="middle">USB</text>
<line class="ln srv" x1="266" y1="258" x2="302" y2="258"/>
<line class="ln " x1="212" y1="134" x2="212" y2="198"/>
<text class="s" x="221" y="150" text-anchor="start">Durchsage</text>
<text class="s" x="221" y="163" text-anchor="start">per Mikro vom</text>
<text class="s" x="221" y="176" text-anchor="start">Client</text>
<line class="ln " x1="356" y1="134" x2="356" y2="198"/>
<line class="ln " x1="554" y1="258" x2="590" y2="258" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text class="s" x="572" y="250" text-anchor="middle">USB</text>
<line class="ln " x1="356" y1="198" x2="356" y2="166"/>
<line class="ln " x1="500" y1="198" x2="500" y2="166"/>
<line class="ln " x1="500" y1="134" x2="500" y2="166"/>
<line class="ln " x1="356" y1="166" x2="500" y2="166"/>
<text class="l" x="364" y="160" text-anchor="start">WLAN / LAN</text>
</svg>
