# Gestaffelte Pipeline: dev -> test -> qa (-> prod = release.yml, ruft diesen Workflow mit vollem Umfang auf).
#   dev  : schnell und billig (Ubuntu): Plan/Pfadfilter, Unit-Tests, shellcheck. Rot = nichts Teureres startet.
#   test : E2E-Kern (test:e2e, test:e2e:sync) auf Ubuntu.
#   qa   : teure Plattform-/Infrastrukturläufe (Windows-Selbststart, macOS vorerst nur im Release, Docker-Cluster, test:e2e:cluster).
# Pull Requests laufen mit Pfadfiltern (nur was die Änderung berührt); nach dem Merge läuft nichts erneut (kein Push-
# Trigger auf main, kein Nachtlauf). VOLLER Umfang ohne Filter: Release (Tag v*, über workflow_call) und manueller Start.
# Die Sync-Suite (test:e2e:sync) läuft nur im PR, und nur bei passenden Pfaden; das Release führt sie nicht erneut aus.
# test:e2e:vollablauf läuft bewusst NICHT hier (schreibt in die echte Cloud-DB).
name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # true, wenn release.yml aufruft: Server-Paket und Android-APK baut das Release selbst (kein doppelter Lauf).
      release:
        type: boolean
        default: false

# Veraltete Läufe desselben Branches/PRs abbrechen; Tags und manuelle Läufe laufen immer zu Ende.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------- dev
  plan:
    name: dev / plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kern: ${{ steps.ergebnis.outputs.kern }}
      cluster: ${{ steps.ergebnis.outputs.cluster }}
      sync: ${{ steps.ergebnis.outputs.sync }}
      plattform: ${{ steps.ergebnis.outputs.plattform }}
      shell: ${{ steps.ergebnis.outputs.shell }}
      paket: ${{ steps.ergebnis.outputs.paket }}
      android: ${{ steps.ergebnis.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        # Für Release/manuell nicht nötig, dort gilt "alles".
        if: github.event_name == 'pull_request'
        with:
          filters: |
            kern:
              - 'src/**'
              - 'public/**'
              - 'migrations/**'
              - 'tests/**'
              - 'scripts/**'
              - 'knexfile.cjs'
              - 'setup_db.js'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright*.js'
              - '.github/workflows/ci.yml'
            sync:
              - 'src/sync/**'
              - 'src/shared/**'
              - 'public/js/datenzugriff.js'
              - 'tests/e2e-sync/**'
              - 'migrations/**'
              - 'playwright.sync.config.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            cluster:
              - 'src/cluster/**'
              - 'src/sync/**'
              - 'src/shared/**'
              - 'deploy/linux/**'
              - 'tests/e2e-cluster/**'
              - 'scripts/test-cluster-install-docker.sh'
              - 'playwright.cluster.config.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            plattform:
              - 'src/utils/eingebettetesPostgres.js'
              - 'src/config/betriebsmodus.cjs'
              - 'scripts/smoke-server-eingebettet.mjs'
              - 'migrations/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            shell:
              - 'deploy/linux/**'
              - 'scripts/*.sh'
            android:
              - 'mobil/**'
              - 'scripts/baue-android-*.mjs'
              - 'src/shared/appUpdate.js'
              - '.github/workflows/ci.yml'
            paket:
              - 'desktop/server/**'
              - 'desktop/build/**'
              - 'desktop/electron-builder.server.yml'
              - 'tests/electron-server/**'
              - 'src/utils/eingebettetesPostgres.js'
              - 'src/sync/clientDateien.js'
              - 'package.json'
              - '.github/workflows/server-paket.yml'
      - id: ergebnis
        env:
          EREIGNIS: ${{ github.event_name }}
          REF: ${{ github.ref }}
          F_KERN: ${{ steps.f.outputs.kern }}
          F_CLUSTER: ${{ steps.f.outputs.cluster }}
          F_SYNC: ${{ steps.f.outputs.sync }}
          F_PLATTFORM: ${{ steps.f.outputs.plattform }}
          F_SHELL: ${{ steps.f.outputs.shell }}
          F_PAKET: ${{ steps.f.outputs.paket }}
          F_ANDROID: ${{ steps.f.outputs.android }}
        run: |
          voll=false
          case "$EREIGNIS" in workflow_dispatch) voll=true ;; esac
          case "$REF" in refs/tags/*) voll=true ;; esac
          for n in kern sync cluster plattform shell paket android; do
            v=$(eval echo "\$F_$(echo $n | tr a-z A-Z)")
            if [ "$voll" = true ] || [ "$v" = true ]; then echo "$n=true" >> "$GITHUB_OUTPUT"; else echo "$n=false" >> "$GITHUB_OUTPUT"; fi
          done

  unit:
    name: dev / unit
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit

  shellcheck:
    name: dev / shellcheck
    needs: plan
    if: needs.plan.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning deploy/linux/*.sh scripts/test-cluster-install-docker.sh

  # --------------------------------------------------------------- test
  e2e:
    name: test / test:e2e
    needs: [plan, unit, shellcheck]
    # shellcheck darf übersprungen sein; fehlgeschlagen/abgebrochen blockiert.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.kern == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # NODE_ENV=test wird NICHT hier gesetzt: tests/e2e-sync/test-env.js und tests/e2e-cluster/test-env.js setzen es
      # selbst in ihren Server-Envs; npm run test:e2e braucht es nicht (keine NODE_ENV-gegateten Test-Endpunkte).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-e2e
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  # Sync-Suite (Hallen-Server + Client-Gerät): nur im PR und nur bei passenden Pfaden; Release/manuell nach Wunsch
  # über workflow_dispatch (dort gilt "alles"). Beim Release (inputs.release) läuft sie nicht erneut.
  e2e-sync:
    name: test / test:e2e:sync
    needs: [plan, unit, shellcheck]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.sync == 'true' && !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:sync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-sync
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  # ----------------------------------------------------------------- qa
  # Selbststart des eingebetteten PostgreSQL im Modus "server" (kein DB_HOST) auf allen Zielplattformen:
  # Instanz anlegen, migrieren, sauber beenden, neu starten, Absturz der App überstehen.
  server-selbststart:
    name: qa / selbststart (${{ matrix.os }})
    needs: [plan, e2e]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.plattform == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # macOS vorerst ausgelassen (Kosten); Release baut es weiterhin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Kein --ignore-scripts: die embedded-postgres-Plattformpakete richten ihre Symlinks im postinstall ein.
      - run: npm ci
      - run: node scripts/smoke-server-eingebettet.mjs

  # Cluster-Installationsskript: echter Aufbau eines Zwei-Server-Clusters in zwei systemd-Containern (Replikation,
  # Failover). VRRP über Docker-Netz; echte Hardware-Abnahme: deploy/linux/README.md.
  cluster-installation:
    name: qa / cluster-installation
    needs: [plan, e2e]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.cluster == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-cluster-install-docker.sh

  e2e-cluster:
    name: qa / test:e2e:cluster
    needs: [plan, e2e]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.cluster == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:cluster
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-cluster
          path: |
            test-results/
            playwright-report/
            data/test-cluster/logs/
          retention-days: 3
          if-no-files-found: ignore

  # Server-Paket (Installer-Build je Plattform, bis 45 Min.): erst nach dem E2E-Kern, nur bei passenden Pfaden. Bei Tag
  # baut release.yml es selbst (mit den signierten Client-Dateien).
  server-paket:
    name: qa / server-paket
    needs: [plan, e2e]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.paket == 'true' && !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
    uses: ./.github/workflows/server-paket.yml

  # Android-App kompilieren (Debug-APK ohne Release-Schlüssel): fängt Fehler im nativen Teil (mobil/android, z.B. das
  # Update-Plugin) ab, bevor sie erst beim Release auffallen. Bei Tag baut release.yml die signierte APK selbst.
  android-apk:
    name: qa / android-apk
    needs: [plan, unit]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.android == 'true' && !startsWith(github.ref, 'refs/tags/') && !inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Android-SDK-Pakete installieren
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run android:apk
