# Gestaffelte Pipeline: dev -> test + qa parallel (-> prod = release.yml, ruft diesen Workflow mit vollem Umfang auf).
#   dev  : schnell und billig (Ubuntu): Plan/Pfadfilter, Unit-Tests, shellcheck. Rot = qa startet nicht.
#   test : E2E-Kern (test:e2e in 3 Shards, test:e2e:sync) auf Ubuntu, startet direkt nach dem Plan parallel zu dev
#          (die E2E-Läufe sind der längste Pfad; auf grüne Unit-Tests zu warten, kostete ~3 min je PR).
#   qa   : parallel zu test, nach grünem dev: Plattform-/Infrastrukturläufe (Windows-Selbststart, macOS vorerst nur
#          im Release, Docker-Cluster, test:e2e:cluster). Installer (Server-Paket, Desktop-Client, Android-APK) baut
#          nur release.yml (Server-Paket zusätzlich per Hand: Actions -> Server-Paket).
# Pull Requests laufen mit Pfadfiltern (nur was die Änderung berührt); nach dem Merge läuft nichts erneut (kein Push-
# Trigger auf main, kein Nachtlauf). VOLLER Umfang ohne Filter: Release (Tag v*, über workflow_call) und manueller Start.
# Die Sync-Suite (test:e2e:sync) läuft nur im PR, und nur bei passenden Pfaden; das Release führt sie nicht erneut aus.
# Pfadfilter: .github/ci-filter.yml. Ein Release-PR (nur Versionssprung) läuft mit vollem Testumfang; ist er grün, legt
# der Job "ergebnis" die Marke ci-gruen-<Tree-Hash> ab und release.yml überspringt die Tests für genau diesen Stand.
# "CI-Ergebnis" ist der Pflicht-Check für main (übersprungene Jobs zählen als bestanden).
# test:e2e:vollablauf läuft bewusst NICHT hier (schreibt in die echte Cloud-DB).
name: CI
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      # true, wenn release.yml aufruft.
      release:
        type: boolean
        default: false

# Veraltete Läufe desselben Branches/PRs abbrechen; Tags und manuelle Läufe laufen immer zu Ende.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------- dev
  plan:
    name: dev / plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kern: ${{ steps.ergebnis.outputs.kern }}
      cluster: ${{ steps.ergebnis.outputs.cluster }}
      sync: ${{ steps.ergebnis.outputs.sync }}
      plattform: ${{ steps.ergebnis.outputs.plattform }}
      shell: ${{ steps.ergebnis.outputs.shell }}
      gate: ${{ steps.ergebnis.outputs.gate }}
    steps:
      # fetch-depth 2: im PR ist HEAD der Merge-Commit und HEAD^1 der Stand von main (Versionssprung-Erkennung).
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: dorny/paths-filter@v3
        id: f
        # Für Release/manuell nicht nötig, dort gilt "alles". Die Filter liest auch scripts/ci-lokal.mjs.
        if: github.event_name == 'pull_request'
        with:
          filters: .github/ci-filter.yml
      # Release-PR: ändert nur das Feld "version" in package.json/package-lock.json. Dann läuft der volle Testumfang (das
      # Release übernimmt dieses Ergebnis, siehe Job "ergebnis"); Installer baut nur das Release.
      - id: version
        if: github.event_name == 'pull_request'
        run: |
          geaendert=$(git diff --name-only HEAD^1 HEAD)
          nur=true
          [ -n "$geaendert" ] || nur=false
          for d in $geaendert; do case "$d" in package.json|package-lock.json) ;; *) nur=false ;; esac; done
          # Jede geänderte Zeile muss eine "version"-Zeile sein (Abhängigkeits-Updates ändern auch resolved/integrity).
          if [ "$nur" = true ] && git diff -U0 HEAD^1 HEAD -- package.json package-lock.json \
              | grep -E '^[+-][^+-]' | grep -vqE '^[+-][[:space:]]*"version": '; then nur=false; fi
          echo "Nur Versionssprung: $nur"
          echo "versionssprung=$nur" >> "$GITHUB_OUTPUT"
      - id: ergebnis
        env:
          EREIGNIS: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VERSIONSSPRUNG: ${{ steps.version.outputs.versionssprung }}
          F_KERN: ${{ steps.f.outputs.kern }}
          F_CLUSTER: ${{ steps.f.outputs.cluster }}
          F_SYNC: ${{ steps.f.outputs.sync }}
          F_PLATTFORM: ${{ steps.f.outputs.plattform }}
          F_SHELL: ${{ steps.f.outputs.shell }}
        run: |
          voll=false
          case "$EREIGNIS" in workflow_dispatch) voll=true ;; esac
          case "$REF" in refs/tags/*) voll=true ;; esac
          # gate=true: alle Test-Gruppen laufen; ein grüner Lauf gilt dann auch für das Release (Job "ergebnis").
          gate=true
          for n in kern sync cluster plattform shell; do
            v=$(eval echo "\$F_$(echo $n | tr a-z A-Z)")
            if [ "$VERSIONSSPRUNG" = true ]; then v=true; fi
            if [ "$voll" = true ] || [ "$v" = true ]; then w=true; else w=false; fi
            echo "$n=$w" >> "$GITHUB_OUTPUT"
            [ "$w" = true ] || gate=false
          done
          echo "gate=$gate" >> "$GITHUB_OUTPUT"

  unit:
    name: dev / unit
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit

  # VORÜBERGEHEND (nur zur Messung, wird vor dem Merge entfernt): Unit-Tests mit verschiedener Parallelität.
  messung-unit:
    name: messung / unit (concurrency ${{ matrix.n }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [3, 4, 6, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: nproc
      - run: node --test --test-concurrency=${{ matrix.n }} "tests/unit/**/*.test.js" | tail -12

  shellcheck:
    name: dev / shellcheck
    needs: plan
    if: needs.plan.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning deploy/linux/*.sh deploy/cloud/*.sh scripts/test-cluster-install-docker.sh

  # --------------------------------------------------------------- test
  # In 3 Shards aufgeteilt (Playwright --shard, nach Spec-Dateien): jeder Shard hat einen eigenen Runner mit eigenem
  # Server und eigener DB, die Spec-Dateien hängen nicht voneinander ab. Innerhalb eines Shards bleibt es seriell.
  e2e:
    name: test / test:e2e (${{ matrix.shard }}/3)
    # Startet gleich nach dem Plan, parallel zu unit/shellcheck (spart deren ~3 min auf dem kritischen Pfad);
    # ein roter dev-Job macht "CI-Ergebnis" trotzdem rot.
    needs: plan
    if: needs.plan.outputs.kern == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # NODE_ENV=test wird NICHT hier gesetzt: tests/e2e-sync/test-env.js und tests/e2e-cluster/test-env.js setzen es
      # selbst in ihren Server-Envs; npm run test:e2e braucht es nicht (keine NODE_ENV-gegateten Test-Endpunkte).
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-e2e-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  # Sync-Suite (Hallen-Server + Client-Gerät): nur im PR und nur bei passenden Pfaden; Release/manuell nach Wunsch
  # über workflow_dispatch (dort gilt "alles"). Beim Release (inputs.release) läuft sie nicht erneut.
  e2e-sync:
    name: test / test:e2e:sync
    needs: plan
    if: needs.plan.outputs.sync == 'true' && !inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:sync
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-sync
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  # ----------------------------------------------------------------- qa
  # Selbststart des eingebetteten PostgreSQL im Modus "server" (kein DB_HOST) auf allen Zielplattformen:
  # Instanz anlegen, migrieren, sauber beenden, neu starten, Absturz der App überstehen.
  server-selbststart:
    name: qa / selbststart (${{ matrix.os }})
    needs: [plan, unit, shellcheck]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.plattform == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]  # macOS vorerst ausgelassen (Kosten); Release baut es weiterhin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Kein --ignore-scripts: die embedded-postgres-Plattformpakete richten ihre Symlinks im postinstall ein.
      - run: npm ci
      - run: node scripts/smoke-server-eingebettet.mjs

  # Cluster-Installationsskript: echter Aufbau eines Zwei-Server-Clusters in zwei systemd-Containern (Replikation,
  # Failover). VRRP über Docker-Netz; echte Hardware-Abnahme: deploy/linux/README.md.
  cluster-installation:
    name: qa / cluster-installation
    needs: [plan, unit, shellcheck]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.cluster == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-cluster-install-docker.sh

  e2e-cluster:
    name: qa / test:e2e:cluster
    needs: [plan, unit, shellcheck]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.plan.outputs.cluster == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:cluster
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bericht-cluster
          path: |
            test-results/
            playwright-report/
            data/test-cluster/logs/
          retention-days: 3
          if-no-files-found: ignore

  # ------------------------------------------------------------ ergebnis
  # Pflicht-Check für main (Branch-Schutz): rot, sobald ein Job fehlschlug oder abgebrochen wurde; übersprungene Jobs
  # (Pfadfilter) zählen als bestanden. Lief der volle Testumfang (plan.gate) grün durch, legt er die Marke
  # ci-gruen-<Tree-Hash> ab: release.yml sucht sie für den Tree des Release-Commits und überspringt dann die Tests.
  # Im PR ist der getestete Stand der Merge-Commit; nach einem Squash-Merge eines aktuellen PR hat main denselben Tree.
  ergebnis:
    name: CI-Ergebnis
    needs: [plan, unit, shellcheck, e2e, e2e-sync, server-selbststart, cluster-installation, e2e-cluster]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Alle Jobs bestanden oder übersprungen
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$NEEDS" | jq -e '[.[].result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "Mindestens ein Job ist fehlgeschlagen oder wurde abgebrochen."; exit 1
          fi
      - uses: actions/checkout@v4
        if: needs.plan.outputs.gate == 'true' && !inputs.release
      - id: tree
        if: needs.plan.outputs.gate == 'true' && !inputs.release
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Die Marke gilt nur, wenn alle Test-Jobs wirklich gelaufen sind (nicht übersprungen).
          for j in unit shellcheck e2e e2e-sync server-selbststart cluster-installation e2e-cluster; do
            r=$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')
            [ "$r" = success ] || { echo "$j: $r, keine Marke"; exit 0; }
          done
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "Marke ci-gruen-$tree (Commit $GITHUB_SHA, Lauf $GITHUB_RUN_ID)"
          printf 'tree=%s\ncommit=%s\nlauf=%s\n' "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" > ci-gruen.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.tree.outputs.tree
        with:
          name: ci-gruen-${{ steps.tree.outputs.tree }}
          path: ci-gruen.txt
          retention-days: 30
