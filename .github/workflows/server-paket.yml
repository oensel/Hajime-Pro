# Server-Paket "Hajime Pro Server" (Notebook als Hallen-Server und Frontend in einem) bauen und testen:
# Build je Plattform, Rauchtest der gebauten App (Server startet mit eigenem PostgreSQL, Frontend, sauberes
# Beenden), unter Windows zusätzlich Installer samt Firewall-Regel. Auch aus release.yml aufrufbar.
name: Server-Paket
on:
  pull_request:
    paths:
      - 'desktop/server/**'
      - 'desktop/build/**'
      - 'desktop/electron-builder.server.yml'
      - 'tests/electron-server/**'
      - 'src/utils/eingebettetesPostgres.js'
      - 'src/sync/clientDateien.js'
      - 'package.json'
      - '.github/workflows/server-paket.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      # Im Release: die in release.yml signierten Client-Dateien (Artefakt client-signiert) ins Paket legen.
      client-dateien:
        type: boolean
        default: false

jobs:
  paket:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # node-gyp braucht distutils (Python <= 3.11); leveldown@5 (pouchdb-node) wird für Electron neu gebaut.
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci
      - name: Signierte Client-Dateien zum Mitliefern holen
        if: inputs.client-dateien
        uses: actions/download-artifact@v4
        with: { name: client-signiert, path: client-dateien }
      - run: npm run desktop:server:build
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      # Der Rauchtest prüft dann zusätzlich, dass der Server die mitgelieferten Client-Dateien bereitstellt.
      - name: Rauchtest erwartet mitgelieferte Client-Dateien
        if: inputs.client-dateien
        shell: bash
        run: echo "HAJIME_CLIENT_DATEIEN_ERWARTET=1" >> "$GITHUB_ENV"

      - name: Rauchtest (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron:server
        env: { HAJIME_APP_PFAD: 'dist-server\win-unpacked\Hajime Pro Server.exe' }
      - name: Rauchtest (macOS)
        if: runner.os == 'macOS'
        run: npm run test:electron:server
        env: { HAJIME_APP_PFAD: 'dist-server/mac-arm64/Hajime Pro Server.app/Contents/MacOS/Hajime Pro Server' }
      - name: Rauchtest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron:server
        env: { HAJIME_APP_PFAD: 'dist-server/linux-unpacked/hajime-pro-server' }

      # Der Installer legt die Firewall-Regel für das private Netzwerk an (desktop/build/server-installer.nsh).
      - name: Installer-Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-server -Filter 'Hajime-Pro-Server-*.exe' | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $regel = netsh advfirewall firewall show rule name="Hajime Pro Server"
          Write-Host $regel
          if ($LASTEXITCODE -ne 0) { throw 'Firewall-Regel "Hajime Pro Server" fehlt nach der Installation' }
          if (-not (Test-Path 'C:\Program Files\Hajime Pro Server\Hajime Pro Server.exe')) { throw 'Programm nicht installiert' }

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ runner.os }}
          path: |
            dist-server/*.exe
            dist-server/*.dmg
            dist-server/*.zip
            dist-server/*.AppImage
          if-no-files-found: error
