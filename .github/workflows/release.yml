# Stage prod: Release bei Tag v* (npm version <patch|minor|major> && git push --follow-tags) ODER per Hand im Browser
# (Actions -> Release -> Run workflow, Branch main, Version z.B. 1.0.11): dann legt die Pipeline den Tag am Ende selbst an.
# Versionsprüfung -> Tests (entfallen, wenn der Release-PR genau diesen Stand schon voll getestet hat) -> Build je
# Plattform (+ Rauchtest) + Android-APK -> signieren -> Server-Paket (mit den signierten Client-Dateien) -> GitHub-Release.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v (muss package.json auf dem gewählten Branch entsprechen), z.B. 1.0.11'
        required: true
        type: string

# Tag des Releases: beim Tag-Push dessen Name, beim manuellen Start v<Eingabe> (der Tag entsteht erst mit dem Release).
env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

# pull-requests: read braucht ci.yml (paths-filter); ein aufgerufener Workflow darf nicht mehr Rechte anfordern als der
# aufrufende, sonst endet der Lauf sofort mit startup_failure.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Hat die CI genau diesen Stand (gleicher Tree-Hash) schon im vollen Umfang grün getestet, typischerweise im Release-PR,
  # liegt die Marke ci-gruen-<Tree-Hash> vor (Job "ergebnis" in ci.yml) und die Tests entfallen hier. Sonst (z.B. wurde
  # nach dem Release-PR noch ein anderer PR gemergt) laufen sie wie bisher. Nur Marken aus Läufen dieses Repos zählen,
  # nicht aus Fork-PRs (die können ci.yml selbst verändern).
  # Erst nach "pruefen": passen Tag und package.json-Version nicht (z.B. Release gestartet, ohne dass der Release-PR die
  # Version hochgesetzt hat), endet der Lauf nach Sekunden, statt die Tests umsonst laufen zu lassen.
  vorgeprueft:
    needs: pruefen
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      gruen: ${{ steps.marke.outputs.gruen }}
    steps:
      - uses: actions/checkout@v4
      - id: marke
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          lauf=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-gruen-$tree&per_page=100" \
            --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $GITHUB_REPOSITORY_ID)][0].workflow_run.id // empty")
          if [ -n "$lauf" ]; then
            echo "Tree $tree wurde im CI-Lauf $lauf voll getestet: Tests entfallen."
            echo "### Tests übernommen aus CI-Lauf [$lauf]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$lauf)" >> "$GITHUB_STEP_SUMMARY"
            echo "gruen=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Marke für Tree $tree: Tests laufen."
            echo "gruen=false" >> "$GITHUB_OUTPUT"
          fi

  tests:  # dev + test + qa im vollen Umfang (ci.yml, Tag => keine Pfadfilter), falls nicht schon vorgeprüft
    needs: vorgeprueft
    if: needs.vorgeprueft.outputs.gruen != 'true'
    uses: ./.github/workflows/ci.yml
    with: { release: true }

  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag muss package.json-Version entsprechen
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$RELEASE_TAG" || { echo "Tag $RELEASE_TAG passt nicht zu Version $VERSION"; exit 1; }
          # Manueller Start: nur vom Branch main und nur, wenn es den Tag noch nicht gibt (sonst würde er ein Release überschreiben).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/main" || { echo "Manueller Release nur vom Branch main (gewählt: $GITHUB_REF)"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then echo "Tag $RELEASE_TAG existiert schon"; exit 1; fi
          fi

  build:
    needs: [vorgeprueft, tests, pruefen]
    if: ${{ !cancelled() && !failure() && (needs.tests.result == 'success' || needs.vorgeprueft.outputs.gruen == 'true') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS vorerst nicht (node-gyp baut canvas aus den Quellen und braucht pangocairo; der macOS-Zweig unten bleibt für später).
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Python 3.11 bleibt vorsorglich gepinnt: Node-Addons (leveldown@5 aus pouchdb-node hat kein Prebuild
      # für macOS arm64) werden beim npm ci bzw. durch electron-builder aus den Quellen gebaut, und ältere
      # node-gyp-Versionen brauchen distutils, das es ab Python 3.12 nicht mehr gibt.
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run desktop:build
        if: runner.os != 'macOS'
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      # Universal-Build mit nativen Modulen je Architektur aus den Quellen (siehe electron-builder.mac.yml).
      - run: npx electron-builder --config desktop/electron-builder.mac.yml
        if: runner.os == 'macOS'
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Rauchtest (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron
        env: { HAJIME_APP_PFAD: 'dist-desktop\win-unpacked\Hajime Pro.exe' }
      - name: Rauchtest (macOS)
        if: runner.os == 'macOS'
        run: npm run test:electron
        env: { HAJIME_APP_PFAD: 'dist-desktop/mac-universal/Hajime Pro.app/Contents/MacOS/Hajime Pro' }
      - name: Rauchtest (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:electron
        env: { HAJIME_APP_PFAD: 'dist-desktop/linux-unpacked/hajime-pro' }
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ runner.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.AppImage
          if-no-files-found: error

  # Android-App (mobil/): signierte APK. Der Keystore liegt als Secret vor (Einrichtung: mobil/README.md,
  # `npm run android:schluessel`) — ohne ihn gäbe es nur eine Debug-APK, über die sich später keine neue Version
  # installieren ließe, daher bricht der Job dann ab.
  android:
    needs: [vorgeprueft, tests, pruefen]
    if: ${{ !cancelled() && !failure() && (needs.tests.result == 'success' || needs.vorgeprueft.outputs.gruen == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Wie beim Desktop-Build: node-gyp braucht distutils (Python <= 3.11) für native Module beim npm ci.
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # Das Android-SDK ist auf dem Runner vorinstalliert; android-actions/setup-android scheitert an dessen sdkmanager
      # ("Wrong version in preinstalled sdkmanager"), daher Lizenzen und Pakete direkt über den vorhandenen sdkmanager.
      - name: Android-SDK-Pakete installieren
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - name: Keystore bereitstellen
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 fehlt (Settings -> Secrets and variables -> Actions), siehe mobil/README.md."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hajime-android.jks"
        env: { ANDROID_KEYSTORE_BASE64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
      - run: npm run android:apk
        env:
          HAJIME_KEYSTORE: ${{ runner.temp }}/hajime-android.jks
          HAJIME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HAJIME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HAJIME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-Android
          path: dist-android/*.apk
          if-no-files-found: error

  # Alle Client-Dateien (Windows, Linux, Android; macOS derzeit nicht) einmal signieren und version.json erzeugen. Das
  # Ergebnis geht ins Server-Paket (wird dort mitgeliefert) und ins GitHub-Release.
  signieren:
    needs: [build, android]
    # Übersprungene Tests (vorgeprüft) würden die Kette sonst überspringen (skipped wirkt über alle Vorgänger).
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: release, pattern: 'client-*', merge-multiple: true }
      - name: Signaturschlüssel und öffentlichen Schlüssel prüfen
        run: |
          test -f desktop/update-schluessel.pub || { echo "desktop/update-schluessel.pub fehlt im Repo — 'npm run client:schluessel' einmalig laufen lassen und committen (siehe desktop/README.md)."; exit 1; }
          test -n "$CLIENT_SIGNATUR_SCHLUESSEL" || { echo "Secret CLIENT_SIGNATUR_SCHLUESSEL fehlt (Settings -> Secrets and variables -> Actions), siehe desktop/README.md."; exit 1; }
        env: { CLIENT_SIGNATUR_SCHLUESSEL: '${{ secrets.CLIENT_SIGNATUR_SCHLUESSEL }}' }
      - name: Signieren und version.json erzeugen
        run: node scripts/signiere-client.mjs release "${RELEASE_TAG#v}"
        env: { CLIENT_SIGNATUR_SCHLUESSEL: '${{ secrets.CLIENT_SIGNATUR_SCHLUESSEL }}' }
      - name: Alle Plattformen (ohne macOS) müssen enthalten sein
        run: |
          for p in win32-x64 linux-x64 android; do
            node -e "const v=require('./release/version.json'); if(!v.dateien['$p']) { console.error('Plattform $p fehlt in version.json'); process.exit(1); }"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: client-signiert
          path: release/*
          if-no-files-found: error

  # Server-Paket "Hajime Pro Server" (Notebook als Hallen-Server): Build + Rauchtest je Plattform, gleiche Version wie der
  # Client. Enthält die signierten Client-Dateien — ein frisch installierter Server stellt sie ohne Internet bereit.
  server-paket:
    needs: [vorgeprueft, tests, pruefen, signieren]
    if: ${{ !cancelled() && !failure() && (needs.tests.result == 'success' || needs.vorgeprueft.outputs.gruen == 'true') }}
    uses: ./.github/workflows/server-paket.yml
    with: { client-dateien: true, macos: false }

  # Quellpaket für den Linux-Dienst ohne Desktop (deploy/linux/install.sh, systemd): src/node_modules-frei, der Dienst baut es
  # beim Selbst-Update mit npm ci auf (src/utils/dienstUpdate.js). Wird in server-version.json mitsigniert.
  dienst-paket:
    needs: [pruefen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dienst-Paket packen
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dienst
          tar czf "dienst/Hajime-Pro-Dienst-${VERSION}.tar.gz" --transform 's,^,hajime-pro/,' \
            src public teilnehmer-app migrations knexfile.cjs package.json package-lock.json deploy \
            scripts/cloud-lokal.mjs scripts/cloud-update.mjs scripts/lokale-pg.mjs \
            update.sh desktop/updateLogik.js desktop/update-schluessel.pub desktop/server/selbstUpdate.js
      - uses: actions/upload-artifact@v4
        with:
          name: server-Dienst
          path: dienst/*.tar.gz
          if-no-files-found: error

  veroeffentlichen:
    needs: [signieren, server-paket, dienst-paket]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: client-signiert, path: release }
      # Die Server-Installer liegen getrennt: sie werden nicht mit dem Client-Schema signiert (kein Selbst-Update,
      # Installation von Hand) und dürfen die Zuordnung je Plattform/Rolle in version.json nicht stören.
      - uses: actions/download-artifact@v4
        with: { path: release-server, pattern: 'server-*', merge-multiple: true }
      # Der Windows-Server aktualisiert sich beim Start selbst (desktop/server/selbstUpdate.js): er prüft den Installer
      # gegen diese Ed25519-Signatur, daher entsteht hier server-version.json (eigene Datei, nicht version.json).
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # holen.sh liegt als eigenes Asset im Release (Einzeiler-Installation, siehe deploy/linux/holen.sh). Es muss VOR dem
      # Signieren ins Verzeichnis, damit es in server-version.json (Prüfsumme + Signatur) und SHA256SUMS-Server.txt steht.
      - name: Hol-Skript beilegen
        run: cp deploy/linux/holen.sh release-server/hajime-holen.sh
      - name: Server-Installer signieren (server-version.json)
        run: node scripts/signiere-client.mjs release-server "${RELEASE_TAG#v}" server-version.json
        env: { CLIENT_SIGNATUR_SCHLUESSEL: '${{ secrets.CLIENT_SIGNATUR_SCHLUESSEL }}' }
      - name: Prüfsummen der Server-Installer
        run: (cd release-server && sha256sum * > SHA256SUMS-Server.txt)
      # Quelle der Cloud: Installer und Update-Pakete liegen als Release im PRIVATEN Repository, die Cloud spiegelt sie mit einem
      # Lesetoken (RELEASE_QUELLE_REPO/RELEASE_QUELLE_TOKEN, docs/specs/2026-10-24-downloads-ueber-cloud-design.md). Das Release
      # legt bei einem manuellen Start auch den Quell-Tag auf dem getesteten Commit an.
      - name: GitHub-Release im privaten Repository anlegen (Quelle der Cloud)
        run: |
          gh release create "$RELEASE_TAG" release/* release-server/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Hajime Pro $RELEASE_TAG" --latest \
            --notes "Hajime Pro $RELEASE_TAG (Quellstand $GITHUB_SHA). Wird von der Cloud gespiegelt und dort zum Download angeboten."
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      # Übergangszeit: Bestandsinstallationen holen ihre Updates noch aus dem öffentlichen Repository, bis sie einen Geräteschlüssel
      # der Cloud haben. Danach dieses Repository, den Schritt und das Secret RELEASES_REPO_TOKEN entfernen.
      - name: GitHub-Release im öffentlichen Repository anlegen (Übergang)
        run: |
          gh release create "$RELEASE_TAG" release/* release-server/* --repo "$RELEASES_REPO" \
            --title "Hajime Pro $RELEASE_TAG" --latest \
            --notes "Hajime Pro $RELEASE_TAG (Quellstand $GITHUB_SHA). Installation und Update: siehe README."
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASES_REPO: oensel/Hajime-Pro-Releases

  # Cloud-Server (netcup, Docker Compose, kein Git-Checkout): spielt den getesteten Commit des Releases auf. Der Server nimmt ihn über
  # einen erzwungenen SSH-Befehl an (deploy/cloud/annahme.sh, Einrichtung: deploy/cloud/README.md), sichert die Datenbank, baut,
  # prüft die Gesundheit und rollt bei einem Fehler selbst zurück. Läuft nur, wenn die Variable CLOUD_SSH_HOST gesetzt ist;
  # der Release ist zu diesem Zeitpunkt schon veröffentlicht, ein Fehler hier macht ihn nicht rückgängig.
  cloud-ausrollen:
    needs: [veroeffentlichen]
    if: ${{ !cancelled() && needs.veroeffentlichen.result == 'success' && vars.CLOUD_SSH_HOST != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: cloud-ausrollen, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Quellstand packen
        run: git archive --format=tar.gz -o "$RUNNER_TEMP/hajime.tgz" "$GITHUB_SHA"
      - name: SSH vorbereiten
        run: |
          test -n "$CLOUD_DEPLOY_SCHLUESSEL" || { echo "Secret CLOUD_DEPLOY_SCHLUESSEL fehlt, siehe deploy/cloud/README.md."; exit 1; }
          test -n "$CLOUD_SSH_KNOWN_HOSTS" || { echo "Variable CLOUD_SSH_KNOWN_HOSTS fehlt, siehe deploy/cloud/README.md."; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLOUD_DEPLOY_SCHLUESSEL" > ~/.ssh/cloud-deploy
          chmod 600 ~/.ssh/cloud-deploy
          printf '%s\n' "$CLOUD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          CLOUD_DEPLOY_SCHLUESSEL: ${{ secrets.CLOUD_DEPLOY_SCHLUESSEL }}
          CLOUD_SSH_KNOWN_HOSTS: ${{ vars.CLOUD_SSH_KNOWN_HOSTS }}
      - name: Auf den Cloud-Server ausrollen
        run: |
          ssh -i ~/.ssh/cloud-deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "root@$CLOUD_SSH_HOST" "$GITHUB_SHA" < "$RUNNER_TEMP/hajime.tgz"
        env: { CLOUD_SSH_HOST: '${{ vars.CLOUD_SSH_HOST }}' }
      - name: Öffentliche Adresse prüfen
        if: ${{ vars.CLOUD_URL != '' }}
        run: |
          for versuch in 1 2 3 4 5 6; do
            curl -fsS -m 10 "$CLOUD_URL/api/config" && exit 0
            sleep 10
          done
          echo "Die Cloud antwortet unter $CLOUD_URL nicht."
          exit 1
        env: { CLOUD_URL: '${{ vars.CLOUD_URL }}' }
