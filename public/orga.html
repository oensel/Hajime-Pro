<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Orga-Planer</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/matten.css">
    <link rel="stylesheet" href="/css/orga.css">
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card matten-management-card orga-card">
    <div class="og-kopf">
        <div>
            <h1 id="ogTurnierName">Orga-Planer</h1>
            <p class="og-untertitel" id="ogTurnierInfo"></p>
        </div>
        <div class="og-werkzeuge">
            <button type="button" class="btn btn-outlined" id="ogNurMeine" aria-pressed="false">Nur meine Aufgaben</button>
            <div class="og-umschalter" role="group" aria-label="Gruppierung">
                <button type="button" class="og-umschalter-knopf" id="ogNachPhase" aria-pressed="true">Nach Phase</button>
                <button type="button" class="og-umschalter-knopf" id="ogNachPerson" aria-pressed="false">Nach Person</button>
            </div>
            <button type="button" class="btn btn-raised" id="ogNeueAufgabe" aria-label="Aufgabe hinzufügen">
                <span class="material-icons">add</span> Aufgabe
            </button>
        </div>
    </div>

    <div id="ogMeldung" class="og-meldung" role="status"></div>

    <div class="og-kennzahlen" id="ogKennzahlen" hidden>
        <div class="og-karte"><span class="og-karte-zahl" id="ogErledigt"></span><span class="og-karte-text">Erledigt</span></div>
        <div class="og-karte og-karte-rot" id="ogKarteUeberfaellig"><span class="og-karte-zahl" id="ogUeberfaellig"></span><span class="og-karte-text">Überfällig</span></div>
        <div class="og-karte"><span class="og-karte-zahl" id="ogOhne"></span><span class="og-karte-text">Ohne Zuständigen</span></div>
    </div>

    <div id="ogInhalt"></div>
</div>

<script type="module" src="/js/orga.js"></script>
</body>
</html>
