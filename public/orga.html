<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Orga-Planer</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/matten.css">
    <link rel="stylesheet" href="/css/orga.css">
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card matten-management-card orga-card">
    <div class="og-kopf">
        <div class="og-titelblock">
            <h1 id="ogTurnierName">Orga-Planer</h1>
            <span class="og-untertitel" id="ogTurnierInfo"></span>
        </div>
        <div class="og-kennzahlen" id="ogKennzahlen" hidden>
            <span class="og-kennzahl"><b id="ogErledigt"></b> erledigt</span>
            <span class="og-kennzahl" id="ogKarteUeberfaellig"><b id="ogUeberfaellig"></b> überfällig</span>
            <span class="og-kennzahl"><b id="ogOhne"></b> ohne Zuständigen</span>
        </div>
        <div class="og-werkzeuge">
            <button type="button" class="btn btn-outlined" id="ogNurMeine" aria-pressed="false">Nur meine Aufgaben</button>
            <button type="button" class="btn btn-outlined" id="ogVorlageNachladen" title="Fehlende Standardaufgaben der Vorlage ergänzen">Vorlage nachladen</button>
            <button type="button" class="btn btn-outlined" id="ogNeueKategorie">
                <span class="material-icons">create_new_folder</span> Neue Kategorie
            </button>
            <button type="button" class="btn btn-raised" id="ogNeueAufgabe" aria-label="Aufgabe hinzufügen">
                <span class="material-icons">add</span> Aufgabe
            </button>
        </div>
    </div>

    <div id="ogMeldung" class="og-meldung" role="status"></div>

    <div id="ogInhalt"></div>
</div>

<script type="module" src="/js/orga.js"></script>
</body>
</html>
