<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Lastschriftmandat</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 16px !important;
            background: #111827 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
            box-sizing: border-box;
        }
        .login-card {
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 8px;
            padding: 32px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #f3f4f6;
            box-sizing: border-box;
            text-align: center;
        }
        .login-title { font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: #3b82f6; margin: 0 0 8px 0; }
        .login-subtitle { font-size: 13px; color: #9ca3af; font-weight: 600; margin: 0 0 24px 0; }
        .anfrage {
            text-align: left;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }
        .anfrage .wert { font-weight: 700; color: #f3f4f6; word-break: break-word; }
        .anfrage .feld { color: #9ca3af; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 6px; }
        .mandatstext {
            text-align: left;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.5;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 6px;
            padding: 12px 14px;
            max-height: 260px;
            overflow: auto;
            margin-bottom: 16px;
            display: none;
        }
        .haken { text-align: left; font-size: 14px; margin-bottom: 20px; display: none; cursor: pointer; }
        .haken input { margin-right: 8px; }
        .knoepfe { display: none; gap: 12px; }
        .btn-login {
            flex: 1;
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #2563eb; }
        .btn-ablehnen { background: #4b5563; }
        .btn-ablehnen:hover { background: #b91c1c; }
        .btn-login:disabled { background: #374151; cursor: default; }
        .meldung { font-size: 15px; font-weight: 700; line-height: 1.5; color: #f3f4f6; display: none; }
        .error-message { margin-top: 16px; color: #ef4444; font-size: 13px; font-weight: 700; display: none; }
        .link { color: #93c5fd; font-size: 13px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

<div class="login-card">
    <div style="font-size: 48px; margin-bottom: 16px;">🥋</div>
    <h1 class="login-title">Hajime Pro</h1>
    <p class="login-subtitle">SEPA-Lastschriftmandat bestätigen</p>

    <div id="anfrage" class="anfrage">
        <div class="feld">Verein (Zahlungspflichtiger)</div>
        <div class="wert" id="mandatVerein"></div>
        <div class="feld">Turnier</div>
        <div class="wert" id="mandatTurnier"></div>
        <div class="feld">Konto</div>
        <div class="wert" id="mandatKonto"></div>
        <div class="feld">Kontoinhaber</div>
        <div class="wert" id="mandatInhaber"></div>
        <div class="feld">Mandatsreferenz</div>
        <div class="wert" id="mandatReferenz"></div>
    </div>
    <div id="mandatstext" class="mandatstext"></div>

    <!-- Ein bloßer Aufruf des Links ändert nichts (Mail-Programme rufen Links vorab ab); entschieden wird per Knopf (POST). -->
    <label class="haken" id="vertretungGruppe">
        <input type="checkbox" id="vertretung">
        <span>Ich bin berechtigt, den Verein zu vertreten, und bestätige das Mandat.</span>
    </label>
    <div class="knoepfe" id="knoepfe">
        <button type="button" id="bestaetigenKnopf" class="btn-login" disabled>Bestätigen</button>
        <button type="button" id="ablehnenKnopf" class="btn-login btn-ablehnen">Ablehnen</button>
    </div>

    <p id="ergebnis" class="meldung" role="status"></p>
    <div id="errorMessage" class="error-message" role="alert"></div>
    <a href="/login.html" class="link">Zur Anmeldung</a>
</div>

<script src="/js/mandatBestaetigen.js"></script>
<script src="/js/rechtsfuss.js"></script>
</body>
</html>
