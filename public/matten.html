<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Matten</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/matten.css">
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card matten-management-card">
    <div class="form-title-area matten-titelzeile">
        <span id="mattenStand" class="matten-stand" title="Zeitpunkt der letzten Aktualisierung; die Restzeiten der Matten beziehen sich darauf"></span>
        <h1>Kampfflächen</h1>
        <div class="matten-toolbar">
            <button type="button" class="btn btn-outlined icon-btn" id="aktualisierenBtn" aria-label="Aktualisieren" data-tooltip="Aktualisieren">
                <span class="material-icons">refresh</span>
            </button>
            <span class="toolbar-sep"></span>
            <button type="button" class="btn btn-outlined icon-btn" id="aufteilenBtn" aria-label="Pools aufteilen" data-tooltip="Pools aufteilen (nur Pools ohne Matte)">
                <span class="material-icons">auto_awesome</span>
            </button>
            <button type="button" class="btn btn-outlined icon-btn" id="alleNeuVerteilenBtn" aria-label="Alle neu verteilen" data-tooltip="Alle neu verteilen (Pools ohne begonnene Kämpfe)">
                <span class="material-icons">shuffle</span>
            </button>
            <span class="toolbar-sep"></span>
            <button type="button" class="btn btn-outlined icon-btn" id="alleDruckenBtn" aria-label="Alle Pools drucken" data-tooltip="Alle Pools drucken" disabled>
                <span class="material-icons">print</span>
            </button>
            <button type="button" class="btn btn-outlined icon-btn icon-btn-danger" id="alleZuordnungenLoeschenBtn" aria-label="Alle Zuordnungen löschen" data-tooltip="Alle Zuordnungen löschen">
                <span class="material-icons">delete_sweep</span>
            </button>
        </div>
    </div>

    <div id="mattenContainer">
        Kampfflächen werden geladen...
    </div>
</div>

<script src="/js/matten.js"></script>
</body>
</html>
