<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Übersicht</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/schriften.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .uebersicht-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 14px 18px;
            box-sizing: border-box;
        }

        .uebersicht-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .uebersicht-title-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .uebersicht-title-area .material-icons {
            font-size: 26px;
            color: var(--primary);
        }

        .uebersicht-title-area h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mats-grid {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* Nicht zugeordnete Pools können zahlreich sein — im Gegensatz zu den (wenigen) Matten
           sollen sie daher umbrechen statt in eine einzige, immer schmaler werdende Zeile
           gequetscht zu werden. */
        .unzugeordnet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }

        .mat-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1 1 0;
            min-width: 0;
        }

        .mat-header {
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 6px;
        }

        .mat-header .material-icons {
            color: var(--primary);
            font-size: 16px;
        }

        .mat-name {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
        }

        /* Die Pools innerhalb einer Matte dürfen sich auf zwei Spalten verteilen, damit die
           jetzt volle Breite auch bei vielen Pools pro Matte sinnvoll genutzt wird. */
        .mat-pools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            align-content: start;
        }

        .pool-block {
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
        }

        .pool-block-header {
            background: rgba(30, 58, 138, 0.08);
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .teilnehmer-liste {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .teilnehmer-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 600;
            border-top: 1px solid var(--border);
        }

        .teilnehmer-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .teilnehmer-verein {
            color: var(--text-muted);
            font-size: 9px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90px;
        }

        .pool-leer {
            padding: 5px 8px;
            color: var(--text-muted);
            font-size: 10px;
            font-style: italic;
        }

        .unassigned-section {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .empty-text {
            color: var(--text-muted);
            font-size: 11px;
            font-style: italic;
        }

        .hinweis-box {
            background: rgba(255, 152, 0, 0.1);
            border: 1px solid #ff9800;
            color: #e65100;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
        }
    </style>
</head>
<body>
<script src="/js/zurueckMenue.js"></script>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="uebersicht-container">
    <div class="uebersicht-header">
        <div class="uebersicht-title-area">
            <span class="material-icons">travel_explore</span>
            <h1>Wer kämpft wo?</h1>
        </div>
    </div>

    <div id="hinweisContainer"></div>

    <div class="mats-grid" id="matsGrid">
        <!-- Dynamisch per JS befüllt -->
    </div>

    <div class="unassigned-section" id="unassignedSection" style="display: none;">
        <div class="section-title">Noch keiner Matte zugeordnet</div>
        <div class="unzugeordnet-grid" id="unassignedGrid"></div>
    </div>
</div>

<script src="/js/uebersicht.js"></script>
</body>
</html>
