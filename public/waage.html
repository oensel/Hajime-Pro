<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Turniermanager</title>
    <!-- Erst die gemeinsamen Styles laden, danach die exklusiven Teile -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/waage.css">
    <script src="/js/menu.js"></script>
    <!-- jsQR-Bibliothek global im Window-Scope initialisieren -->
    <script src="/js/qr/jsQR.js"></script>
</head>
<body>

<!-- Feste Hintergrund-Wasserzeichen -->
<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<!-- Hauptkarte für die Waage-Eingabe -->
<div class="mdc-card">
    <!-- Titelbereich: Mittige H1 flankiert von symmetrischen Pokalen und dem Scan-Button -->
    <div class="form-title-area">
        <span class="material-icons">scale</span>
        <h1 id="formTitle">Waage</h1>

        <!-- Symmetrischer Aktivierungsknopf für den Webcam-QR-Scanner -->
        <button type="button" class="theme-toggle" id="startScanBtn" title="QR-Pass scannen" style="position:static; width:auto; height:auto; padding:6px 12px; border-radius:4px; display:flex; align-items:center; gap:6px;">
            <span class="material-icons">qr_code_scanner</span>
            <span style="font-size:11px; font-weight:700; text-transform:uppercase;">Scan</span>
        </button>
    </div>

    <!-- REAKTIVE WEBCAM SCANNER AREA -->
    <div id="scannerContainer" style="display: none; flex-direction: column; align-items: center; margin-bottom: 24px; border: 2px solid var(--border); padding: 12px; border-radius: 4px; background: rgba(0,0,0,0.02);">
        <div style="position: relative; width: 100%; max-width: 400px; aspect-ratio: 4/3; background: #000; border-radius: 4px; overflow: hidden;">
            <video id="previewVideo" playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
            <!-- Visuelles Fadenkreuz zur exakten Positionierung des Judo-Passes -->
            <div style="position: absolute; top: 25%; left: 25%; width: 50%; height: 50%; border: 2px dashed var(--primary); box-shadow: 0 0 0 999px rgba(0,0,0,0.5); pointer-events: none;"></div>
        </div>
        <button type="button" class="btn btn-outlined" id="stopScanBtn" style="margin-top: 12px; padding: 6px 16px; font-size: 12px;">Scanner schließen</button>
    </div>

    <!-- Das Einwieg-Formular -->
    <form id="teilnehmerForm">
        <div class="grid-2">
            <div class="form-group">
                <label for="vorname">Vorname</label>
                <input type="text" id="vorname" required placeholder="z.B. Max">
            </div>
            <div class="form-group">
                <label for="nachname">Nachname</label>
                <input type="text" id="nachname" required placeholder="z.B. Mustermann">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="judopass_id">Judopass-Nummer (ID)</label>
                <input type="text" id="judopass_id" required placeholder="z.B. JP-1111">
            </div>
            <div class="form-group">
                <label for="lizenz_ablauf">Lizenz Gültig Bis</label>
                <input type="date" id="lizenz_ablauf" required style="background-color: rgba(0,0,0,0.02);">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="geburtsdatum">Geburtsdatum</label>
                <input type="date" id="geburtsdatum" required>
            </div>
            <div class="form-group">
                <label for="verein">Verein</label>
                <input type="text" id="verein" placeholder="z.B. Judo Club Senden">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="graduierung">Graduierung</label>
                <select id="graduierung">
                    <option value="">Keine Angabe</option>
                </select>
            </div>
            <div></div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="geschlecht">Geschlecht</label>
                <select id="geschlecht" required>
                    <option value="" disabled selected hidden>Bitte wählen...</option>
                    <option value="männlich">männlich</option>
                    <option value="weiblich">weiblich</option>
                    <option value="mixed">mixed</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gewicht">Gewicht (kg)</label>
                <input type="text" id="gewicht" required placeholder="z.B. 34,50" inputmode="decimal">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="altersklasse">Altersklasse</label>
                <!-- Neu: Selectbox für dynamische DJB-Vorauswahl -->
                <select id="altersklasse" required>
                    <option value="" disabled selected hidden>Bitte wählen...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="gewichtsklasse">Gewichtsklasse</label>
                <!-- Neu: Selectbox, die fest an die Altersklasse gekoppelt ist -->
                <select id="gewichtsklasse" required>
                    <option value="" disabled selected hidden>Bitte Altersklasse wählen...</option>
                </select>
            </div>
        </div>

        <div class="grid-2" style="margin-top: 10px; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0;">
                <input type="checkbox" id="startgeld_bezahlt" style="width: 20px; height: 20px; cursor: pointer; accent-color: var(--primary); margin: 0;">
                <label for="startgeld_bezahlt" style="margin: 0; cursor: pointer; font-weight: bold; user-select: none; display: inline-block; text-transform: none; font-size: 14px; letter-spacing: normal;">Startgeld bezahlt</label>
            </div>
            <div></div>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-outlined" id="resetBtn">Eingabe Löschen</button>
            <button type="button" class="btn btn-outlined" id="kampfbereitBtn" style="display: none; color: #2e7d32; border-color: #2e7d32;">Kampfbereit bestätigen</button>
            <button type="submit" class="btn btn-raised" id="submitBtn" disabled style="pointer-events: none; opacity: 0.35;">Eintrag Speichern</button>
        </div>
    </form>
</div>

<!-- OPTISCH ANSPRECHENDER MATERIAL CONFIRM DIALOG -->
<div id="customConfirmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); z-index: 9999; align-items: center; justify-content: center; transition: all 0.2s;">
    <div class="mdc-card" style="max-width: 420px; padding: 24px; border-radius: 4px; border: 2px solid var(--border); box-shadow: var(--shadow); background-color: var(--bg-card); animation: modalPulse 0.2s ease-out;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <span class="material-icons" id="modalIcon" style="font-size: 28px; color: var(--primary);">help_outline</span>
            <h2 id="modalTitle" style="margin: 0; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Aktion bestätigen</h2>
        </div>
        <p id="modalMessage" style="margin: 0 0 24px 0; font-size: 14px; line-height: 1.5; color: var(--text-main);"></p>
        <div style="display: flex; justify-content: flex-end; gap: 12px;">
            <button type="button" class="btn btn-outlined" id="modalCancelBtn" style="padding: 8px 20px; font-size: 12px;">Abbrechen</button>
            <button type="button" class="btn btn-raised" id="modalConfirmBtn" style="padding: 8px 20px; font-size: 12px;">Fortfahren</button>
        </div>
    </div>
</div>

<!-- WICHTIG: Skript muss als Typ Module geladen werden -->
<script type="module" src="/js/waage.js"></script>
</body>
</html>
