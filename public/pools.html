<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Pools & Auslosung</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/pools.css">
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card pool-management-card">
    <div class="form-title-area">
        <span class="material-icons">groups</span>
        <h1 id="formTitle">Pool-Verwaltung</h1>
    </div>

    <!-- Status B: Pools existieren bereits (Nutzt flex-Display via JS) -->
    <div id="regenerateActionArea" class="pools-toolbar" style="display: none;">
        <button type="button" class="toolbar-btn" id="refreshPoolsBtn" title="Aktualisieren">
            <span class="material-icons">refresh</span>
            <span>Aktualisieren</span>
        </button>
        <button type="button" class="toolbar-btn" id="generateMorePoolsBtn" title="Pools für weitere gewogene Altersklassen generieren" style="display: none;">
            <span class="material-icons">auto_awesome</span>
            <span>Pools generieren</span>
        </button>
        <button type="button" class="toolbar-btn toolbar-btn-danger" id="regeneratePoolsBtn" title="Pools neu generieren">
            <span class="material-icons">restart_alt</span>
            <span>Neu generieren</span>
        </button>
        <button type="button" class="toolbar-btn toolbar-btn-danger" id="deleteAllPoolsBtn" title="Alle Pools löschen">
            <span class="material-icons">delete_sweep</span>
            <span>Alle löschen</span>
        </button>
    </div>

    <!-- Status A: Vor der Auslosung (Zentraler Aktionsbereich) -->
    <div id="drawActionArea" style="text-align: center; padding: 24px; border-bottom: 2px solid var(--border); margin-bottom: 24px;">
        <p style="margin: 0 0 16px 0; font-weight: 600; color: var(--text-muted);">
            Alle Teilnehmer erfasst? Starten Sie die automatische Pool-Generierung nach DJB-Reglement.
        </p>
        <button type="button" class="btn btn-raised" id="generatePoolsBtn" style="height: auto; padding: 14px 40px; display: inline-flex; align-items: center;">
            <span class="material-icons" style="vertical-align: middle; margin-right: 8px;">auto_awesome</span>
            Pools jetzt generieren
        </button>
    </div>

    <!-- Dynamischer Container für die Pool-Listen -->
    <div id="poolsContainer">
        <!-- Wird per JS befüllt -->
    </div>
</div>

<!-- Modal: Kampfplan ansehen / drucken -->
<div id="fightplanModal" class="modal-wrapper" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); z-index: 9999; align-items: center; justify-content: center;">
    <div class="mdc-card" style="width: 95%; max-width: 1600px; max-height: 85vh; padding: 24px; border-radius: 4px; border: 2px solid var(--border); box-shadow: var(--shadow); background-color: var(--bg-card); display: flex; flex-direction: column;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span class="material-icons" style="font-size: 28px; color: var(--primary);">table_view</span>
                <h2 id="modalPoolTitle" style="margin: 0; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Kampfplan</h2>
            </div>
            <div style="display: flex; gap: 8px;">
                <button type="button" class="btn btn-outlined" id="refreshFightplanBtn" style="padding: 6px 16px; font-size: 12px; display: flex; align-items: center; gap: 6px;">
                    <span class="material-icons" style="font-size: 16px;">refresh</span> Aktualisieren
                </button>
                <button type="button" class="btn btn-outlined" id="printFightplanBtn" style="padding: 6px 16px; font-size: 12px; display: flex; align-items: center; gap: 6px;">
                    <span class="material-icons" style="font-size: 16px;">print</span> Drucken
                </button>
            </div>
        </div>
        
        <!-- Druckbarer Bereich -->
        <div id="printArea" style="flex: 1; overflow-y: auto; margin-bottom: 20px;">
            <!-- Dieser Header wird nur beim Drucken oben angezeigt -->
            <div class="print-only-header" style="margin-bottom: 16px; display: none;">
                <div class="print-turnier-info" id="printTurnierInfo" style="font-size: 12px; color: #555555;"></div>
                <h1 id="printPoolTitleHeader" style="margin: 0 0 4px 0; font-size: 24px; font-weight: bold; text-transform: uppercase;">U13 weiblich -28.4kg</h1>
            </div>
            
            <!-- Matrix Platzhalter (Dynamisch) -->
            <div id="matrixContainer" style="display: none; margin-bottom: 24px;"></div>
            
            <!-- Bracket Platzhalter (Dynamisch) -->
            <div id="bracketContainer" style="display: none; margin-bottom: 24px;"></div>
            
            <!-- Überkreuz Platzhalter (Dynamisch) -->
            <div id="ueberKreuzContainer" style="display: none; margin-bottom: 24px;"></div>
            
            <table class="pools-table" style="width: 100%; border-collapse: collapse;">
                <thead id="fightplanTableHeader">
                    <tr class="pools-table-header">
                        <th class="pool-cell" style="width: 60px; text-align: left; padding: 8px; border-bottom: 2px solid var(--border);">Nr.</th>
                        <th class="pool-cell" style="text-align: left; padding: 8px; border-bottom: 2px solid var(--border);">Typ / Runde</th>
                        <th class="pool-cell" style="text-align: left; padding: 8px; border-bottom: 2px solid var(--border);">Kämpfer 1 (Weiß)</th>
                        <th class="pool-cell" style="text-align: center; width: 40px; padding: 8px; border-bottom: 2px solid var(--border);">VS</th>
                        <th class="pool-cell" style="text-align: left; padding: 8px; border-bottom: 2px solid var(--border);">Kämpfer 2 (Blau)</th>
                        <th class="pool-cell" style="text-align: right; width: 180px; padding: 8px; border-bottom: 2px solid var(--border);">Ergebnis</th>
                    </tr>
                </thead>
                <tbody id="fightplanTableBody">
                    <!-- Befüllt per JS -->
                </tbody>
            </table>
        </div>
        
        <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button type="button" class="btn btn-raised" id="confirmFightplanBtn" style="display: none; padding: 8px 24px; font-size: 12px; align-items: center; gap: 6px;">
                <span class="material-icons" style="font-size: 16px;">fact_check</span> Ergebnisse geprüft
            </button>
            <button type="button" class="btn btn-outlined" id="closeFightplanBtn" style="padding: 8px 24px; font-size: 12px;">Schließen</button>
        </div>
        <div class="print-fusszeile">Erzeugt mit Hajime Pro</div>
    </div>
</div>

<script src="/js/pools.js"></script>
<script type="module" src="/js/urkundenDruck.js"></script>
</body>
</html>
