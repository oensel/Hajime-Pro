<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Turniermanager</title>
    <!-- Erst die gemeinsamen Styles laden, danach die exklusiven Teile -->
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/turnier.css">
    <!-- Zentrales Navigations- und Menü-Skript einbinden -->
    <script src="/js/menu.js"></script>
</head>
<body>

<!-- Feste Hintergrundzeichen -->
<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<!-- Hauptkarte der Anwendung im Google Material Design Style -->
<div class="mdc-card">
    <div class="form-title-area">
        <span class="material-icons">calendar_month</span>
        <h1 id="formTitle">Turnier</h1>
        <span class="material-icons">calendar_month</span>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
        <button type="button" class="btn btn-outlined" id="veroeffentlichenBtn" style="display: none; align-items: center; gap: 8px; height: 38px; font-size: 13px; font-weight: bold; margin: 0; padding: 0 16px;">
            <span class="material-icons" style="font-size: 18px;">publish</span>
            Veröffentlichen
        </button>
        <button type="button" class="btn btn-outlined" id="durchfuehrungBeendenBtn" style="display: none; align-items: center; gap: 8px; height: 38px; font-size: 13px; font-weight: bold; margin: 0; padding: 0 16px;">
            <span class="material-icons" style="font-size: 18px;">flag</span>
            Durchführung beenden
        </button>
        <button type="button" class="btn btn-outlined" id="importTurnierBtn" style="display: none; align-items: center; gap: 8px; height: 38px; font-size: 13px; font-weight: bold; margin: 0; padding: 0 16px;">
            <span class="material-icons" style="font-size: 18px;">upload_file</span>
            Abgeschlossenes Turnier hochladen
        </button>
        <input type="file" id="importTurnierFileInput" accept=".json" style="display: none;">
        <button type="button" class="btn btn-outlined" id="exportTurnierBtn" style="display: none; align-items: center; gap: 8px; height: 38px; font-size: 13px; font-weight: bold; margin: 0; padding: 0 16px;">
            <span class="material-icons" style="font-size: 18px;">download</span>
            Gesamtes Turnier exportieren
        </button>
        <button type="button" class="btn btn-outlined" id="absagenBtn" style="display: none; align-items: center; gap: 8px; height: 38px; font-size: 13px; font-weight: bold; margin: 0; padding: 0 16px; color: #c62828; border-color: #c62828;">
            <span class="material-icons" style="font-size: 18px;">cancel</span>
            Absagen
        </button>
        <button type="button" class="btn btn-outlined" id="loeschenBtn" style="display: none; align-items: center; gap: 8px; height: 38px; font-size: 13px; font-weight: bold; margin: 0; padding: 0 16px; color: #c62828; border-color: #c62828;">
            <span class="material-icons" style="font-size: 18px;">delete</span>
            Löschen
        </button>
    </div>
    <div id="importTurnierStatus" style="display: none; margin: 0 0 16px 0; font-size: 13px; font-weight: bold; color: var(--text-muted);"></div>

    <form id="turnierForm">
        <!-- ZEILE 1: Veranstaltungs-Name, Wettkampftag, Ort -->
        <div class="grid-3">
            <div class="form-group">
                <label for="bezeichnung">Veranstaltungs-Name</label>
                <input type="text" id="bezeichnung" required placeholder="z.B. Sommerturnier 2026">
            </div>
            <div class="form-group">
                <label for="datum">Wettkampftag</label>
                <input type="date" id="datum" required>
            </div>
            <div class="form-group">
                <label for="ort">Kampfstätte (Ort)</label>
                <input type="text" id="ort" required placeholder="z.B. Senden">
            </div>
        </div>

        <!-- ZEILE 2: Ausrichter, Matten, Anmeldeschluss (ohne Uhrzeit, nur im Online-Modus sichtbar) -->
        <div class="grid-3">
            <div class="form-group">
                <label for="ausrichter">Ausrichter (Verein)</label>
                <input type="text" id="ausrichter" required placeholder="z.B. Judo Club Senden">
            </div>
            <div class="form-group">
                <label for="anzahl_kampfflaechen">Bereitgestellte Matten (Flächen)</label>
                <input type="number" id="anzahl_kampfflaechen" min="1" value="1" required>
            </div>
            <div class="form-group" id="anmeldeschlussGroup" style="display: none;">
                <label for="anmeldeschluss">Anmeldeschluss (Frist)</label>
                <input type="date" id="anmeldeschluss">
            </div>
        </div>

        <!-- ZEILE 3: Altersklassen Checkboxes -->
        <div class="form-group" style="margin-top: 24px;">
            <label style="margin-bottom: 8px; display: block; font-weight: 600;">Austragungs-Altersklassen</label>
            <div id="altersklassenContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 4px; background: rgba(0,0,0,0.01);">
                <!-- Checkboxes dynamically added -->
            </div>
        </div>

        <!-- ZEILE 4: Zahlungsblock -->
        <div class="form-group" style="margin-top: 24px;">
            <label style="margin-bottom: 8px; display: block; font-weight: 600;">Zahlungsinformationen</label>
            <div class="grid-zahlung">
                <div class="form-group" style="margin: 0;">
                    <label for="startgeld">Startgeld</label>
                    <input type="number" id="startgeld" min="0" max="999" step="1" placeholder="z.B. 8">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="kontoinhaber">Kontoinhaber</label>
                    <input type="text" id="kontoinhaber" placeholder="z.B. Judo Club Senden e.V.">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="iban">IBAN</label>
                    <input type="text" id="iban" maxlength="34" placeholder="z.B. DE12345678901234567890">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="verwendungszweck">Verwendungszweck</label>
                    <input type="text" id="verwendungszweck" placeholder="z.B. Startgeld + Vereinsname">
                </div>
            </div>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-raised" id="submitBtn">Eintrag Speichern</button>
        </div>
    </form>
</div>

<!-- Externe JavaScript-Datei für die Logik einbinden -->
<script src="/js/turnier.js"></script>
</body>
</html>
