<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Zeitplan</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/matten.css">
    <link rel="stylesheet" href="/css/zeitplan.css">
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card matten-management-card">
    <div class="form-title-area">
        <h1>Zeitplan-Simulation</h1>
    </div>

    <p class="zeitplan-hinweis">
        Ablauf: Teilnehmer auf Pools und Pools auf Matten verteilen, dann hier simulieren.
        Die Simulation rechnet nur und verändert nichts am Turnier. Jeder Kampf dauert die
        angegebene durchschnittliche Kampfzeit plus 90 Sekunden Puffer.
    </p>

    <div class="zeitplan-eingaben">
        <label class="zeitplan-feld">
            <span>Beginn der Kämpfe</span>
            <input type="time" id="zeitplanBeginn" value="09:00">
        </label>
        <div id="zeitplanKlassen" class="zeitplan-klassen"></div>
        <button type="button" class="btn" id="zeitplanSimulieren">Simulieren</button>
    </div>

    <div id="zeitplanMeldung" class="zeitplan-meldung"></div>
    <div id="zeitplanErgebnis"></div>
</div>

<script src="/js/zeitplan.js"></script>
</body>
</html>
