<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - E-Mail bestätigen</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 16px !important;
            background: #111827 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
            box-sizing: border-box;
        }
        .login-card {
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #f3f4f6;
            box-sizing: border-box;
            text-align: center;
        }
        .login-title {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #3b82f6;
            margin: 0 0 8px 0;
        }
        .login-subtitle {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 600;
            margin: 0 0 24px 0;
        }
        .btn-login {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #2563eb; }
        .btn-login:disabled { background: #4b5563; cursor: default; }
        .meldung {
            font-size: 15px;
            font-weight: 700;
            line-height: 1.5;
            color: #f3f4f6;
            display: none;
        }
        .error-message {
            margin-top: 16px;
            color: #ef4444;
            font-size: 13px;
            font-weight: 700;
            display: none;
        }
        .link { color: #93c5fd; font-size: 13px; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

<div class="login-card">
    <div style="font-size: 48px; margin-bottom: 16px;">🥋</div>
    <h1 class="login-title">Hajime Pro</h1>
    <p class="login-subtitle">E-Mail-Adresse bestätigen</p>

    <!-- Bestätigung nur per Knopf (POST): Mail-Programme rufen Links vorab ab, ein bloßer Aufruf ändert nichts. -->
    <button type="button" id="bestaetigenKnopf" class="btn-login">E-Mail bestätigen</button>
    <p id="bestaetigtMeldung" class="meldung" role="status"></p>
    <div id="errorMessage" class="error-message" role="alert"></div>
    <a href="/login.html" class="link">Zur Anmeldung</a>
</div>

<script>
    const knopf = document.getElementById('bestaetigenKnopf');
    const meldung = document.getElementById('bestaetigtMeldung');
    const errDiv = document.getElementById('errorMessage');
    const token = new URLSearchParams(window.location.search).get('token') || '';

    function zeigeFehler(text) {
        errDiv.textContent = text;
        errDiv.style.display = 'block';
    }

    if (!token) {
        knopf.disabled = true;
        zeigeFehler('Der Bestätigungslink ist unvollständig. Bitte öffnen Sie den Link aus der E-Mail erneut.');
    }

    knopf.addEventListener('click', async () => {
        errDiv.style.display = 'none';
        knopf.disabled = true;
        try {
            const response = await fetch('/api/auth/email-bestaetigen', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Die Bestätigung ist fehlgeschlagen.');
            knopf.style.display = 'none';
            meldung.textContent = data.message;
            meldung.style.display = 'block';
        } catch (err) {
            knopf.disabled = false;
            zeigeFehler(err.message);
        }
    });
</script>
<script src="/js/rechtsfuss.js"></script>
</body>
</html>
