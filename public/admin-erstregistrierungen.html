<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Erstregistrierungen</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/menu.js"></script>
    <style>
        .erstregistrierung-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .erstregistrierung-name { font-size: 14px; font-weight: 700; color: var(--text-main); }
        .erstregistrierung-meta { font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; }
        .erstregistrierung-actions { display: flex; align-items: center; gap: 8px; }
        .rollen-auswahl { padding: 5px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--text-main); font-size: 12px; }
    </style>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card" style="padding: 24px; max-width: 760px;">
    <div class="form-title-area">
        <span class="material-icons">verified_user</span>
        <h1>Erstregistrierungen</h1>
        <span class="material-icons">verified_user</span>
    </div>
    <p style="color: var(--text-muted); font-size: 13px; margin-top: 0;">Registrierungen für Vereine, die noch keinen Admin haben. Mit der Freigabe wird die Person Mitglied des Vereins, vorbelegt als Admin.</p>
    <div id="erstregistrierungenListe" style="display: flex; flex-direction: column;"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const liste = document.getElementById('erstregistrierungenListe');
        const { ROLLEN_TEXT } = await import('/js/shared/menueRechte.js');
        const meldeFehler = (text) => window.zeigeNotification ? window.zeigeNotification(text, 'error') : alert(text);
        const meldeErfolg = (text) => { if (window.zeigeNotification) window.zeigeNotification(text); };

        // Alle Namen/Adressen stammen von anderen Konten: nur per textContent/createElement einsetzen.
        function el(tag, eigenschaften = {}, ...kinder) {
            const e = document.createElement(tag);
            for (const [k, v] of Object.entries(eigenschaften)) {
                if (k === 'text') e.textContent = v;
                else if (k === 'class') e.className = v;
                else if (k === 'style') e.style.cssText = v;
                else e.setAttribute(k, v);
            }
            e.append(...kinder);
            return e;
        }
        const knopf = (text, klasse) => el('button', { type: 'button', class: `btn ${klasse}`, text, style: 'padding: 6px 12px; font-size: 11px;' });

        async function sendePost(url, daten) {
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(daten) });
            const antwort = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(antwort.error || 'Aktion fehlgeschlagen');
            return antwort;
        }

        function zeile(p) {
            const name = `${p.vorname || ''} ${p.nachname || ''}`.trim();
            const auswahl = el('select', { class: 'rollen-auswahl', 'aria-label': `Rolle für ${name}` });
            for (const rolle of ['helfer', 'benutzer', 'admin']) {
                const option = el('option', { value: rolle, text: ROLLEN_TEXT[rolle] });
                if (rolle === 'admin') option.selected = true;
                auswahl.append(option);
            }
            const freigeben = knopf('Freigeben', 'btn-raised');
            freigeben.dataset.action = 'approve';
            const ablehnen = knopf('Ablehnen', 'btn-outlined');
            ablehnen.dataset.action = 'reject';
            const entscheide = async (aktion) => {
                freigeben.disabled = ablehnen.disabled = true;
                try {
                    const daten = { userId: p.id, vereinId: p.verein_id };
                    if (aktion === 'approve') daten.rolle = auswahl.value;
                    await sendePost(`/api/vereine/super/${aktion}`, daten);
                    meldeErfolg(aktion === 'approve' ? 'Erstregistrierung freigegeben.' : 'Anfrage abgelehnt.');
                    lade();
                    if (window.hajimeAktualisiereGenehmigungsHinweis) window.hajimeAktualisiereGenehmigungsHinweis();
                } catch (err) {
                    freigeben.disabled = ablehnen.disabled = false;
                    meldeFehler(err.message);
                }
            };
            freigeben.addEventListener('click', () => entscheide('approve'));
            ablehnen.addEventListener('click', () => entscheide('reject'));
            return el('div', { class: 'erstregistrierung-row', 'data-user-id': String(p.id) },
                el('div', {},
                    el('div', { class: 'erstregistrierung-name', text: name }),
                    el('div', { class: 'erstregistrierung-meta', text: `${p.email} · ${p.verein_name}` })),
                el('div', { class: 'erstregistrierung-actions' }, auswahl, freigeben, ablehnen));
        }

        async function lade() {
            try {
                const resp = await fetch('/api/vereine/super/pending');
                if (!resp.ok) {
                    liste.replaceChildren(el('p', { style: 'font-size: 13px; color: var(--text-muted); text-align: center;', text: 'Nur Super-Admins können Erstregistrierungen prüfen.' }));
                    return;
                }
                const pending = await resp.json();
                if (!Array.isArray(pending) || pending.length === 0) {
                    liste.replaceChildren(el('p', { style: 'font-size: 13px; color: var(--text-muted); text-align: center;', text: 'Keine offenen Erstregistrierungen.' }));
                    return;
                }
                liste.replaceChildren(...pending.map(zeile));
            } catch (err) {
                console.error('Fehler beim Laden der Erstregistrierungen:', err);
            }
        }
        lade();
    });
</script>
</body>
</html>
