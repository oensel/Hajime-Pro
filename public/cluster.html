<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Cluster</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/menu.js"></script>
    <style>
        .mdc-card { max-width: min(1240px, 96vw); }
        .vergleich { display: grid; grid-template-columns: minmax(130px, 190px) minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; font-size: 13px; }
        .vergleich > div { padding: 7px 12px; border-top: 1px solid var(--border); min-width: 0; }
        .vergleich > .v-kopf { border-top: none; padding: 12px; font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .v-tag { font-size: 11px; font-weight: bold; margin-left: 4px; }
        .vergleich > .v-gruppe { grid-column: 1 / -1; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); padding: 5px 12px; background: rgba(127,127,127,.08); }
        .vergleich > .v-name { color: var(--text-muted); }
        .rolle-master { color: #2e7d32; font-weight: bold; }
        .rolle-secondary { color: #1565c0; font-weight: bold; }
        .zustand-gut { color: #2e7d32; }
        .zustand-warn { color: #e65100; font-weight: bold; }
        .zustand-schlecht { color: #c62828; font-weight: bold; }
        .balken-kopf { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
        .balken-bahn { position: relative; height: 8px; border-radius: 4px; background: var(--border); margin-top: 3px; }
        .balken-fuell { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
        .balken-ok { background: #2e7d32; }
        .balken-warn { background: #e65100; }
        .balken-bad { background: #c62828; }
        .balken-last { margin-top: 5px; }
        .balken-last .strich { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-main); }
        .balken-last .strich-hell { opacity: .55; }
        .balken-notiz { font-size: 11px; color: var(--text-muted); margin-top: 2px; word-break: break-all; }
        .cluster-tabelle { width: 100%; border-collapse: collapse; font-size: 13px; }
        .cluster-tabelle th, .cluster-tabelle td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card" style="padding: 20px 24px;">
    <div class="form-title-area">
        <span class="material-icons">dns</span>
        <h1>Server-Cluster</h1>
        <span class="material-icons">dns</span>
    </div>
    <p id="clusterHinweis" style="color: var(--text-muted); font-size: 13px; margin-top: 0;">Status wird geladen …</p>
    <div id="clusterKnoten"></div>
    <div id="clusterUpdate" style="margin-top: 16px;">
        <p id="updateZeile" style="font-size: 13px; margin: 0 0 8px;"></p>
        <p id="updateHinweis" class="zustand-warn" style="font-size: 13px; margin: 0 0 8px; display: none;"></p>
        <p id="updateGrund" style="font-size: 13px; margin: 0 0 8px; color: var(--text-muted); display: none;"></p>
        <button type="button" class="btn btn-outlined" id="btnUpdate" style="display: none; align-items: center; gap: 8px;">
            <span class="material-icons" style="font-size: 18px;">system_update_alt</span>
            <span id="btnUpdateText">Update</span>
        </button>
        <button type="button" class="btn btn-outlined" id="btnPartnerUpdate" style="display: none; align-items: center; gap: 8px;">
            <span class="material-icons" style="font-size: 18px;">system_update_alt</span>
            <span id="btnPartnerUpdateText">Secondary aktualisieren</span>
        </button>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
        <button type="button" class="btn btn-outlined" id="btnUebergabe" style="display: none; align-items: center; gap: 8px;">
            <span class="material-icons" style="font-size: 18px;">swap_horiz</span>
            <span id="btnUebergabeText">Rolle übergeben</span>
        </button>
    </div>
</div>

<div class="mdc-card" style="padding: 20px 24px; margin-top: 24px;">
    <div class="form-title-area">
        <span class="material-icons">devices</span>
        <h1>Client-Geräte</h1>
        <span class="material-icons">devices</span>
    </div>
    <div id="clusterClients">–</div>
</div>

<div class="mdc-card" style="padding: 20px 24px; margin-top: 24px;">
    <div class="form-title-area">
        <span class="material-icons">history</span>
        <h1>Verlauf</h1>
        <span class="material-icons">history</span>
    </div>
    <div id="clusterVerlauf">–</div>
</div>

<script src="/js/cluster.js"></script>
</body>
</html>
