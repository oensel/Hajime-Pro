<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Urkunden-Designer</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/menu.js"></script>
    <script src="/js/fabric/index.min.js"></script>
    <style>
        .urkunden-card { max-width: 1200px; margin: 24px auto; padding: 24px; }
        .urkunden-zeile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
        .urkunden-zeile label { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-size: 13px; font-weight: 700; }
        .urkunden-zeile input[type="checkbox"] { width: auto; margin: 0; }
        .urkunden-zeile input[type="color"] { width: 40px; height: 30px; padding: 0; margin: 0; }
        .urkunden-zeile select, .urkunden-zeile input[type="text"], .urkunden-zeile input[type="number"] {
            width: auto; margin: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: inherit;
        }
        /* Bearbeitungsfläche in halber Kartenbreite, Werkzeuge daneben */
        .designer-bereich { display: flex; gap: 16px; align-items: flex-start; }
        #editorContainer { position: relative; flex: 0 0 50%; border: 1px solid var(--border); background: #f4f4f4; min-height: 120px; }
        .designer-werkzeuge { flex: 1; min-width: 0; }
        @media (max-width: 900px) {
            .designer-bereich { flex-direction: column; }
            #editorContainer { flex-basis: auto; width: 100%; }
            .designer-werkzeuge { width: 100%; }
        }
        #editorLeer { padding: 24px; text-align: center; color: #777; }
        .werkzeugleiste { border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-bottom: 12px; }
        .werkzeugleiste[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
        .platzhalter-btn { font-size: 12px; padding: 4px 8px; }
        #feldText { min-width: 0; flex: 1; }
        #vorlagenAuswahl { max-width: 250px; }
        /* Eigenschaften untereinander: Beschriftung | Eingabe */
        .eigenschaften { display: grid; grid-template-columns: max-content minmax(0, 260px); gap: 8px 12px; align-items: center; margin-bottom: 12px; }
        .eigenschaften label { margin: 0; font-size: 13px; font-weight: 700; }
        .eigenschaften select, .eigenschaften input[type="number"] {
            width: 100%; margin: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: inherit;
        }
        .eigenschaften select:disabled { opacity: 0.6; }
        .eigenschaften input[type="color"] { width: 40px; height: 30px; padding: 0; margin: 0; }
        .element-knoepfe { display: flex; flex-wrap: wrap; gap: 8px; }
        /* Toggle-Schalter (Checkbox mit role="switch") */
        .schalter { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: 13px; font-weight: 700; cursor: pointer; user-select: none; }
        .schalter input { position: absolute; opacity: 0; width: 1px; height: 1px; }
        .schalter-bahn { position: relative; width: 38px; height: 22px; border-radius: 11px; background: #b0b0b0; transition: background 0.2s; flex: none; }
        .schalter-bahn::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .schalter input:checked + .schalter-bahn { background: var(--primary, #1f3a68); }
        .schalter input:checked + .schalter-bahn::after { transform: translateX(16px); }
        .schalter input:focus-visible + .schalter-bahn { outline: 2px solid var(--primary, #1f3a68); outline-offset: 2px; }
        .urkunden-hinweis { background: #fff8e1; border-left: 4px solid #f0b400; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; color: #333; }
    </style>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card urkunden-card">
    <div class="form-title-area">
        <span class="material-icons">design_services</span>
        <h1>Urkunden-Designer</h1>
    </div>

    <div id="hallenHinweis" class="urkunden-hinweis" style="display: none;">
        Änderungen an Vorlagen werden nicht in die Cloud übertragen.
    </div>

    <div class="urkunden-zeile">
        <label for="vorlagenAuswahl">Vorlage</label>
        <select id="vorlagenAuswahl"></select>
        <button type="button" class="btn btn-raised" id="btnVorlageNeu">Neue Vorlage</button>
        <button type="button" class="btn btn-outlined" id="btnVorlageDuplizieren">Duplizieren</button>
        <button type="button" class="btn btn-outlined" id="btnVorlageUmbenennen">Umbenennen</button>
        <button type="button" class="btn btn-outlined" id="btnVorlageLoeschen">Löschen</button>
        <button type="button" class="btn btn-outlined" id="btnVorlageExport" title="Diese Vorlage als Datei speichern">Exportieren</button>
        <button type="button" class="btn btn-outlined" id="btnVorlageImport" title="Vorlage aus einer Datei laden">Importieren</button>
        <button type="button" class="btn btn-raised" id="btnVorlageSpeichern" style="margin-left: auto;">Speichern</button>
        <input type="file" id="importDatei" accept=".json,application/json" style="display: none;">
        <input type="file" id="vorlageDatei" accept="application/pdf" style="display: none;">
        <input type="file" id="bildDatei" accept="image/png,image/jpeg,image/gif" style="display: none;">
    </div>

    <div class="designer-bereich">
        <div id="editorContainer">
            <div id="editorLeer">
                <p id="editorLeerText">Noch keine Vorlage vorhanden. Wähle ein Standard-Design oder lade eine eigene Blanko-Urkunde als PDF hoch.</p>
                <div id="rahmenStart"></div>
                <button type="button" class="btn btn-raised" id="btnVorlageNeuLeer" style="margin-top: 12px;">Eigenes PDF hochladen</button>
            </div>
            <canvas id="urkundenCanvas"></canvas>
        </div>

        <div class="designer-werkzeuge">
            <div class="urkunden-zeile">
                <button type="button" class="btn btn-raised" id="btnFeldPlatzhalter">+ Platzhalterfeld</button>
                <button type="button" class="btn btn-raised" id="btnFeldText">+ Freier Text</button>
                <button type="button" class="btn btn-raised" id="btnFeldLinie">+ Linie</button>
                <button type="button" class="btn btn-raised" id="btnFeldBild">+ Bild</button>
                <label class="schalter" for="schalterBeispiel">
                    <input type="checkbox" role="switch" id="schalterBeispiel">
                    <span class="schalter-bahn" aria-hidden="true"></span>
                    Beispieldaten
                </label>
            </div>

            <div class="werkzeugleiste" id="werkzeugleiste" aria-disabled="true">
                <div id="textWerkzeuge">
                    <div class="urkunden-zeile">
                        <label for="feldText">Text</label>
                        <input type="text" id="feldText" maxlength="200">
                    </div>
                    <div class="urkunden-zeile" id="platzhalterKnoepfe"></div>
                    <div class="eigenschaften">
                        <label for="feldSchrift">Schriftart</label>
                        <select id="feldSchrift"></select>
                        <label for="feldGroesse">Größe (pt)</label>
                        <input type="number" id="feldGroesse" min="4" max="200" step="0.5">
                        <label for="feldStil">Stil</label>
                        <select id="feldStil"></select>
                        <label for="feldAusrichtung">Ausrichtung</label>
                        <select id="feldAusrichtung">
                            <option value="links">links</option>
                            <option value="zentriert">zentriert</option>
                            <option value="rechts">rechts</option>
                        </select>
                    </div>
                </div>
                <div id="linienWerkzeuge" class="eigenschaften" style="display: none;">
                    <label for="linieStil">Stil</label>
                    <select id="linieStil"></select>
                    <label for="linieStaerke">Stärke (pt)</label>
                    <input type="number" id="linieStaerke" min="0.5" max="10" step="0.5">
                </div>
                <div id="farbeWerkzeug" class="eigenschaften">
                    <label for="feldFarbe">Farbe</label>
                    <input type="color" id="feldFarbe">
                </div>
                <div class="element-knoepfe">
                    <button type="button" class="btn btn-outlined" id="btnFeldZentrieren">Auf Seite zentrieren</button>
                    <button type="button" class="btn btn-outlined" id="btnFeldLoeschen">Element löschen</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="/js/urkundenDruck.js"></script>
<script type="module" src="/js/urkunden-designer.js"></script>
</body>
</html>
