<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Turnierauswahl</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .mdc-card {
            max-width: none;
            padding: 20px 24px;
        }
        .tournaments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr));
            gap: 24px;
            margin-top: 16px;
        }
        .tournament-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            transition: all 0.2s ease-in-out;
            position: relative;
        }
        .tournament-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .tournament-card.expired {
            opacity: 0.65;
            filter: grayscale(0.5);
            background: rgba(0, 0, 0, 0.02);
            border-color: #d1d5db;
        }
        [data-theme="dark"] .tournament-card.expired {
            background: rgba(255, 255, 255, 0.01);
            border-color: #374151;
        }
        .tournament-card.expired:hover {
            transform: none;
            box-shadow: var(--shadow);
        }
        .tournament-name {
            font-size: 21px;
            font-weight: bold;
            color: var(--text-main);
            margin: 0 0 12px 0;
            line-height: 1.3;
        }
        .tournament-details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-item .material-icons {
            font-size: 16px;
            color: var(--primary);
            opacity: 0.8;
        }
        .helfer-fortschritt {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        .helfer-fortschritt-balken {
            height: 6px;
            border-radius: 3px;
            background: var(--border);
            overflow: hidden;
        }
        .helfer-fortschritt-balken > div {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
        }
        .helfer-fortschritt-balken > div.voll { background: #2e7d32; }
        .deadline-badge {
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            display: inline-block;
        }
        .deadline-badge.active {
            background: rgba(46, 125, 50, 0.1);
            color: #2e7d32;
            border: 1px solid rgba(46, 125, 50, 0.3);
        }
        .deadline-badge.expired {
            background: rgba(198, 40, 40, 0.1);
            color: #c62828;
            border: 1px solid rgba(198, 40, 40, 0.3);
        }
        .status-badge {
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            display: inline-block;
            margin-left: 8px;
            vertical-align: middle;
        }
        .status-badge.status-entwurf {
            background: rgba(97, 97, 97, 0.1);
            color: #616161;
            border: 1px solid rgba(97, 97, 97, 0.3);
        }
        .status-badge.status-veroeffentlicht {
            background: rgba(46, 125, 50, 0.1);
            color: #2e7d32;
            border: 1px solid rgba(46, 125, 50, 0.3);
        }
        .status-badge.status-anmeldung_geschlossen {
            background: rgba(239, 108, 0, 0.1);
            color: #ef6c00;
            border: 1px solid rgba(239, 108, 0, 0.3);
        }
        .status-badge.status-in_durchfuehrung {
            background: rgba(21, 101, 192, 0.1);
            color: #1565c0;
            border: 1px solid rgba(21, 101, 192, 0.3);
        }
        .status-badge.status-abgeschlossen {
            background: rgba(66, 66, 66, 0.1);
            color: #424242;
            border: 1px solid rgba(66, 66, 66, 0.3);
        }
        .status-badge.status-abgesagt {
            background: rgba(198, 40, 40, 0.1);
            color: #c62828;
            border: 1px solid rgba(198, 40, 40, 0.3);
        }
        .ak-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 4px;
        }
        .ak-chip {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            display: inline-block;
            background: rgba(30, 58, 138, 0.08);
            color: var(--primary);
            border: 1px solid rgba(30, 58, 138, 0.25);
            cursor: default;
            user-select: none;
        }
        .ak-chip-empty {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-muted);
        }
        .tournament-card.aktiv {
            border: 2px solid #c62828;
        }
        .status-badge.status-aktiv {
            background: rgba(198, 40, 40, 0.1);
            color: #c62828;
            border: 1px solid rgba(198, 40, 40, 0.3);
        }
        .lokal-grid {
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
            gap: 18px;
        }
        .tournament-card.kompakt {
            padding: 20px 22px;
            gap: 12px;
        }
        .tournament-card.kompakt .tournament-name {
            font-size: 19px;
            margin: 0 0 8px 0;
        }
        .tournament-card.kompakt .card-actions {
            padding-top: 10px;
        }
        .kompakt-ort {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .kompakt-ort .material-icons { font-size: 15px; color: var(--primary); opacity: 0.8; }
        .info-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .info-chip {
            font-size: 11px;
            padding: 1px 8px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-muted);
        }
        .tournament-card.cloud-karte { border-style: dashed; }
        .status-badge.status-geplant {
            background: rgba(239, 108, 0, 0.1);
            color: #ef6c00;
            border: 1px solid rgba(239, 108, 0, 0.3);
        }
        .btn-aktivieren {
            background: rgba(46, 125, 50, 0.12);
            color: #2e7d32;
            border: 1px solid rgba(46, 125, 50, 0.4);
        }
        .abgeschlossen-liste { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; }
        .abgeschlossen-zeile {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 6px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-muted);
            font-size: 12px;
            opacity: 0.8;
            filter: grayscale(0.5);
        }
        .abgeschlossen-zeile .material-icons { font-size: 16px; }
        .abgeschlossen-zeile .az-name { flex: 1; font-weight: 700; }
        .abrechnung-warnung { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border: 2px solid #f59e0b; border-radius: 4px; font-size: 12px; font-weight: 700; color: #b45309; }
        .abrechnung-warnung .material-icons { font-size: 15px; }
        .abgeschlossen-zeile .btn { padding: 2px 10px; font-size: 11px; margin: 0; }
        .abgeschlossen-zeile .btn.btn-icon-aktion { padding: 0; width: 30px; height: 30px; flex: 0 0 30px; }
        .abgeschlossen-zeile .btn.btn-icon-aktion .material-icons { font-size: 18px; }
        .card-actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }
        .card-actions .btn {
            flex: 1;
            margin: 0;
        }
        .card-actions .btn.btn-icon-aktion { flex: 0 0 34px; width: 34px; height: auto; align-self: stretch; padding: 0; }
        .card-actions .btn.btn-icon-aktion .material-icons { font-size: 18px; }
        .no-data-msg {
            text-align: center;
            padding: 48px;
            color: var(--text-muted);
            font-weight: bold;
            grid-column: 1 / -1;
        }
        .section-title {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin: 32px 0 16px 0;
            padding-left: 10px;
            border-left: 4px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-banner {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 13px;
            font-weight: 700;
        }
        .status-banner.pending {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #b45309;
        }
        .status-banner .material-icons {
            font-size: 22px;
        }
        .pending-requests-card {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 24px;
            background: var(--bg-card);
        }
        .pending-requests-card h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
        }
        .pending-request-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .pending-request-row:last-child {
            border-bottom: none;
        }
        .pending-request-row .req-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }
        .pending-request-row .req-email {
            font-size: 12px;
            color: var(--text-muted);
        }
        .pending-request-actions {
            display: flex;
            gap: 8px;
        }
        .pending-request-actions .btn {
            margin: 0;
        }
        .pending-request-actions .rollen-auswahl {
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 12px;
        }
        .cloud-trenner {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 32px 0 16px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .cloud-trenner::before, .cloud-trenner::after {
            content: "";
            flex: 1;
            border-top: 2px solid var(--border);
        }
        .cloud-login {
            display: grid;
            grid-template-columns: minmax(0, 360px);
            gap: 12px;
            justify-items: stretch;
            border: 1px dashed var(--border);
            border-radius: 6px;
            padding: 16px;
        }
        .cloud-login label {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .cloud-login .btn { margin: 0; justify-self: start; }
        .cloud-fehler {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #c62828;
        }
        .cloud-hinweis {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
        }
        @media (max-width: 640px) {
            .cloud-login { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .mdc-card { padding: 12px; }
            .tournaments-grid { gap: 12px; }
            .tournament-card, .tournament-card.kompakt { padding: 16px; }
            .card-actions { flex-wrap: wrap; }
            .card-actions .btn { flex: 1 1 140px; min-width: 0; }
            .card-actions .btn.btn-icon-aktion { flex: 0 0 44px; width: 44px; }
            .abgeschlossen-zeile { flex-wrap: wrap; gap: 8px 10px; }
            .abgeschlossen-zeile .az-name { flex-basis: 100%; min-width: 0; overflow-wrap: anywhere; }
        }
    </style>
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card">
    <div class="form-title-area titel-zentriert">
        <span class="material-icons">calendar_month</span>
        <h1>Turniere</h1>
        <div class="titel-icons">
            <button type="button" class="toolbar-btn" id="importTurnierBtn" aria-label="Turnier importieren" data-tooltip="Turnier importieren" style="display: none;">
                <span class="material-icons">upload_file</span>
                <span>Turnier importieren</span>
            </button>
            <input type="file" id="importTurnierFileInput" accept=".json" style="display: none;">
            <button type="button" class="toolbar-btn toolbar-btn-akzent" id="createBtn" aria-label="Turnier ausrichten" data-tooltip="Turnier ausrichten" onclick="window.location.href='/turnier.html'">
                <span class="material-icons">add_circle</span>
                <span>Turnier ausrichten</span>
            </button>
        </div>
    </div>

    <div id="importTurnierStatus" style="display: none; margin: 0 0 16px 0; font-size: 13px; font-weight: bold; color: var(--text-muted);"></div>

    <div id="statusBanner"></div>
    <div id="pendingRequestsContainer"></div>

    <div id="tournamentsContainer">
        <div class="no-data-msg">Turniere werden geladen...</div>
    </div>

    <!-- Nur am Hallen-Server und nur, wenn die Cloud erreichbar ist (siehe Skript unten) -->
    <div id="cloudBereich" style="display: none;">
        <div class="cloud-trenner"><span class="material-icons">cloud</span>Turniere aus der Cloud</div>
        <form id="cloudLoginForm" class="cloud-login" autocomplete="off">
            <label>Benutzer
                <input type="text" id="cloudEmail" name="cloudEmail" autocomplete="off" placeholder="name@verein.de" required>
            </label>
            <label>Passwort
                <input type="password" id="cloudPasswort" name="cloudPasswort" autocomplete="off" required>
            </label>
            <button type="submit" class="btn btn-raised" id="cloudLoginBtn">Anmelden</button>
        </form>
        <div id="cloudFehler" class="cloud-fehler" style="display: none;"></div>
        <div id="cloudListe"></div>
    </div>

    <div id="abgeschlossenBereich"></div>
</div>

<script src="/js/ausschreibung-viewer.js"></script>
<script src="/js/turnierDuplizieren.js"></script>
<script src="/js/turnierTeilenDialog.js"></script>
<script src="/js/rueckspielDialog.js"></script>
<script>
    // Turnierdaten können aus Importen oder der Cloud stammen: vor dem Einsetzen in HTML immer maskieren.
    function escHtml(wert) {
        return String(wert ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    // Ist die Cloud konfiguriert und erreichbar (nur Hallen-Server)? Einmal je Seitenaufruf gefragt, gemeinsam für den
    // Bereich „Turniere aus der Cloud“ und den Knopf „In die Cloud zurückspielen“.
    var cloudStatusAnfrage = null;
    function cloudVerfuegbar() {
        if (!cloudStatusAnfrage) {
            cloudStatusAnfrage = fetch('/api/cloud/status')
                .then(r => (r.ok ? r.json() : { verfuegbar: false }))
                .then(d => !!d.verfuegbar)
                .catch(() => false);
        }
        return cloudStatusAnfrage;
    }
    async function ladeBenutzerStatus() {
        const meResp = await fetch('/api/auth/me');
        if (!meResp.ok) {
            throw new Error('Benutzerstatus konnte nicht geladen werden.');
        }
        const meData = await meResp.json();
        const user = meData.user;

        // Lokalen Cache aktuell halten, damit andere Seiten frische Vereinsdaten sehen
        localStorage.setItem('dokume_user', JSON.stringify(user));

        if (!user.verein_id) {
            window.location.href = '/verein_auswahl.html';
            return null;
        }

        return user;
    }

    function renderStatusBanner(user) {
        const banner = document.getElementById('statusBanner');
        const createBtn = document.getElementById('createBtn');

        // Nicht freigegeben: in der Cloud erreicht diese Seite so nur noch ein Super-Admin (andere wartende
        // Konten leitet menu.js zur Helfer-App, Helferverwaltung); im Einzelbenutzerbetrieb ist der Verein
        // immer freigegeben.
        if (!user.verein_freigegeben) {
            if (createBtn) createBtn.style.display = 'none';
            const wartetText = user.verein_wartet_auf_super_admin
                ? 'wartet noch auf Prüfung durch den Super-Admin (Erstregistrierung dieses Vereins)'
                : 'wartet noch auf Freigabe durch einen Admin des Vereins';
            banner.innerHTML = `
                <div class="status-banner pending">
                    <span class="material-icons">hourglass_top</span>
                    <span>Ihr Beitritt zum Verein "${escHtml(user.verein_name)}" ${wartetText}. Bis zur Freigabe können Sie nur die Turnierliste ansehen, aber keine Turniere anlegen, bearbeiten oder auswählen.</span>
                </div>
            `;
            return false;
        }

        if (createBtn) createBtn.style.display = 'flex';
        banner.innerHTML = '';
        return true;
    }

    // Offene Beitrittsanfragen der Vereine, in denen das Konto Admin ist (/api/vereine/pending, sonst 403).
    // Freigeben nur mit Rolle: vorbelegt Helfer (Anfrage aus der Helfer-App) bzw. Benutzer, der Admin entscheidet.
    // Namen und Adressen stammen von anderen Konten: nur per textContent einsetzen.
    async function ladeUndRenderePendingRequests() {
        const pendingContainer = document.getElementById('pendingRequestsContainer');
        try {
            const resp = await fetch('/api/vereine/pending');
            if (!resp.ok) return;
            const pending = await resp.json();
            if (!Array.isArray(pending) || pending.length === 0) {
                pendingContainer.replaceChildren();
                return;
            }
            const { ROLLEN_TEXT, vorbelegteFreigabeRolle } = await import('/js/shared/menueRechte.js');

            const el = (tag, klasse, text) => {
                const e = document.createElement(tag);
                if (klasse) e.className = klasse;
                if (text != null) e.textContent = text;
                return e;
            };

            const karte = el('div', 'pending-requests-card');
            karte.append(el('h3', null, 'Ausstehende Beitrittsanfragen'));
            for (const p of pending) {
                const name = `${p.vorname || ''} ${p.nachname || ''}`.trim();
                const zeile = el('div', 'pending-request-row');
                zeile.dataset.userId = p.id;
                zeile.dataset.vereinId = p.verein_id;

                const angaben = el('div');
                angaben.append(el('div', 'req-name', name), el('div', 'req-email', `${p.email} · ${p.verein_name}`));

                const auswahl = el('select', 'rollen-auswahl');
                auswahl.setAttribute('aria-label', `Rolle für ${name}`);
                const vorbelegt = vorbelegteFreigabeRolle(p.angefragt_ueber);
                for (const rolle of ['helfer', 'benutzer', 'admin']) {
                    const option = el('option', null, ROLLEN_TEXT[rolle]);
                    option.value = rolle;
                    option.selected = rolle === vorbelegt;
                    auswahl.append(option);
                }

                const freigeben = el('button', 'btn btn-raised', 'Freigeben');
                freigeben.type = 'button';
                freigeben.dataset.action = 'approve';
                const ablehnen = el('button', 'btn btn-outlined', 'Ablehnen');
                ablehnen.type = 'button';
                ablehnen.dataset.action = 'reject';

                const entscheide = async (action) => {
                    freigeben.disabled = ablehnen.disabled = true;
                    try {
                        const daten = { userId: p.id, vereinId: p.verein_id };
                        if (action === 'approve') daten.rolle = auswahl.value;
                        const resp = await fetch(`/api/vereine/${action}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(daten)
                        });
                        const data = await resp.json().catch(() => ({}));
                        if (!resp.ok) throw new Error(data.error || 'Aktion fehlgeschlagen');
                        if (window.zeigeNotification) {
                            window.zeigeNotification(action === 'approve' ? 'Mitglied freigegeben.' : 'Anfrage abgelehnt.');
                        }
                        ladeUndRenderePendingRequests();
                        if (window.hajimeAktualisiereGenehmigungsHinweis) window.hajimeAktualisiereGenehmigungsHinweis();
                    } catch (err) {
                        freigeben.disabled = ablehnen.disabled = false;
                        if (window.zeigeNotification) window.zeigeNotification(err.message, 'error');
                        else alert(err.message);
                    }
                };
                freigeben.addEventListener('click', () => entscheide('approve'));
                ablehnen.addEventListener('click', () => entscheide('reject'));

                const aktionen = el('div', 'pending-request-actions');
                aktionen.append(auswahl, freigeben, ablehnen);
                zeile.append(angaben, aktionen);
                karte.append(zeile);
            }
            pendingContainer.replaceChildren(karte);
        } catch (err) {
            console.error('Fehler beim Laden der Beitrittsanfragen:', err);
        }
    }

    // Fragt den aktuellen Standort per Browser-Geolocation ab (für die "Entfernung"-Anzeige je
    // Turnierkarte, siehe renderCard). Liefert null bei Ablehnung, Timeout oder wenn der Browser
    // die API nicht unterstützt — die Seite funktioniert in allen Fällen weiterhin normal, nur
    // ohne Entfernungsangabe.
    function ermittleStandort() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (position) => resolve({ lat: position.coords.latitude, lon: position.coords.longitude }),
                () => resolve(null),
                { timeout: 5000, maximumAge: 10 * 60 * 1000 }
            );
        });
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('tournamentsContainer');

        // Per Event-Delegation (statt inline onclick), damit der Turniername nicht in ein
        // HTML-Attribut escaped werden muss — greift für alle Karten, auch nach jedem Neu-Rendern.
        container.addEventListener('click', (e) => {
            const link = e.target.closest('.ausschreibung-link');
            if (!link) return;
            window.zeigeAusschreibung(link.dataset.ausschreibungId, link.dataset.ausschreibungTitel);
        });

        let currentUser;
        try {
            currentUser = await ladeBenutzerStatus();
            if (!currentUser) return; // Redirect zur Vereinsauswahl bereits ausgelöst
        } catch (err) {
            container.innerHTML = `<div class="no-data-msg" style="color: #b83232;">Fehler: ${err.message}</div>`;
            return;
        }

        // Turnier-Import (aus einer zuvor exportierten JSON-Datei) gibt es nur offline —
        // online werden Turniere über die Vereinszugehörigkeit verwaltet, nicht per Datei.
        let istOffline = false;
        try {
            const configResp = await fetch('/api/config');
            istOffline = configResp.ok && !!(await configResp.json()).isOffline;

            const importTurnierBtn = document.getElementById('importTurnierBtn');
            if (importTurnierBtn) importTurnierBtn.style.display = istOffline ? 'inline-flex' : 'none';
        } catch (err) {
            console.error('Fehler beim Prüfen des Offline-Modus:', err);
        }

        const istFreigegeben = renderStatusBanner(currentUser);
        if (istFreigegeben) {
            ladeUndRenderePendingRequests();
        }

        try {
            // Aktuellen Standort per Browser-Geolocation ermitteln (freiwillig, mit kurzem
            // Timeout) — bei Ablehnung/Timeout/fehlender Unterstützung bleibt "Entfernung"
            // einfach aus, ohne den Rest der Seite zu blockieren.
            const standort = await ermittleStandort();
            // Hallen-Server: alle Turniere (auch abgeschlossene, kompakt am Ende der Liste)
            const abfrage = [istOffline ? '' : 'zukuenftig=true', standort ? `lat=${standort.lat}&lon=${standort.lon}` : ''].filter(Boolean);
            const zukuenftigUrl = '/api/turniere' + (abfrage.length ? '?' + abfrage.join('&') : '');

            const response = await fetch(zukuenftigUrl);
            if (!response.ok) {
                throw new Error('Fehler beim Laden der Turniere.');
            }

            const alleTurniere = await response.json();

            // Einladungen: Turniere, zu denen ein Verein, in dem ich Admin bin, per "Turnier teilen" eingeladen wurde
            // (nur Cloud; ohne Admin-Rolle bleibt die Liste leer). Sie stehen oben und fehlen dann in der übrigen Liste.
            let einladungen = [];
            if (!istOffline && istFreigegeben) {
                try {
                    const einladungenResp = await fetch('/api/turniere/einladungen');
                    if (einladungenResp.ok) einladungen = await einladungenResp.json();
                } catch (err) {
                    console.error('Fehler beim Laden der Einladungen:', err);
                }
            }
            const eingeladeneIds = new Set(einladungen.map(t => t.id));
            const turniere = alleTurniere.filter(t => !eingeladeneIds.has(t.id));
            if (turniere.length === 0 && einladungen.length === 0) {
                container.innerHTML = `<div class="no-data-msg">Keine Turniere vorhanden.</div>`;
                return;
            }

            // "Eigene" Turniere = Turniere des eigenen Vereins (einzige Zugriffsregel)
            const gehoertZuEigenemVerein = (t) => !!(currentUser.verein_id && t.verein_id === currentUser.verein_id);

            const eigeneTurniere = turniere.filter(gehoertZuEigenemVerein);
            const andereTurniere = turniere.filter(t => !gehoertZuEigenemVerein(t));
            // Super-Admins sehen die anstehenden Turniere aller Vereine und dürfen sie alle bearbeiten
            const istSuperAdmin = !!currentUser.super_admin_aktiv;

            const jetzt = new Date();

            const GESCHLECHT_KUERZEL = { 'männlich': 'm', 'weiblich': 'w', 'mixed': 'x' };

            function getAltersklassenGruppen(ak) {
                let keys = [];
                if (Array.isArray(ak)) {
                    keys = ak;
                } else if (ak && typeof ak === 'object') {
                    keys = Object.keys(ak);
                }
                if (keys.length === 0) return [[], [], []];

                // Aufsteigend nach Alter (U 9, U 11, ... U 21, dann Männer/Frauen/Mixed, dann Ü-Klassen, dann
                // sonstige frei benannte Klassen), innerhalb gleichen Alters nach Geschlecht (m, w, x).
                const GESCHLECHT_REIHENFOLGE = { 'männlich': 0, 'weiblich': 1, 'mixed': 2 };
                const sortSchluessel = (k) => {
                    const idx = k.indexOf('_');
                    const geschlecht = idx === -1 ? '' : k.slice(0, idx);
                    const id = idx === -1 ? k : k.slice(idx + 1);
                    const zahl = (id.match(/\d+/) || [])[0];
                    let alter;
                    if (/^U\s*\d+/i.test(id)) alter = parseInt(zahl, 10);
                    else if (['Männer', 'Frauen', 'Mixed'].includes(id)) alter = 100;
                    else if (/^Ü\s*\d+/i.test(id)) alter = 200 + parseInt(zahl, 10);
                    else alter = 1000;
                    return { alter, geschlecht: GESCHLECHT_REIHENFOLGE[geschlecht] ?? 3, id };
                };
                keys = [...keys].sort((a, b) => {
                    const x = sortSchluessel(a), y = sortSchluessel(b);
                    return (x.alter - y.alter) || (x.geschlecht - y.geschlecht) || x.id.localeCompare(y.id, 'de');
                });

                // Drei Zeilen: 1. gemischt (Ux), 2. weiblich (Uw, Frauen), 3. männlich (Um, Männer), jeweils nach Alter sortiert.
                const gruppen = [[], [], []];
                keys.forEach(k => {
                    const idx = k.indexOf('_');
                    if (idx === -1) { gruppen[0].push(k); return; }

                    const geschlecht = k.slice(0, idx);
                    const id = k.slice(idx + 1);
                    // Eigenständige Klassenbezeichnungen (z.B. "Männer"/"Frauen") brauchen kein
                    // Kürzel, da sie das Geschlecht bereits im Namen tragen. Alles andere —
                    // Standard-"U.."-Klassen genauso wie frei benannte Klassen wie "Ü 30" — braucht
                    // ein Kürzel, sonst würden z.B. männlich_Ü 30 und weiblich_Ü 30 im selben Chip
                    // "Ü 30" zusammenfallen und eine der beiden Klassen wäre in der Anzeige unsichtbar.
                    const brauchtKuerzel = !['Männer', 'Frauen', 'Mixed'].includes(id);
                    const label = brauchtKuerzel ? `${id}${GESCHLECHT_KUERZEL[geschlecht] || ''}` : id;
                    gruppen[geschlecht === 'weiblich' ? 1 : geschlecht === 'männlich' ? 2 : 0].push(label);
                });

                return gruppen.map(g => [...new Set(g)]);
            }

            // Fortschritt der Planungs-Tools in Prozent: Helfer-Dienste (belegte Plätze) und Orga (erledigte Aufgaben).
            // Beides erscheint nur, wenn es etwas zu zählen gibt.
            function planungsFortschritt(t) {
                const eintraege = [];
                if ((t.helfer_bedarf || 0) > 0) {
                    const belegt = Math.min(t.helfer_belegt || 0, t.helfer_bedarf);
                    eintraege.push({ name: 'Helfer-Dienste', icon: 'volunteer_activism', prozent: Math.floor((belegt / t.helfer_bedarf) * 100), detail: `${belegt} von ${t.helfer_bedarf} Plätzen` });
                }
                if ((t.orga_gesamt || 0) > 0) {
                    const erledigt = Math.min(t.orga_erledigt || 0, t.orga_gesamt);
                    eintraege.push({ name: 'Vorbereitung', icon: 'checklist', prozent: Math.floor((erledigt / t.orga_gesamt) * 100), detail: `${erledigt} von ${t.orga_gesamt} Aufgaben` });
                }
                return eintraege;
            }
            function fortschrittHtml(e, kompakt) {
                return `<div class="helfer-fortschritt" title="${escHtml(e.detail)}"${kompakt ? ' style="margin-top: 8px;"' : ''}>
                    <span${kompakt ? ' style="font-size: 13px; color: var(--text-muted);"' : ''}>${escHtml(e.name)}: ${e.prozent} % fertig${kompakt ? '' : ` (${escHtml(e.detail)})`}</span>
                    <div class="helfer-fortschritt-balken"><div class="${e.prozent >= 100 ? 'voll' : ''}" style="width: ${e.prozent}%"></div></div>
                </div>`;
            }

            // Chips als bis zu drei Zeilen (nur nicht leere Gruppen)
            function chipZeilen(gruppen) {
                return gruppen.filter(g => g.length > 0).map(g =>
                    `<div class="ak-chip-row">${g.map(l => `<span class="ak-chip">${escHtml(l)}</span>`).join('')}</div>`
                ).join('');
            }

            const STATUS_LABELS = {
                entwurf: 'Entwurf',
                veroeffentlicht: 'Anmeldung läuft',
                anmeldung_geschlossen: 'Anmeldung geschlossen',
                in_durchfuehrung: 'In Durchführung',
                abgeschlossen: 'Abgeschlossen',
                abgesagt: 'Abgesagt'
            };

            // Hallen-Server: aktiv / geplant (Entwurf bleibt Entwurf) statt der Anmelde-Zustände
            function hallenStatus(t) {
                if (t.aktiv) return { klasse: 'aktiv', label: 'Aktiv' };
                if (t.status === 'abgeschlossen') return { klasse: 'abgeschlossen', label: 'Abgeschlossen' };
                if (t.status === 'abgesagt') return { klasse: 'abgesagt', label: 'Abgesagt' };
                if (t.status === 'entwurf') return { klasse: 'entwurf', label: 'Entwurf' };
                return { klasse: 'geplant', label: 'Geplant' };
            }

            // Zu jedem Cloud-Turnier zählt nur das jüngste lokale Turnier (dorthin spielt der Server zurück).
            const juengsteJeCloudTurnier = new Map();
            turniere.forEach(t => {
                if (t.urspruengliche_id == null) return;
                const bisher = juengsteJeCloudTurnier.get(String(t.urspruengliche_id));
                if (bisher === undefined || Number(t.id) > bisher) juengsteJeCloudTurnier.set(String(t.urspruengliche_id), Number(t.id));
            });
            // Knopf „In die Cloud zurückspielen“: nur für Turniere aus der Cloud; sichtbar erst, wenn die Cloud erreichbar ist.
            function rueckspielKnopf(t) {
                if (!istOffline || t.urspruengliche_id == null) return '';
                if (juengsteJeCloudTurnier.get(String(t.urspruengliche_id)) !== Number(t.id)) return '';
                return `<button type="button" class="btn btn-outlined rueckspiel-knopf" style="display:none;" data-aktion="zurueckspielen" data-id="${escHtml(t.id)}" aria-label="In die Cloud zurückspielen" data-tooltip="Ergebnisse, Teilnehmer und Barzahlungen in die Cloud zurückspielen"><span class="material-icons" style="font-size:18px; vertical-align:middle;">cloud_upload</span> In die Cloud zurückspielen</button>`;
            }

            function hallenAktionen(t) {
                const aktivieren = t.aktivierbar
                    ? `<button type="button" class="btn btn-aktivieren" data-aktion="aktivieren" data-id="${t.id}">Aktivieren</button>` : '';
                const duplizieren = `<button type="button" class="btn btn-outlined btn-icon-aktion" data-aktion="duplizieren" data-id="${t.id}" aria-label="Duplizieren" data-tooltip="Duplizieren"><span class="material-icons">content_copy</span></button>`;
                return aktivieren + rueckspielKnopf(t) + duplizieren;
            }

            function renderCard(t, isEditable) {
                let deadlineExpired = false;
                let deadlineStr = 'Keine Frist';
                const hallen = istOffline ? hallenStatus(t) : null;
                const statusLabel = hallen ? hallen.label : (STATUS_LABELS[t.status_effektiv] || t.status_effektiv || '');
                const statusKlasse = hallen ? hallen.klasse : t.status_effektiv;

                if (t.anmeldeschluss) {
                    // Anmeldeschluss gilt bis einschließlich 24:00 Uhr Ortszeit dieses Tages
                    // (identische Logik zu turnier.js/turnierController.js) — reines Datum ohne
                    // Uhrzeit würde sonst schon zu Beginn des Tages als "abgelaufen" gelten.
                    const deadlineDate = new Date(t.anmeldeschluss);
                    if (/^\d{4}-\d{2}-\d{2}$/.test(String(t.anmeldeschluss).trim())) {
                        deadlineDate.setHours(23, 59, 59, 999);
                    }
                    deadlineExpired = jetzt > deadlineDate;

                    if (deadlineExpired) {
                        deadlineStr = 'abgelaufen';
                    } else {
                        const day = String(deadlineDate.getDate()).padStart(2, '0');
                        const month = String(deadlineDate.getMonth() + 1).padStart(2, '0');
                        const year = deadlineDate.getFullYear();
                        const hours = String(deadlineDate.getHours()).padStart(2, '0');
                        const minutes = String(deadlineDate.getMinutes()).padStart(2, '0');
                        deadlineStr = `${day}.${month}.${year} ${hours}:${minutes} Uhr`;
                    }
                }

                let dateStr = '';
                if (t.datum) {
                    const dateObj = new Date(t.datum);
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const year = dateObj.getFullYear();
                    dateStr = `${day}.${month}.${year}`;
                }

                return `
                    <div class="tournament-card ${!istOffline && deadlineExpired ? 'expired' : ''} ${t.aktiv ? 'aktiv' : ''}">
                        <div>
                            <h2 class="tournament-name">${escHtml(t.bezeichnung)}<span class="status-badge status-${escHtml(statusKlasse)}">${escHtml(statusLabel)}</span></h2>
                            <div class="tournament-details">
                                <div class="detail-item">
                                    <span class="material-icons">calendar_today</span>
                                    <span>Datum: ${dateStr}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="material-icons">place</span>
                                    <span>Ort: ${t.plz ? `${escHtml(t.plz)} ` : ''}${escHtml(t.ort)}${t.bundesland ? ` (${escHtml(t.bundesland)})` : ''}</span>
                                </div>
                                ${t.entfernung_km !== null && t.entfernung_km !== undefined ? `
                                <div class="detail-item">
                                    <span class="material-icons">near_me</span>
                                    <span>Entfernung: ca. ${t.entfernung_km.toLocaleString('de-DE')} km (Luftlinie)</span>
                                </div>` : ''}
                                ${t.hat_ausschreibung ? `
                                <div class="detail-item ausschreibung-link" style="cursor: pointer; color: var(--primary); font-weight: 700;" data-ausschreibung-id="${t.id}" data-ausschreibung-titel="${t.bezeichnung}">
                                    <span class="material-icons">picture_as_pdf</span>
                                    <span>Ausschreibung ansehen</span>
                                </div>` : ''}
                                <div class="detail-item">
                                    <span class="material-icons">business</span>
                                    <span>Ausrichter: ${escHtml(t.ausrichter)}</span>
                                </div>
                                ${t.eingeladene_vereine && t.eingeladene_vereine.length ? `
                                <div class="detail-item">
                                    <span class="material-icons">forward_to_inbox</span>
                                    <span>Eingeladen: ${escHtml(t.eingeladene_vereine.join(', '))}</span>
                                </div>` : ''}
                                <div class="detail-item">
                                    <span class="material-icons">layers</span>
                                    <span>Matten: ${t.anzahl_kampfflaechen}</span>
                                </div>
                                <div class="detail-item" style="align-items: flex-start;">
                                    <span class="material-icons">military_tech</span>
                                    <div>
                                        <span>Altersklassen:</span>
                                        ${(() => {
                                            const zeilen = chipZeilen(getAltersklassenGruppen(t.altersklassen));
                                            return zeilen || '<div class="ak-chip-row"><span class="ak-chip ak-chip-empty">–</span></div>';
                                        })()}
                                    </div>
                                </div>
                                ${(() => {
                                    const mannschaftGruppen = getAltersklassenGruppen(t.mannschafts_altersklassen);
                                    if (mannschaftGruppen.every(g => g.length === 0)) return '';
                                    return `
                                <div class="detail-item" style="align-items: flex-start;">
                                    <span class="material-icons">groups_2</span>
                                    <div>
                                        <span>Mannschaften:</span>
                                        ${chipZeilen(mannschaftGruppen)}
                                    </div>
                                </div>`;
                                })()}
                                <div class="detail-item">
                                    <span class="material-icons">groups</span>
                                    <span>Gemeldete Teilnehmer: ${t.teilnehmer_anzahl || 0}</span>
                                </div>
                                ${planungsFortschritt(t).map(e => `
                                <div class="detail-item">
                                    <span class="material-icons">${e.icon}</span>
                                    ${fortschrittHtml(e, false)}
                                </div>`).join('')}
                                <div class="detail-item">
                                    <span class="material-icons">timer</span>
                                    <span>Anmeldefrist:
                                        <span class="deadline-badge ${deadlineExpired ? 'expired' : 'active'}">${deadlineStr}</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="card-actions">
                            <!-- "Auswählen" bleibt für fremde Turniere auch vor der eigenen Freigabe erreichbar
                                 (Gastverein meldet nur eigene Athlet:innen an, serverseitig ohnehin auf den
                                 eigenen Verein beschränkt, siehe teilnehmerController.js) — nur das Verwalten
                                 des EIGENEN Turniers braucht die Freigabe. -->
                            ${(istFreigegeben || !isEditable) ? `<button type="button" class="btn btn-raised" onclick="window.location.href='/teilnehmer.html?turnierId=${encodeURIComponent(t.id)}'">Auswählen</button>` : ''}
                            ${isEditable && istFreigegeben ? `<button type="button" class="btn btn-outlined" onclick="window.location.href='/turnier.html?id=${t.id}'">Bearbeiten</button>` : ''}
                            ${(!istOffline && isEditable && istFreigegeben && ['veroeffentlicht', 'anmeldung_geschlossen', 'in_durchfuehrung', 'abgeschlossen'].includes(t.status_effektiv))
                                ? `<button type="button" class="btn btn-outlined" data-aktion="teilen" data-id="${t.id}" aria-label="Vereine einladen" data-tooltip="Vereine zum Turnier einladen"><span class="material-icons" style="font-size:18px; vertical-align:middle;">group_add</span> Einladen</button>` : ''}
                            ${(!istOffline && isEditable && istFreigegeben && ['veroeffentlicht', 'anmeldung_geschlossen', 'in_durchfuehrung'].includes(t.status_effektiv))
                                ? `<button type="button" class="btn btn-outlined" onclick="window.location.href='/cloud-live.html?turnierId=${encodeURIComponent(t.id)}'" aria-label="Turnier live in der Cloud führen" data-tooltip="Turnier live in der Cloud führen"><span class="material-icons" style="font-size:18px; vertical-align:middle;">cell_tower</span> Live</button>` : ''}
                            ${istOffline ? hallenAktionen(t) : ''}
                        </div>
                    </div>
                `;
            }

            // Kompakte Karte für den Hallen-Server: Datum/Ort in einer Zeile, Eckdaten als Chips. Das Bearbeiten
            // der Stammdaten läuft über "Auswählen" und den Menüpunkt "Turnier".
            function renderKompakteKarte(t) {
                const hallen = hallenStatus(t);
                const o = t.datum ? new Date(t.datum) : null;
                const dateStr = o ? `${String(o.getDate()).padStart(2, '0')}.${String(o.getMonth() + 1).padStart(2, '0')}.${o.getFullYear()}` : '';
                const einzelG = getAltersklassenGruppen(t.altersklassen), teamG = getAltersklassenGruppen(t.mannschafts_altersklassen);
                const chipGruppen = einzelG.map((g, i) => [...g, ...teamG[i]]);
                const waehlen = istFreigegeben
                    ? `<button type="button" class="btn btn-raised" onclick="window.location.href='/teilnehmer.html?turnierId=${encodeURIComponent(t.id)}'">Auswählen</button>` : '';
                return `
                    <div class="tournament-card kompakt ${t.aktiv ? 'aktiv' : ''}">
                        <div>
                            <h2 class="tournament-name">${escHtml(t.bezeichnung)}<span class="status-badge status-${escHtml(hallen.klasse)}">${escHtml(hallen.label)}</span></h2>
                            <div class="kompakt-ort"><span class="material-icons">calendar_today</span><span>${escHtml(dateStr)} · ${t.plz ? `${escHtml(t.plz)} ` : ''}${escHtml(t.ort)}</span></div>
                            <div class="info-chips">
                                <span class="info-chip">${escHtml(t.anzahl_kampfflaechen)} Matten</span>
                                <span class="info-chip">${escHtml(t.teilnehmer_anzahl || 0)} Teilnehmer</span>
                                ${t.anmeldeschluss ? `<span class="info-chip">Frist ${escHtml(String(t.anmeldeschluss).slice(0, 10).split('-').reverse().join('.'))}</span>` : ''}
                            </div>
                            ${chipZeilen(chipGruppen)}
                            ${planungsFortschritt(t).map(e => fortschrittHtml(e, true)).join('')}
                        </div>
                        <div class="card-actions">
                            ${waehlen}
                            ${hallenAktionen(t)}
                        </div>
                    </div>
                `;
            }

            let htmlContent = '';

            if (istOffline) {
                const aktives = turniere.filter(t => t.aktiv);
                const geplant = turniere.filter(t => !t.aktiv && !['abgeschlossen', 'abgesagt'].includes(t.status))
                    .sort((a, b) => String(a.datum).localeCompare(String(b.datum)));
                const fertig = turniere.filter(t => !t.aktiv && ['abgeschlossen', 'abgesagt'].includes(t.status));
                const datumKurz = (d) => { const o = new Date(d); return `${String(o.getDate()).padStart(2, '0')}.${String(o.getMonth() + 1).padStart(2, '0')}.${o.getFullYear()}`; };

                // Aktives Turnier (roter Rahmen) zuerst, daneben die übrigen lokalen Turniere.
                const lokale = [...aktives, ...geplant];
                if (lokale.length) {
                    htmlContent += `<h2 class="section-title"><span class="material-icons" style="font-size:20px;">apartment</span> Lokale Turniere</h2>
                        <div class="tournaments-grid lokal-grid">${lokale.map(t => renderKompakteKarte(t)).join('')}</div>`;
                }
                let abgeschlossenHtml = '';
                if (fertig.length) {
                    abgeschlossenHtml += `<h2 class="section-title"><span class="material-icons" style="font-size:20px;">inventory_2</span> Abgeschlossen</h2>
                        <div class="abgeschlossen-liste">${fertig.map(t => `
                            <div class="abgeschlossen-zeile" data-turnier-id="${t.id}">
                                <span class="material-icons">${t.status === 'abgesagt' ? 'cancel' : 'check'}</span>
                                <span class="az-name">${escHtml(t.bezeichnung)}</span>
                                <span>${escHtml(datumKurz(t.datum))}</span>
                                <span>${escHtml(t.ort)}</span>
                                <span>${escHtml(t.teilnehmer_anzahl || 0)} Teilnehmer</span>
                                ${t.status === 'abgeschlossen' ? rueckspielKnopf(t) : ''}
                                <button type="button" class="btn btn-outlined btn-icon-aktion" data-aktion="duplizieren" data-id="${t.id}" aria-label="Duplizieren" data-tooltip="Duplizieren"><span class="material-icons">content_copy</span></button>
                            </div>`).join('')}</div>`;
                }
                container.innerHTML = htmlContent;
                // Abgeschlossene Turniere stehen immer ganz unten, hinter dem Cloud-Bereich.
                const abgeschlossenBereich = document.getElementById('abgeschlossenBereich');
                abgeschlossenBereich.innerHTML = abgeschlossenHtml;
                cloudVerfuegbar().then((verfuegbar) => {
                    if (!verfuegbar) return;
                    document.querySelectorAll('.rueckspiel-knopf').forEach(k => { k.style.display = ''; });
                });

                const behandleKlick = async (e) => {
                    const knopf = e.target.closest('button[data-aktion]');
                    if (!knopf) return;
                    const turnier = turniere.find(t => String(t.id) === knopf.dataset.id);
                    if (knopf.dataset.aktion === 'duplizieren') {
                        window.TurnierDuplizieren.oeffne(turnier, () => window.location.reload());
                    } else if (knopf.dataset.aktion === 'zurueckspielen') {
                        window.RueckspielDialog.oeffne(turnier);
                    } else if (knopf.dataset.aktion === 'aktivieren') {
                        knopf.disabled = true;
                        const resp = await fetch(`/api/turniere/${knopf.dataset.id}/aktivieren`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                        const daten = await resp.json().catch(() => ({}));
                        if (!resp.ok) {
                            knopf.disabled = false;
                            if (window.zeigeNotification) window.zeigeNotification(daten.error || 'Aktivieren fehlgeschlagen.', 'error');
                            return;
                        }
                        window.location.reload();
                    }
                };
                container.addEventListener('click', behandleKlick);
                abgeschlossenBereich.addEventListener('click', behandleKlick);
                return;
            }

            // Section 0: Einladungen (Admins eingeladener Vereine)
            if (einladungen.length > 0) {
                htmlContent += `
                    <h2 class="section-title" id="einladungenTitel"><span class="material-icons" style="font-size:20px;">forward_to_inbox</span> Einladungen (${einladungen.length})</h2>
                    <div class="tournaments-grid" id="einladungenGrid">
                        ${einladungen.map(t => renderCard(t, false)).join('')}
                    </div>
                `;
            }

            // Section 1: Eigene Turniere (Only if exists)
            if (eigeneTurniere.length > 0) {
                // Vergangene Turniere (Entwürfe ausgenommen) stehen klein und als archiviert unter den aktuellen.
                const tagStart = new Date(); tagStart.setHours(0, 0, 0, 0);
                const istVergangen = (t) => t.status !== 'entwurf' && t.datum && new Date(t.datum) < tagStart;
                const eigeneAktuell = eigeneTurniere.filter(t => !istVergangen(t));
                const eigeneArchiviert = eigeneTurniere.filter(istVergangen);
                const datumKurzCloud = (d) => { const o = new Date(d); return `${String(o.getDate()).padStart(2, '0')}.${String(o.getMonth() + 1).padStart(2, '0')}.${o.getFullYear()}`; };
                htmlContent += `
                    <h2 class="section-title"><span class="material-icons" style="font-size:20px;">star</span> Eigene Turniere</h2>
                    ${eigeneAktuell.length ? `<div class="tournaments-grid">
                        ${eigeneAktuell.map(t => renderCard(t, true)).join('')}
                    </div>` : ''}
                    ${eigeneArchiviert.length ? `<div class="abgeschlossen-liste">${eigeneArchiviert.map(t => `
                        <div class="abgeschlossen-zeile" data-turnier-id="${t.id}" style="cursor:pointer;" onclick="window.location.href='/turnier.html?id=${encodeURIComponent(t.id)}'">
                            <span class="material-icons">inventory_2</span>
                            <span class="az-name">${escHtml(t.bezeichnung)}</span>
                            <span>${escHtml(datumKurzCloud(t.datum))}</span>
                            <span class="status-badge status-abgeschlossen">Archiviert</span>
                            ${t.abrechnung_offen ? '<span class="abrechnung-warnung"><span class="material-icons">warning</span>Abrechnung offen</span>' : ''}
                        </div>`).join('')}</div>` : ''}
                `;
            }

            // Section 2: Andere Turniere
            if (andereTurniere.length > 0) {
                const sectionTitle = istSuperAdmin ? 'Turniere aller Vereine' : (eigeneTurniere.length > 0 ? 'Ausschreibungen & andere Turniere' : 'Alle Turniere');
                htmlContent += `
                    <h2 class="section-title"><span class="material-icons" style="font-size:20px;">explore</span> ${sectionTitle}</h2>
                    <div class="tournaments-grid">
                        ${andereTurniere.map(t => renderCard(t, istSuperAdmin)).join('')}
                    </div>
                `;
            }

            container.innerHTML = htmlContent;
            container.addEventListener('click', (e) => {
                const knopf = e.target.closest('button[data-aktion="teilen"]');
                if (!knopf) return;
                const turnier = turniere.find(t => String(t.id) === knopf.dataset.id);
                if (turnier) window.TurnierTeilen.oeffne(turnier);
            });
        } catch (err) {
            container.innerHTML = `<div class="no-data-msg" style="color: #b83232;">Fehler: ${err.message}</div>`;
        }
    });

    // --- TURNIER-IMPORT (nur Offline-Modus, Button-Sichtbarkeit siehe oben) ---
    function liesDateiAlsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = () => reject(new Error('Datei konnte nicht gelesen werden.'));
            reader.readAsDataURL(file);
        });
    }

    const importTurnierBtn = document.getElementById('importTurnierBtn');
    const importTurnierFileInput = document.getElementById('importTurnierFileInput');
    const importTurnierStatus = document.getElementById('importTurnierStatus');

    if (importTurnierBtn && importTurnierFileInput) {
        importTurnierBtn.addEventListener('click', () => importTurnierFileInput.click());

        importTurnierFileInput.addEventListener('change', async () => {
            const file = importTurnierFileInput.files[0];
            importTurnierFileInput.value = '';
            if (!file) return;

            importTurnierStatus.style.display = 'block';
            importTurnierStatus.textContent = `Importiere "${file.name}" ...`;

            try {
                const contentBase64 = await liesDateiAlsBase64(file);
                const response = await fetch('/api/turniere/import', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contentBase64 })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Import fehlgeschlagen.');
                }

                const meldung = `Turnier importiert: ${data.imported.teilnehmer} Teilnehmer, ${data.imported.pools} Pools, ${data.imported.kampfflaechen} Matten.`;
                importTurnierStatus.textContent = meldung;
                if (window.zeigeNotification) window.zeigeNotification(meldung, 'success');

                window.location.href = `/teilnehmer.html?turnierId=${data.turnierId}`;
            } catch (err) {
                importTurnierStatus.textContent = '';
                if (window.zeigeNotification) window.zeigeNotification('Import-Fehler: ' + err.message, 'error');
                else alert('Import-Fehler: ' + err.message);
            }
        });
    }

    // --- TURNIERE AUS DER CLOUD (nur Hallen-Server, nur wenn die Cloud erreichbar ist) ---
    (function () {
        const bereich = document.getElementById('cloudBereich');
        if (!bereich) return;
        const form = document.getElementById('cloudLoginForm');
        const fehlerBox = document.getElementById('cloudFehler');
        const liste = document.getElementById('cloudListe');
        const loginBtn = document.getElementById('cloudLoginBtn');
        // Token nur im Arbeitsspeicher dieser Seite, nie in Storage oder URL
        let cloudToken = null;

        // Meldung des vorigen Holens (die Seite wurde danach neu geladen)
        try {
            const geholt = sessionStorage.getItem('turnierGeholtMeldung');
            if (geholt) {
                sessionStorage.removeItem('turnierGeholtMeldung');
                setTimeout(() => (window.zeigeNotification ? window.zeigeNotification(geholt, 'success') : null), 400);
            }
        } catch { /* kein Storage: keine Meldung */ }

        const ERLAUBTE_STATUS = ['anmeldung_geschlossen', 'in_durchfuehrung', 'abgeschlossen'];
        const STATUS_TEXT = {
            entwurf: 'Entwurf', veroeffentlicht: 'Anmeldung läuft', anmeldung_geschlossen: 'Anmeldung geschlossen',
            in_durchfuehrung: 'In Durchführung', abgeschlossen: 'Abgeschlossen', abgesagt: 'Abgesagt'
        };

        // Maskiert auch Anführungszeichen, da Werte in HTML-Attribute (data-name) eingesetzt werden
        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        // Statuswert nur als Klassenname zulassen, wenn er aus Kleinbuchstaben/Unterstrich besteht
        function statusKlasse(s) {
            return /^[a-z_]+$/.test(String(s || '')) ? String(s) : 'unbekannt';
        }
        function datum(s) {
            if (!s) return '';
            const d = new Date(s);
            if (isNaN(d)) return esc(s);
            return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}.${d.getFullYear()}`;
        }
        function zeigeFehler(text) {
            fehlerBox.textContent = text || '';
            fehlerBox.style.display = text ? 'block' : 'none';
        }
        function meldung(text, typ) {
            if (window.zeigeNotification) window.zeigeNotification(text, typ);
            else alert(text);
        }

        function renderListe(turniere) {
            if (!turniere.length) {
                liste.innerHTML = '<div class="no-data-msg">Keine Turniere in der Cloud.</div>';
                return;
            }
            liste.innerHTML = '<div class="tournaments-grid lokal-grid">' + turniere.map(t => {
                const holbar = ERLAUBTE_STATUS.includes(t.status_effektiv);
                const status = STATUS_TEXT[t.status_effektiv] || t.status_effektiv || '';
                const aktion = holbar
                    ? `<button type="button" class="btn btn-raised cloud-holen" data-id="${esc(t.id)}" data-name="${esc(t.bezeichnung)}">Auf diesen Server holen</button>`
                    : `<span class="cloud-hinweis">${t.status_effektiv === 'veroeffentlicht'
                        ? 'Anmeldung läuft noch' + (t.anmeldeschluss ? ' (bis ' + datum(t.anmeldeschluss) + ')' : '')
                        : 'Noch nicht abholbar'}</span>`;
                return `
                    <div class="tournament-card kompakt cloud-karte">
                        <div>
                            <h2 class="tournament-name"><span class="material-icons" style="font-size:16px;vertical-align:-3px;">cloud</span> ${esc(t.bezeichnung)}<span class="status-badge status-${statusKlasse(t.status_effektiv)}">${esc(status)}</span></h2>
                            <div class="kompakt-ort"><span class="material-icons">calendar_today</span><span>${datum(t.datum)} · ${esc(t.ort)}</span></div>
                            <div class="info-chips"><span class="info-chip">${esc(t.teilnehmer_anzahl || 0)} Teilnehmer</span></div>
                        </div>
                        <div class="card-actions">${aktion}</div>
                    </div>`;
            }).join('') + '</div>';
        }

        async function holen(id, name, ersetzen = false) {
            zeigeFehler('');
            liste.querySelectorAll('.cloud-holen').forEach(b => { b.disabled = true; });
            try {
                const resp = await fetch(`/api/cloud/turniere/${encodeURIComponent(id)}/holen`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: cloudToken, ersetzen })
                });
                const data = await resp.json().catch(() => ({}));
                if (resp.status === 409 && data.terminKonflikt) {
                    // Am selben Tag gibt es schon ein Turnier (vermutlich dasselbe): ersetzen nur nach Rückfrage
                    liste.querySelectorAll('.cloud-holen').forEach(b => { b.disabled = false; });
                    const k = data.terminKonflikt;
                    if (window.confirm(`Am selben Tag gibt es hier bereits das Turnier „${k.bezeichnung}“.\n\nSoll es durch die Cloud-Version „${name}“ ersetzt werden?\nAlle lokal vorgenommenen Änderungen gehen dabei verloren und das vorhandene Turnier wird gelöscht.`)) {
                        return holen(id, name, true);
                    }
                    return;
                }
                if (!resp.ok) throw new Error(data.error || 'Das Turnier konnte nicht geholt werden.');
                // Die Turnierauswahl lädt neu, damit das geholte Turnier in der Liste steht (samt Hinweis zum Starten); die Meldung folgt nach dem Neuladen
                try { sessionStorage.setItem('turnierGeholtMeldung', `Turnier geholt: ${data.imported.teilnehmer} Teilnehmer, ${data.imported.pools} Pools, ${data.imported.kampfflaechen} Matten.`); } catch { /* ohne Meldung weiter */ }
                window.location.reload();
            } catch (err) {
                zeigeFehler(err.message);
                liste.querySelectorAll('.cloud-holen').forEach(b => { b.disabled = false; });
            }
        }

        liste.addEventListener('click', (e) => {
            const btn = e.target.closest('.cloud-holen');
            if (btn) holen(btn.dataset.id, btn.dataset.name);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            zeigeFehler('');
            loginBtn.disabled = true;
            try {
                const resp = await fetch('/api/cloud/turniere', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('cloudEmail').value.trim(),
                        password: document.getElementById('cloudPasswort').value
                    })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.error || 'Anmeldung an der Cloud fehlgeschlagen.');
                cloudToken = data.token;
                // Passwort sofort verwerfen, es wird nicht mehr gebraucht
                document.getElementById('cloudPasswort').value = '';
                form.style.display = 'none';
                renderListe(data.turniere || []);
            } catch (err) {
                zeigeFehler(err.message);
            } finally {
                loginBtn.disabled = false;
            }
        });

        // Bereich nur einblenden, wenn dies ein Hallen-Server ist und die Cloud antwortet
        cloudVerfuegbar().then((verfuegbar) => {
            if (verfuegbar) bereich.style.display = 'block';
        });
    })();
</script>
</body>
</html>
