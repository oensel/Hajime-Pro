<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Anmeldung</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #111827 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
        }
        .login-card {
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            color: #f3f4f6;
            box-sizing: border-box;
        }
        .login-title {
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #3b82f6;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .login-logo {
            display: block;
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 0 auto;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .login-subtitle {
            font-size: 13px;
            color: #9ca3af;
            font-weight: 600;
            margin: 0 0 24px 0;
            text-align: center;
        }
        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: #111827;
            border-radius: 4px;
            padding: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: #9ca3af;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: #ffffff;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
        }
        .form-group label {
            font-size: 12px;
            font-weight: bold;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            padding: 12px 14px;
            border: 1px solid #4b5563;
            border-radius: 4px;
            background: #111827;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #3b82f6;
        }
        .btn-login {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 100%;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #2563eb;
        }
        .error-message {
            margin-top: 16px;
            color: #ef4444;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            display: none;
        }
        .info-message {
            margin-top: 16px;
            color: #f3f4f6;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            line-height: 1.5;
            display: none;
        }
        .passwort-vergessen {
            display: block;
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            color: #93c5fd;
        }
        .btn-link {
            background: none;
            border: none;
            color: #93c5fd;
            font-size: 13px;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 8px;
            display: none;
        }
        .form-hinweis {
            font-size: 12px;
            color: #9ca3af;
        }
        .verein-suche {
            position: relative;
        }
        .verein-suche input {
            width: 100%;
            box-sizing: border-box;
        }
        .verein-vorschlaege {
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            z-index: 10;
            margin: 2px 0 0 0;
            padding: 4px 0;
            list-style: none;
            max-height: 220px;
            overflow-y: auto;
            background: #111827;
            border: 1px solid #4b5563;
            border-radius: 4px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }
        .verein-vorschlaege[hidden] {
            display: none;
        }
        .verein-vorschlaege li {
            padding: 10px 14px;
            font-size: 14px;
            color: #f3f4f6;
            cursor: pointer;
        }
        .verein-vorschlaege li:hover,
        .verein-vorschlaege li[aria-selected="true"] {
            background: #3b82f6;
            color: #ffffff;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="kanji-left" style="color: rgba(255,255,255,0.02)">柔</div>
<div class="kanji-right" style="color: rgba(255,255,255,0.02)">道</div>

<div class="login-card">
    <h1 class="login-title"><img class="login-logo" src="/hajime_pro.png" alt="Hajime Pro"></h1>
    <p class="login-subtitle">Lokale Anmeldung</p>

    <div class="tab-bar">
        <button type="button" class="tab-btn active" id="tabLogin">Anmelden</button>
        <button type="button" class="tab-btn" id="tabRegister">Konto erstellen</button>
    </div>

    <form id="loginForm" class="auth-form active">
        <div class="form-group">
            <label for="loginEmail">E-Mail-Adresse</label>
            <input type="email" id="loginEmail" required placeholder="name@beispiel.de">
        </div>
        <div class="form-group">
            <label for="loginPassword">Passwort</label>
            <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">Einloggen</button>
        <a class="passwort-vergessen" id="passwortVergessen" href="/passwort-zuruecksetzen.html">Passwort vergessen?</a>
    </form>

    <form id="registerForm" class="auth-form">
        <div class="form-group">
            <label for="registerVorname">Vorname</label>
            <input type="text" id="registerVorname" required placeholder="Max">
        </div>
        <div class="form-group">
            <label for="registerNachname">Nachname</label>
            <input type="text" id="registerNachname" required placeholder="Mustermann">
        </div>
        <div class="form-group">
            <label for="registerEmail">E-Mail-Adresse</label>
            <input type="email" id="registerEmail" required placeholder="name@beispiel.de">
        </div>
        <div class="form-group">
            <label for="registerPassword">Passwort</label>
            <input type="password" id="registerPassword" required placeholder="mindestens 8 Zeichen" minlength="8">
        </div>
        <div class="form-group">
            <label for="registerVerein">Verein (optional)</label>
            <div class="verein-suche">
                <input type="text" id="registerVerein" autocomplete="off" role="combobox"
                       aria-autocomplete="list" aria-expanded="false" aria-controls="registerVereinListe"
                       aria-describedby="registerVereinHinweis" placeholder="Vereinsname eingeben (ab 2 Zeichen)">
                <ul id="registerVereinListe" class="verein-vorschlaege" role="listbox" hidden></ul>
            </div>
            <span id="registerVereinHinweis" class="form-hinweis" role="status">Nur Vereine aus der Liste. Ohne Angabe wählst du den Verein nach der Anmeldung.</span>
        </div>
        <button type="submit" class="btn-login">Konto erstellen</button>
    </form>

    <div id="errorMessage" class="error-message"></div>
    <div id="infoMessage" class="info-message" role="status"></div>
    <button type="button" id="bestaetigungErneut" class="btn-link">Mail erneut senden</button>
</div>

<script>
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const errDiv = document.getElementById('errorMessage');
    const infoDiv = document.getElementById('infoMessage');
    const erneutKnopf = document.getElementById('bestaetigungErneut');
    // Adresse, an die "Bestätigungsmail erneut senden" geht (nach Registrierung bzw. Login eines unbestätigten Kontos).
    let unbestaetigteEmail = '';

    function zeigeInfo(text, mitErneutKnopf) {
        infoDiv.textContent = text;
        infoDiv.style.display = 'block';
        erneutKnopf.style.display = mitErneutKnopf ? 'inline-block' : 'none';
    }

    function versteckeMeldungen() {
        errDiv.style.display = 'none';
        infoDiv.style.display = 'none';
        erneutKnopf.style.display = 'none';
    }

    erneutKnopf.addEventListener('click', async () => {
        if (!unbestaetigteEmail) return;
        erneutKnopf.disabled = true;
        try {
            const response = await fetch('/api/auth/email-bestaetigung-erneut', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: unbestaetigteEmail })
            });
            const data = await response.json();
            errDiv.style.display = 'none';
            zeigeInfo(data.message || 'Bestätigungsmail wurde erneut gesendet.', false);
        } finally {
            erneutKnopf.disabled = false;
        }
    });

    function showTab(tab) {
        versteckeMeldungen();
        if (tab === 'login') {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.classList.add('active');
            registerForm.classList.remove('active');
        } else {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            registerForm.classList.add('active');
            loginForm.classList.remove('active');
        }
    }

    // Im Hallen-Server (Einzelbenutzerbetrieb) gibt es weder Konten noch Mails: kein Link zum Zurücksetzen
    istEinzelbenutzer().then((einzel) => { if (einzel) document.getElementById('passwortVergessen').style.display = 'none'; });

    tabLogin.addEventListener('click', () => showTab('login'));
    tabRegister.addEventListener('click', () => showTab('register'));

    // Reine Logik (Vereinssuche, Menü-Rechte) liegt DOM-frei in src/shared/ (ausgeliefert unter /js/shared).
    const geteilt = Promise.all([
        import('/js/shared/helferAnzeige.js'),
        import('/js/shared/menueRechte.js')
    ]).then(([anzeige, rechte]) => ({ ...anzeige, ...rechte }));

    async function istEinzelbenutzer() {
        try {
            const resp = await fetch('/api/config');
            return resp.ok ? !!(await resp.json()).isOffline : false;
        } catch {
            return false;
        }
    }

    // Ziel nach der Anmeldung: ohne Verein zur Vereinsauswahl (Altfluss), Konten ohne Verwaltungsrecht
    // (nur Helfer, Freischaltung ausstehend) zur Helfer-App, sonst zur Turnierübersicht. Ist der aktive
    // Verein ein reiner Helfer-Verein, gibt es aber einen verwaltbaren, wechselt menu.js dorthin.
    async function zielNachAnmeldung(user) {
        if (user.muss_passwort_aendern) return '/profil.html?passwortAendern=1';
        if (!user.verein_id) return '/verein_auswahl.html';
        try {
            const { menueFuerRolle, verwaltbareVereine } = await geteilt;
            const rechte = menueFuerRolle({
                rolle: user.verein_rolle, istSuperAdmin: user.ist_super_admin, einzelbenutzer: await istEinzelbenutzer()
            });
            if (!rechte.verwaltung && verwaltbareVereine(user.vereine).length === 0) return '/helfer.html';
        } catch (e) {
            console.error('Menü-Rechte nicht ladbar:', e);
        }
        return '/turniere.html';
    }

    async function handleAuthSuccess(data) {
        localStorage.setItem('dokume_token', data.token);
        localStorage.setItem('dokume_user', JSON.stringify(data.user));
        window.location.href = await zielNachAnmeldung(data.user);
    }

    // --- Verein mit Autovervollständigung (Registrierung) ---
    // Nur Vereine aus der Liste sind wählbar; das Feld ist optional.
    const vereinEingabe = document.getElementById('registerVerein');
    const vereinListe = document.getElementById('registerVereinListe');
    const vereinHinweis = document.getElementById('registerVereinHinweis');
    const VEREIN_HINWEIS = vereinHinweis.textContent;
    let vereineLaden = null;
    let vereinTreffer = [];
    let vereinAktiv = -1;
    let gewaehlterVerein = null;
    let suchNummer = 0;

    function ladeVereine() {
        if (!vereineLaden) {
            vereineLaden = fetch('/api/vereine').then(async (resp) => {
                if (!resp.ok) throw new Error('Die Vereinsliste konnte nicht geladen werden.');
                return resp.json();
            }).catch((e) => { vereineLaden = null; throw e; });
        }
        return vereineLaden;
    }

    function schliesseVereinListe() {
        vereinListe.hidden = true;
        vereinEingabe.setAttribute('aria-expanded', 'false');
        vereinEingabe.removeAttribute('aria-activedescendant');
        vereinAktiv = -1;
    }

    function markiereVerein(index) {
        vereinAktiv = index;
        [...vereinListe.children].forEach((option, i) => option.setAttribute('aria-selected', i === index ? 'true' : 'false'));
        if (index >= 0) {
            vereinEingabe.setAttribute('aria-activedescendant', vereinListe.children[index].id);
            vereinListe.children[index].scrollIntoView({ block: 'nearest' });
        }
    }

    function waehleVerein(verein) {
        gewaehlterVerein = verein;
        vereinEingabe.value = verein.name;
        vereinHinweis.textContent = VEREIN_HINWEIS;
        schliesseVereinListe();
    }

    async function zeigeVereinTreffer() {
        const nummer = ++suchNummer;
        gewaehlterVerein = null;
        vereinHinweis.textContent = VEREIN_HINWEIS;
        if (vereinEingabe.value.trim().length < 2) return schliesseVereinListe();
        let vereine;
        let filtereVereine;
        try {
            [vereine, { filtereVereine }] = await Promise.all([ladeVereine(), geteilt]);
        } catch (e) {
            if (nummer !== suchNummer) return;
            vereinHinweis.textContent = e.message;
            return schliesseVereinListe();
        }
        // Inzwischen weitergetippt: nur das Ergebnis der neuesten Eingabe zeichnen
        if (nummer !== suchNummer) return;
        vereinTreffer = filtereVereine(vereine, vereinEingabe.value).slice(0, 20);
        vereinListe.replaceChildren(...vereinTreffer.map((verein, i) => {
            const option = document.createElement('li');
            option.id = `registerVerein-${verein.id}`;
            option.setAttribute('role', 'option');
            option.setAttribute('aria-selected', 'false');
            option.textContent = verein.name;
            // Fokus bleibt im Feld, damit die Liste bis zum click offen bleibt
            option.addEventListener('mousedown', (e) => e.preventDefault());
            option.addEventListener('click', () => waehleVerein(vereinTreffer[i]));
            return option;
        }));
        if (vereinTreffer.length === 0) {
            vereinHinweis.textContent = 'Kein Verein gefunden.';
            return schliesseVereinListe();
        }
        vereinListe.hidden = false;
        vereinEingabe.setAttribute('aria-expanded', 'true');
        vereinAktiv = -1;
    }

    vereinEingabe.addEventListener('input', () => { zeigeVereinTreffer(); });
    vereinEingabe.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            if (vereinListe.hidden || vereinTreffer.length === 0) return;
            e.preventDefault();
            const schritt = e.key === 'ArrowDown' ? 1 : -1;
            markiereVerein((vereinAktiv + schritt + vereinTreffer.length) % vereinTreffer.length);
        } else if (e.key === 'Enter' && !vereinListe.hidden) {
            // Enter wählt nur aus der offenen Liste und schickt das Formular nicht ab
            e.preventDefault();
            if (vereinAktiv >= 0) waehleVerein(vereinTreffer[vereinAktiv]);
        } else if (e.key === 'Escape') {
            schliesseVereinListe();
        }
    });
    vereinEingabe.addEventListener('blur', () => setTimeout(() => {
        if (document.activeElement !== vereinEingabe) schliesseVereinListe();
    }, 200));

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        versteckeMeldungen();

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            if (response.status === 403 && data.code === 'email_unbestaetigt') {
                unbestaetigteEmail = email;
                zeigeInfo('Bitte bestätige zuerst deine E-Mail-Adresse.', true);
                return;
            }
            if (!response.ok) {
                throw new Error(data.error || 'Login fehlgeschlagen');
            }

            await handleAuthSuccess(data);
        } catch (err) {
            errDiv.textContent = err.message;
            errDiv.style.display = 'block';
        }
    });

    registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        versteckeMeldungen();

        const vorname = document.getElementById('registerVorname').value;
        const nachname = document.getElementById('registerNachname').value;
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;

        // Freitext ohne Auswahl aus der Liste wird nicht als Verein übernommen
        const vereinText = vereinEingabe.value.trim();
        if (vereinText && (!gewaehlterVerein || vereinEingabe.value !== gewaehlterVerein.name)) {
            errDiv.textContent = 'Bitte wähle einen Verein aus der Liste oder lass das Feld leer.';
            errDiv.style.display = 'block';
            vereinEingabe.focus();
            return;
        }

        const daten = { vorname, nachname, email, password, quelle: 'verwaltung' };
        if (vereinText) daten.vereinId = gewaehlterVerein.id;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(daten)
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Registrierung fehlgeschlagen');
            }

            // Das Konto ist erst nach der E-Mail-Bestätigung nutzbar (kein Token). Mit Verein entsteht danach
            // die Beitrittsanfrage, ohne Verein folgt der Beitritt über die Vereinsauswahl.
            unbestaetigteEmail = email;
            registerForm.reset();
            gewaehlterVerein = null;
            zeigeInfo('Wir haben dir eine E-Mail geschickt. Bitte bestätige deine Adresse über den Link.', true);
        } catch (err) {
            errDiv.textContent = err.message;
            errDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
