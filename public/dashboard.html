<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Live Dashboard</title>
    <link rel="stylesheet" href="/css/common.css">
    <!-- Schriften (lokal) & Material Icons (common.css) -->
    <link rel="stylesheet" href="/css/schriften.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 24px;
            box-sizing: border-box;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .dashboard-title-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .dashboard-title-area .material-icons {
            font-size: 36px;
            color: var(--primary);
        }

        .dashboard-title-area h1 {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dashboard-meta {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .refresh-badge {
            background-color: rgba(46, 125, 50, 0.1);
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .refresh-badge .dot {
            width: 8px;
            height: 8px;
            background-color: #2e7d32;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        /* Flex Row Layout for side-by-side mats */
        .mats-grid {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: stretch;
            gap: 24px;
            margin-bottom: 32px;
            width: 100%;
            box-sizing: border-box;
            overflow-x: auto;
        }

        .mat-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 20px;
            flex: 1;
            min-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .mat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.06);
        }

        .mat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .mat-name {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
        }

        /* Current Fight (Aktueller Kampf) */
        .current-fight-box {
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.05) 0%, rgba(30, 58, 138, 0.02) 100%);
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            position: relative;
        }

        .current-fight-box.active {
            border-style: solid;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.08) 0%, rgba(30, 58, 138, 0.03) 100%);
            box-shadow: 0 0 15px rgba(30, 58, 138, 0.1);
        }

        .current-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary);
            margin-bottom: 8px;
            display: inline-block;
            background-color: rgba(30, 58, 138, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .current-fight-class {
            font-size: 15px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }



        /* Next Fights */
        .next-fights-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .next-fight-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
        }

        .next-fight-nr {
            font-weight: 800;
            color: var(--primary);
            margin-right: 8px;
            background-color: rgba(30, 58, 138, 0.08);
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 10px;
        }

        .next-fight-details {
            flex: 1;
            font-weight: 600;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Pools & Progress */
        .pools-progress-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .pool-progress-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .pool-progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
        }

        .pool-progress-bar-wrapper {
            background-color: var(--border);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            width: 100%;
        }

        .pool-progress-bar {
            background-color: #007bff;
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease-out;
        }

        .pool-progress-bar.finished {
            background-color: #2e7d32;
        }

        .pool-progress-bar.active {
            background-color: #007bff;
        }

        .pool-progress-bar.waiting {
            background-color: var(--text-muted);
        }

        /* Next Pool Box */
        .next-pool-banner {
            background-color: rgba(255, 152, 0, 0.1);
            border: 1px solid #ff9800;
            color: #e65100;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Unassigned Pools Footer */
        .unassigned-section {
            background-color: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .unassigned-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .unassigned-badge {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .unassigned-badge .material-icons {
            font-size: 14px;
            color: var(--text-muted);
        }

        .empty-text {
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
        }
    </style>
</head>
<body>
<script src="/js/zurueckMenue.js"></script>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="dashboard-container">
    <div class="dashboard-header">
        <div class="dashboard-title-area">
            <span class="material-icons">dashboard</span>
            <h1>Live Dashboard</h1>
        </div>
        <div class="dashboard-meta">
            <div class="refresh-badge">
                <div class="dot"></div>
                Live-Anzeige
            </div>
        </div>
    </div>

    <!-- Wettkampfflächen Grid -->
    <div class="mats-grid" id="matsGrid">
        <!-- Dynamisch per JS befüllt -->
    </div>

    <!-- Warteschlange / Nicht zugeordnete Pools -->
    <div class="unassigned-section">
        <div class="section-title">Warteschlange (Nicht zugeordnete Pools)</div>
        <div class="unassigned-list" id="unassignedList">
            <!-- Dynamisch per JS befüllt -->
        </div>
    </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
