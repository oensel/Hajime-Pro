<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Mein Profil</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .mdc-card {
            max-width: 480px;
            padding: 36px;
        }
        .form-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .form-title-area h1 {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin: 0;
        }
        .form-title-area .material-icons {
            font-size: 28px;
            color: var(--primary);
        }
        .profil-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .profil-form-group label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profil-form-group input {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .profil-form-group input:focus {
            border-color: var(--primary);
        }
        .profil-section-title {
            margin: 28px 0 18px 0;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .verein-mitglied-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .verein-mitglied-row.aktiv {
            border-color: var(--primary);
        }
        .verein-mitglied-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        .verein-mitglied-status {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }
        .verein-mitglied-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .profil-card-row {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            width: 100%;
            max-width: 984px;
        }
        .profil-card-row > .mdc-card,
        .profil-card-row > .profil-card-col {
            flex: 1 1 480px;
            max-width: 480px;
            min-width: 0;
            margin-top: 0;
        }
        .profil-card-col {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        @media (max-width: 850px) {
            .profil-card-row {
                flex-direction: column;
            }
            .profil-card-row > .mdc-card,
            .profil-card-row > .profil-card-col {
                max-width: 100%;
            }
        }
    </style>
    <script src="/js/menu.js"></script>
    <script src="/js/profilZweiFaktor.js" defer></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="profil-card-row">
<div class="mdc-card">
    <div class="form-title-area">
        <span class="material-icons">account_circle</span>
        <h1>Mein Profil</h1>
    </div>

    <div id="passwortPflichtHinweis" role="alert" hidden style="margin: 0 0 14px; padding: 10px 12px; border: 1px solid #c62828; border-radius: 4px; color: #c62828; font-size: 13px; font-weight: 700;">Ihr Passwort wurde von einem Administrator vergeben. Bitte legen Sie jetzt ein eigenes Passwort fest (aktuelles Passwort = das vergebene).</div>
    <form id="profilForm">
        <div class="profil-form-group">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" required>
        </div>
        <div class="profil-form-group">
            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" required>
        </div>
        <div class="profil-form-group">
            <label for="email">E-Mail-Adresse</label>
            <input type="email" id="email" required>
        </div>

        <div class="profil-section-title">Passwort ändern (optional)</div>
        <div class="profil-form-group">
            <label for="newPassword">Neues Passwort</label>
            <input type="password" id="newPassword" placeholder="Leer lassen, um unverändert zu bleiben" minlength="8">
        </div>
        <div class="profil-form-group">
            <label for="newPasswordConfirm">Neues Passwort bestätigen</label>
            <input type="password" id="newPasswordConfirm" minlength="8">
        </div>

        <div class="profil-section-title">Bestätigung</div>
        <div class="profil-form-group">
            <label for="currentPassword">Aktuelles Passwort</label>
            <input type="password" id="currentPassword" required placeholder="Zur Bestätigung erforderlich">
        </div>

        <button type="submit" class="btn btn-raised" style="width: 100%; margin-top: 10px;">Speichern</button>
    </form>
</div>

<div class="profil-card-col">
<div class="mdc-card">
    <div class="form-title-area">
        <span class="material-icons">groups</span>
        <h1>Meine Vereine</h1>
    </div>

    <div id="meineVereineListe" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;"></div>

    <a href="/verein_auswahl.html" class="btn btn-outlined" style="width: 100%; box-sizing: border-box; text-align: center; display: block; text-decoration: none;">Weiterem Verein beitreten</a>
</div>

<div class="mdc-card" id="avVertragKarte" hidden style="margin-top: 16px;"></div>

<div class="mdc-card" id="zweiFaktorKarte" hidden style="margin-top: 16px;"></div>

</div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const vornameInput = document.getElementById('vorname');
        const nachnameInput = document.getElementById('nachname');
        const emailInput = document.getElementById('email');
        let passwortPflicht = false;

        try {
            const resp = await fetch('/api/auth/me');
            if (resp.ok) {
                const data = await resp.json();
                vornameInput.value = data.user.vorname || '';
                nachnameInput.value = data.user.nachname || '';
                emailInput.value = data.user.email || '';
                // Initialpasswort: neues Passwort ist Pflicht, bis es geändert ist
                if (data.user.muss_passwort_aendern || new URLSearchParams(window.location.search).get('passwortAendern') === '1') {
                    passwortPflicht = !!data.user.muss_passwort_aendern;
                    document.getElementById('passwortPflichtHinweis').hidden = !passwortPflicht;
                    if (passwortPflicht) document.getElementById('currentPassword').focus();
                }
            }
        } catch (err) {
            console.error('Fehler beim Laden des Profils:', err);
        }

        document.getElementById('profilForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;

            if (passwortPflicht && !newPassword) {
                const msg = 'Bitte legen Sie ein neues Passwort fest.';
                window.zeigeNotification ? window.zeigeNotification(msg, 'error') : alert(msg);
                return;
            }
            if (newPassword && newPassword !== newPasswordConfirm) {
                const msg = 'Die neuen Passwörter stimmen nicht überein.';
                window.zeigeNotification ? window.zeigeNotification(msg, 'error') : alert(msg);
                return;
            }

            const payload = {
                vorname: vornameInput.value.trim(),
                nachname: nachnameInput.value.trim(),
                email: emailInput.value.trim(),
                currentPassword: document.getElementById('currentPassword').value
            };
            if (newPassword) {
                payload.newPassword = newPassword;
            }

            try {
                const response = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Speichern fehlgeschlagen.');
                }

                localStorage.setItem('dokume_token', data.token);
                if (passwortPflicht && !data.user.muss_passwort_aendern) {
                    passwortPflicht = false;
                    document.getElementById('passwortPflichtHinweis').hidden = true;
                }
                localStorage.setItem('dokume_user', JSON.stringify(data.user));

                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('newPasswordConfirm').value = '';

                if (window.zeigeNotification) {
                    window.zeigeNotification('Profil erfolgreich aktualisiert.', 'success');
                } else {
                    alert('Profil erfolgreich aktualisiert.');
                }
            } catch (err) {
                if (window.zeigeNotification) {
                    window.zeigeNotification(err.message, 'error');
                } else {
                    alert(err.message);
                }
            }
        });

        // --- MEINE VEREINE ---
        // Alle Namen/Adressen stammen von anderen Konten: nur per textContent/createElement einsetzen.
        const meineVereineListe = document.getElementById('meineVereineListe');
        let aktuellerNutzer = null;
        let einzelbenutzer = false;
        const { ROLLEN_TEXT } = await import('/js/shared/menueRechte.js');
        const { rolleReicht } = await import('/js/shared/rollen.js');

        try {
            const [meResp, configResp] = await Promise.all([fetch('/api/auth/me'), fetch('/api/config')]);
            if (meResp.ok) aktuellerNutzer = (await meResp.json()).user;
            if (configResp.ok) einzelbenutzer = !!(await configResp.json()).isOffline;
        } catch (err) {
            console.error('Fehler beim Laden des Vereinsstatus:', err);
        }

        const meldeFehler = (text) => window.zeigeNotification ? window.zeigeNotification(text, 'error') : alert(text);
        const meldeErfolg = (text) => { if (window.zeigeNotification) window.zeigeNotification(text); };

        function el(tag, eigenschaften = {}, ...kinder) {
            const e = document.createElement(tag);
            for (const [k, v] of Object.entries(eigenschaften)) {
                if (k === 'text') e.textContent = v;
                else if (k === 'class') e.className = v;
                else if (k === 'style') e.style.cssText = v;
                else e.setAttribute(k, v);
            }
            e.append(...kinder);
            return e;
        }

        const kleinerKnopf = (text, klasse, zusatzStil = '') =>
            el('button', { type: 'button', class: `btn ${klasse}`, text, style: `padding: 6px 12px; font-size: 11px;${zusatzStil}` });

        async function sendePost(url, daten) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(daten)
            });
            const antwort = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(antwort.error || 'Aktion fehlgeschlagen');
            return antwort;
        }

        // Im Einzelbenutzerbetrieb (Hallen-Server) gibt es keine Rollen: Anzeige wie vor der Helferverwaltung.
        function statusText(v) {
            if (!v.freigegeben) return 'Freigabe ausstehend';
            if (einzelbenutzer) return 'Freigegeben';
            return v.rolle ? `Freigegeben als ${ROLLEN_TEXT[v.rolle] || v.rolle}` : 'Freigegeben';
        }

        // Als aktiven Verein der Verwaltung lassen sich nur Vereine setzen, in denen das Konto Benutzer oder
        // Admin ist (Spec 3.3); im Einzelbenutzerbetrieb und für Super-Admins wie bisher alle.
        const darfAktivSetzen = (v) => einzelbenutzer || !!(aktuellerNutzer && aktuellerNutzer.ist_super_admin) ||
            (v.freigegeben && rolleReicht(v.rolle, 'benutzer'));

        function renderMeineVereine() {
            if (!aktuellerNutzer || !Array.isArray(aktuellerNutzer.vereine) || aktuellerNutzer.vereine.length === 0) {
                meineVereineListe.replaceChildren(el('p', {
                    style: 'font-size: 13px; color: var(--text-muted); text-align: center;',
                    text: 'Sie sind aktuell keinem Verein zugeordnet.'
                }));
                return;
            }

            meineVereineListe.replaceChildren(...aktuellerNutzer.vereine.map(v => {
                const istAktiv = v.verein_id === aktuellerNutzer.verein_id;
                const aktionen = el('div', { class: 'verein-mitglied-actions' });

                if (!istAktiv && darfAktivSetzen(v)) {
                    const aktivKnopf = kleinerKnopf('Als aktiv setzen', 'btn-outlined');
                    aktivKnopf.dataset.action = 'aktivieren';
                    aktivKnopf.addEventListener('click', async () => {
                        try {
                            await sendePost('/api/vereine/aktiv', { vereinId: v.verein_id });
                            if (window.hajimeNachRollenwechsel) window.hajimeNachRollenwechsel(v);
                            else window.location.reload();
                        } catch (err) {
                            meldeFehler(err.message);
                        }
                    });
                    aktionen.append(aktivKnopf);
                }

                // Abrechnungsdaten für Startgeld-Rechnungen: nur in der Cloud, für Admins des Vereins (Super-Admin im Modus: alle)
                const istAdminHier = v.freigegeben && v.rolle === 'admin';
                if (!einzelbenutzer && (istAdminHier || (aktuellerNutzer && aktuellerNutzer.super_admin_aktiv))) {
                    const abrechnungLink = el('a', {
                        class: 'btn btn-outlined', text: 'Abrechnungsdaten',
                        href: `/zahlungsdaten.html?vereinId=${encodeURIComponent(v.verein_id)}`,
                        style: 'padding: 6px 12px; font-size: 11px; text-decoration: none;'
                    });
                    abrechnungLink.dataset.action = 'abrechnungsdaten';
                    aktionen.append(abrechnungLink);
                }

                const verlassenKnopf = kleinerKnopf('Verlassen', 'btn-outlined', ' color: #ef4444; border-color: #ef4444;');
                verlassenKnopf.dataset.action = 'verlassen';
                verlassenKnopf.addEventListener('click', async () => {
                    const bestaetigt = await window.zeigeZentraleBestaetigung(
                        `Möchten Sie "${v.name}" wirklich verlassen?`,
                        'Verein verlassen',
                        'warning'
                    );
                    if (!bestaetigt) return;
                    try {
                        const data = await sendePost('/api/vereine/leave', { vereinId: v.verein_id });
                        let meldung = `"${v.name}" verlassen.`;
                        if (data.verein_geloescht) {
                            meldung += ' Der Verein wurde gelöscht, da er keine Mitglieder mehr hatte.';
                        }
                        meldeErfolg(meldung);
                        setTimeout(() => window.location.reload(), 1200);
                    } catch (err) {
                        meldeFehler(err.message || 'Verein konnte nicht verlassen werden.');
                    }
                });
                aktionen.append(verlassenKnopf);

                return el('div', { class: `verein-mitglied-row${istAktiv ? ' aktiv' : ''}`, 'data-verein-id': String(v.verein_id) },
                    el('div', {},
                        el('div', { class: 'verein-mitglied-name', text: `${v.name}${istAktiv ? ' (aktiv)' : ''}` }),
                        el('div', { class: 'verein-mitglied-status', text: statusText(v) })),
                    aktionen);
            }));
        }

        renderMeineVereine();

    });
</script>
</body>
</html>
