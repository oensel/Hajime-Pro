<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Mein Profil</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .mdc-card {
            max-width: 480px;
            padding: 36px;
        }
        .form-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .form-title-area h1 {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin: 0;
        }
        .form-title-area .material-icons {
            font-size: 28px;
            color: var(--primary);
        }
        .profil-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .profil-form-group label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profil-form-group input {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .profil-form-group input:focus {
            border-color: var(--primary);
        }
        .profil-section-title {
            margin: 28px 0 18px 0;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .verein-mitglied-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .verein-mitglied-row.aktiv {
            border-color: var(--primary);
        }
        .verein-mitglied-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        .verein-mitglied-status {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }
        .verein-mitglied-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .erstregistrierung-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .erstregistrierung-row:last-child {
            border-bottom: none;
        }
        .erstregistrierung-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        .erstregistrierung-meta {
            font-size: 12px;
            color: var(--text-muted);
        }
        .erstregistrierung-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
    </style>
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card">
    <div class="form-title-area">
        <span class="material-icons">account_circle</span>
        <h1>Mein Profil</h1>
    </div>

    <form id="profilForm">
        <div class="profil-form-group">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" required>
        </div>
        <div class="profil-form-group">
            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" required>
        </div>
        <div class="profil-form-group">
            <label for="email">E-Mail-Adresse</label>
            <input type="email" id="email" required>
        </div>

        <div class="profil-section-title">Passwort ändern (optional)</div>
        <div class="profil-form-group">
            <label for="newPassword">Neues Passwort</label>
            <input type="password" id="newPassword" placeholder="Leer lassen, um unverändert zu bleiben" minlength="6">
        </div>
        <div class="profil-form-group">
            <label for="newPasswordConfirm">Neues Passwort bestätigen</label>
            <input type="password" id="newPasswordConfirm" minlength="6">
        </div>

        <div class="profil-section-title">Bestätigung</div>
        <div class="profil-form-group">
            <label for="currentPassword">Aktuelles Passwort</label>
            <input type="password" id="currentPassword" required placeholder="Zur Bestätigung erforderlich">
        </div>

        <button type="submit" class="btn btn-raised" style="width: 100%; margin-top: 10px;">Speichern</button>
    </form>
</div>

<div class="mdc-card" style="margin-top: 24px;">
    <div class="form-title-area">
        <span class="material-icons">groups</span>
        <h1>Meine Vereine</h1>
    </div>

    <div id="meineVereineListe" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;"></div>

    <a href="/verein_auswahl.html" class="btn btn-outlined" style="width: 100%; box-sizing: border-box; text-align: center; display: block; text-decoration: none;">Weiterem Verein beitreten</a>
</div>

<div class="mdc-card" id="superAdminCard" style="margin-top: 24px; display: none;">
    <div class="form-title-area">
        <span class="material-icons">verified_user</span>
        <h1>Erstregistrierungen prüfen</h1>
    </div>
    <div id="erstregistrierungenListe" style="display: flex; flex-direction: column;"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const vornameInput = document.getElementById('vorname');
        const nachnameInput = document.getElementById('nachname');
        const emailInput = document.getElementById('email');

        try {
            const resp = await fetch('/api/auth/me');
            if (resp.ok) {
                const data = await resp.json();
                vornameInput.value = data.user.vorname || '';
                nachnameInput.value = data.user.nachname || '';
                emailInput.value = data.user.email || '';
            }
        } catch (err) {
            console.error('Fehler beim Laden des Profils:', err);
        }

        document.getElementById('profilForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;

            if (newPassword && newPassword !== newPasswordConfirm) {
                const msg = 'Die neuen Passwörter stimmen nicht überein.';
                window.zeigeNotification ? window.zeigeNotification(msg, 'error') : alert(msg);
                return;
            }

            const payload = {
                vorname: vornameInput.value.trim(),
                nachname: nachnameInput.value.trim(),
                email: emailInput.value.trim(),
                currentPassword: document.getElementById('currentPassword').value
            };
            if (newPassword) {
                payload.newPassword = newPassword;
            }

            try {
                const response = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Speichern fehlgeschlagen.');
                }

                localStorage.setItem('dokume_token', data.token);
                localStorage.setItem('dokume_user', JSON.stringify(data.user));

                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('newPasswordConfirm').value = '';

                if (window.zeigeNotification) {
                    window.zeigeNotification('Profil erfolgreich aktualisiert.', 'success');
                } else {
                    alert('Profil erfolgreich aktualisiert.');
                }
            } catch (err) {
                if (window.zeigeNotification) {
                    window.zeigeNotification(err.message, 'error');
                } else {
                    alert(err.message);
                }
            }
        });

        // --- MEINE VEREINE ---
        const meineVereineListe = document.getElementById('meineVereineListe');
        let aktuellerNutzer = null;

        try {
            const meResp = await fetch('/api/auth/me');
            if (meResp.ok) {
                aktuellerNutzer = (await meResp.json()).user;
            }
        } catch (err) {
            console.error('Fehler beim Laden des Vereinsstatus:', err);
        }

        function renderMeineVereine() {
            if (!aktuellerNutzer || !Array.isArray(aktuellerNutzer.vereine) || aktuellerNutzer.vereine.length === 0) {
                meineVereineListe.innerHTML = '<p style="font-size: 13px; color: var(--text-muted); text-align: center;">Sie sind aktuell keinem Verein zugeordnet.</p>';
                return;
            }

            meineVereineListe.innerHTML = aktuellerNutzer.vereine.map(v => {
                const istAktiv = v.verein_id === aktuellerNutzer.verein_id;
                return `
                    <div class="verein-mitglied-row${istAktiv ? ' aktiv' : ''}">
                        <div>
                            <div class="verein-mitglied-name">${v.name}${istAktiv ? ' (aktiv)' : ''}</div>
                            <div class="verein-mitglied-status">${v.freigegeben ? 'Freigegeben' : 'Freigabe ausstehend'}</div>
                        </div>
                        <div class="verein-mitglied-actions">
                            ${istAktiv ? '' : `<button type="button" class="btn btn-outlined" data-action="aktivieren" data-verein-id="${v.verein_id}" style="padding: 6px 12px; font-size: 11px;">Als aktiv setzen</button>`}
                            <button type="button" class="btn btn-outlined" data-action="verlassen" data-verein-id="${v.verein_id}" data-verein-name="${v.name}" style="padding: 6px 12px; font-size: 11px; color: #ef4444; border-color: #ef4444;">Verlassen</button>
                        </div>
                    </div>
                `;
            }).join('');

            meineVereineListe.querySelectorAll('button[data-action="aktivieren"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    try {
                        const response = await fetch('/api/vereine/aktiv', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ vereinId: btn.getAttribute('data-verein-id') })
                        });
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error || 'Vereinswechsel fehlgeschlagen.');
                        window.location.reload();
                    } catch (err) {
                        window.zeigeNotification ? window.zeigeNotification(err.message, 'error') : alert(err.message);
                    }
                });
            });

            meineVereineListe.querySelectorAll('button[data-action="verlassen"]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const vereinName = btn.getAttribute('data-verein-name');
                    const bestaetigt = await window.zeigeZentraleBestaetigung(
                        `Möchten Sie "${vereinName}" wirklich verlassen?`,
                        'Verein verlassen',
                        'warning'
                    );
                    if (!bestaetigt) return;

                    try {
                        const response = await fetch('/api/vereine/leave', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ vereinId: btn.getAttribute('data-verein-id') })
                        });
                        const data = await response.json();
                        if (!response.ok) throw new Error(data.error || 'Verein konnte nicht verlassen werden.');

                        let meldung = `"${vereinName}" verlassen.`;
                        if (data.verein_geloescht) {
                            meldung += ' Der Verein wurde gelöscht, da er keine Mitglieder mehr hatte.';
                        }
                        if (window.zeigeNotification) window.zeigeNotification(meldung, 'success');
                        setTimeout(() => window.location.reload(), 1200);
                    } catch (err) {
                        window.zeigeNotification ? window.zeigeNotification(err.message, 'error') : alert(err.message);
                    }
                });
            });
        }

        renderMeineVereine();

        // --- SUPER-ADMIN: ERSTREGISTRIERUNGEN ---
        if (aktuellerNutzer && aktuellerNutzer.ist_super_admin) {
            document.getElementById('superAdminCard').style.display = 'block';
            ladeUndRendereErstregistrierungen();
        }

        async function ladeUndRendereErstregistrierungen() {
            const liste = document.getElementById('erstregistrierungenListe');
            try {
                const resp = await fetch('/api/vereine/super/pending');
                if (!resp.ok) return;
                const pending = await resp.json();

                if (!Array.isArray(pending) || pending.length === 0) {
                    liste.innerHTML = '<p style="font-size: 13px; color: var(--text-muted); text-align: center;">Keine offenen Erstregistrierungen.</p>';
                    return;
                }

                liste.innerHTML = pending.map(p => `
                    <div class="erstregistrierung-row">
                        <div>
                            <div class="erstregistrierung-name">${p.vorname} ${p.nachname}</div>
                            <div class="erstregistrierung-meta">${p.email} &middot; ${p.verein_name}</div>
                        </div>
                        <div class="erstregistrierung-actions">
                            <button type="button" class="btn btn-raised" data-action="super/approve" data-user-id="${p.id}" data-verein-id="${p.verein_id}" style="padding: 6px 12px; font-size: 11px;">Freigeben</button>
                            <button type="button" class="btn btn-outlined" data-action="super/reject" data-user-id="${p.id}" data-verein-id="${p.verein_id}" style="padding: 6px 12px; font-size: 11px;">Ablehnen</button>
                        </div>
                    </div>
                `).join('');

                liste.querySelectorAll('button[data-action]').forEach(btn => {
                    btn.addEventListener('click', async () => {
                        const userId = btn.getAttribute('data-user-id');
                        const vereinId = btn.getAttribute('data-verein-id');
                        const action = btn.getAttribute('data-action');
                        try {
                            const response = await fetch(`/api/vereine/${action}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ userId, vereinId })
                            });
                            const data = await response.json();
                            if (!response.ok) throw new Error(data.error || 'Aktion fehlgeschlagen');
                            if (window.zeigeNotification) {
                                window.zeigeNotification(action === 'super/approve' ? 'Erstregistrierung freigegeben.' : 'Anfrage abgelehnt.');
                            }
                            ladeUndRendereErstregistrierungen();
                            if (window.hajimeAktualisiereGenehmigungsHinweis) window.hajimeAktualisiereGenehmigungsHinweis();
                        } catch (err) {
                            window.zeigeNotification ? window.zeigeNotification(err.message, 'error') : alert(err.message);
                        }
                    });
                });
            } catch (err) {
                console.error('Fehler beim Laden der Erstregistrierungen:', err);
            }
        }
    });
</script>
</body>
</html>
