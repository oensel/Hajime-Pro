<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Mein Profil</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .mdc-card {
            max-width: 480px;
            padding: 36px;
        }
        .form-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .form-title-area h1 {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin: 0;
        }
        .form-title-area .material-icons {
            font-size: 28px;
            color: var(--primary);
        }
        .profil-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .profil-form-group label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profil-form-group input {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .profil-form-group input:focus {
            border-color: var(--primary);
        }
        .profil-section-title {
            margin: 28px 0 18px 0;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
    </style>
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card">
    <div class="form-title-area">
        <span class="material-icons">account_circle</span>
        <h1>Mein Profil</h1>
    </div>

    <form id="profilForm">
        <div class="profil-form-group">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" required>
        </div>
        <div class="profil-form-group">
            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" required>
        </div>
        <div class="profil-form-group">
            <label for="email">E-Mail-Adresse</label>
            <input type="email" id="email" required>
        </div>

        <div class="profil-section-title">Passwort ändern (optional)</div>
        <div class="profil-form-group">
            <label for="newPassword">Neues Passwort</label>
            <input type="password" id="newPassword" placeholder="Leer lassen, um unverändert zu bleiben" minlength="6">
        </div>
        <div class="profil-form-group">
            <label for="newPasswordConfirm">Neues Passwort bestätigen</label>
            <input type="password" id="newPasswordConfirm" minlength="6">
        </div>

        <div class="profil-section-title">Bestätigung</div>
        <div class="profil-form-group">
            <label for="currentPassword">Aktuelles Passwort</label>
            <input type="password" id="currentPassword" required placeholder="Zur Bestätigung erforderlich">
        </div>

        <button type="submit" class="btn btn-raised" style="width: 100%; margin-top: 10px;">Speichern</button>
    </form>
</div>

<div class="mdc-card" style="margin-top: 24px;">
    <div class="form-title-area">
        <span class="material-icons">groups</span>
        <h1>Verein</h1>
    </div>

    <div id="vereinStatusInfo" style="margin-bottom: 20px; font-size: 13px; color: var(--text-muted); text-align: center;"></div>

    <form id="vereinForm">
        <div class="profil-form-group">
            <label for="vereinSelect">Bestehenden Verein wählen</label>
            <select id="vereinSelect">
                <option value="">-- Bitte wählen --</option>
            </select>
        </div>

        <div class="profil-section-title">oder neuen Verein anlegen</div>
        <div class="profil-form-group">
            <label for="newVereinName">Neuer Vereinsname</label>
            <input type="text" id="newVereinName" placeholder="z.B. Judo Club Musterstadt">
        </div>

        <button type="submit" class="btn btn-raised" style="width: 100%; margin-top: 10px;">Verein wechseln</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const vornameInput = document.getElementById('vorname');
        const nachnameInput = document.getElementById('nachname');
        const emailInput = document.getElementById('email');

        try {
            const resp = await fetch('/api/auth/me');
            if (resp.ok) {
                const data = await resp.json();
                vornameInput.value = data.user.vorname || '';
                nachnameInput.value = data.user.nachname || '';
                emailInput.value = data.user.email || '';
            }
        } catch (err) {
            console.error('Fehler beim Laden des Profils:', err);
        }

        document.getElementById('profilForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;

            if (newPassword && newPassword !== newPasswordConfirm) {
                const msg = 'Die neuen Passwörter stimmen nicht überein.';
                window.zeigeNotification ? window.zeigeNotification(msg, 'error') : alert(msg);
                return;
            }

            const payload = {
                vorname: vornameInput.value.trim(),
                nachname: nachnameInput.value.trim(),
                email: emailInput.value.trim(),
                currentPassword: document.getElementById('currentPassword').value
            };
            if (newPassword) {
                payload.newPassword = newPassword;
            }

            try {
                const response = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Speichern fehlgeschlagen.');
                }

                localStorage.setItem('dokume_token', data.token);
                localStorage.setItem('dokume_user', JSON.stringify(data.user));

                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('newPasswordConfirm').value = '';

                if (window.zeigeNotification) {
                    window.zeigeNotification('Profil erfolgreich aktualisiert.', 'success');
                } else {
                    alert('Profil erfolgreich aktualisiert.');
                }
            } catch (err) {
                if (window.zeigeNotification) {
                    window.zeigeNotification(err.message, 'error');
                } else {
                    alert(err.message);
                }
            }
        });

        // --- VEREIN WECHSELN ---
        const vereinSelect = document.getElementById('vereinSelect');
        const vereinStatusInfo = document.getElementById('vereinStatusInfo');
        let aktuellerNutzer = null;

        try {
            const meResp = await fetch('/api/auth/me');
            if (meResp.ok) {
                aktuellerNutzer = (await meResp.json()).user;
            }
        } catch (err) {
            console.error('Fehler beim Laden des Vereinsstatus:', err);
        }

        if (aktuellerNutzer) {
            vereinStatusInfo.textContent = aktuellerNutzer.verein_id
                ? `Aktueller Verein: ${aktuellerNutzer.verein_name || '–'} (${aktuellerNutzer.verein_freigegeben ? 'freigegeben' : 'Freigabe ausstehend'})`
                : 'Sie sind aktuell keinem Verein zugeordnet.';
        }

        try {
            const listResp = await fetch('/api/vereine');
            const vereine = await listResp.json();
            vereine.forEach(v => {
                const option = document.createElement('option');
                option.value = v.id;
                option.textContent = v.name;
                if (aktuellerNutzer && aktuellerNutzer.verein_id === v.id) option.selected = true;
                vereinSelect.appendChild(option);
            });
        } catch (err) {
            console.error('Fehler beim Laden der Vereine:', err);
        }

        document.getElementById('vereinForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const selectedId = vereinSelect.value;
            const newName = document.getElementById('newVereinName').value.trim();

            if (!selectedId && !newName) {
                const msg = 'Bitte wählen Sie einen Verein oder geben Sie einen neuen Namen ein.';
                window.zeigeNotification ? window.zeigeNotification(msg, 'error') : alert(msg);
                return;
            }

            const zielVereinId = newName ? null : parseInt(selectedId, 10);
            const wechseltTatsaechlich = !!newName || !aktuellerNutzer || aktuellerNutzer.verein_id !== zielVereinId;

            if (wechseltTatsaechlich && aktuellerNutzer && aktuellerNutzer.verein_id && aktuellerNutzer.verein_mitglieder_anzahl <= 1) {
                const bestaetigt = await window.zeigeZentraleBestaetigung(
                    `Sie sind aktuell das einzige Mitglied von "${aktuellerNutzer.verein_name}". Wenn Sie fortfahren, wird dieser Verein unwiderruflich gelöscht. Fortfahren?`,
                    'Verein wechseln',
                    'warning'
                );
                if (!bestaetigt) return;
            }

            try {
                const body = newName ? { newVereinName: newName } : { vereinId: selectedId };
                const response = await fetch('/api/vereine/join', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Vereinswechsel fehlgeschlagen.');
                }

                const meResp2 = await fetch('/api/auth/me');
                if (meResp2.ok) {
                    const freshUser = (await meResp2.json()).user;
                    localStorage.setItem('dokume_user', JSON.stringify(freshUser));
                }

                let meldung = data.verein_freigegeben
                    ? 'Verein erfolgreich gewechselt und freigegeben.'
                    : 'Beitrittsanfrage gesendet, wartet auf Freigabe durch ein bestehendes Mitglied.';
                if (data.alter_verein_geloescht) {
                    meldung += ' Der bisherige Verein wurde gelöscht, da er keine Mitglieder mehr hatte.';
                }

                if (window.zeigeNotification) {
                    window.zeigeNotification(meldung, 'success');
                } else {
                    alert(meldung);
                }

                setTimeout(() => window.location.reload(), 1500);
            } catch (err) {
                if (window.zeigeNotification) {
                    window.zeigeNotification(err.message, 'error');
                } else {
                    alert(err.message);
                }
            }
        });
    });
</script>
</body>
</html>
