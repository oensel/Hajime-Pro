<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Mein Profil</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        .mdc-card {
            max-width: 480px;
            padding: 36px;
        }
        .form-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .form-title-area h1 {
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--primary);
            margin: 0;
        }
        .form-title-area .material-icons {
            font-size: 28px;
            color: var(--primary);
        }
        .profil-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .profil-form-group label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profil-form-group input {
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .profil-form-group input:focus {
            border-color: var(--primary);
        }
        .profil-section-title {
            margin: 28px 0 18px 0;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }
        .verein-mitglied-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .verein-mitglied-row.aktiv {
            border-color: var(--primary);
        }
        .verein-mitglied-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        .verein-mitglied-status {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
        }
        .verein-mitglied-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .erstregistrierung-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .erstregistrierung-row:last-child {
            border-bottom: none;
        }
        .erstregistrierung-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
        }
        .erstregistrierung-meta {
            font-size: 12px;
            color: var(--text-muted);
        }
        .erstregistrierung-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .profil-card-row {
            display: flex;
            align-items: flex-start;
            gap: 24px;
            width: 100%;
            max-width: 984px;
        }
        .profil-card-row > .mdc-card,
        .profil-card-row > .profil-card-col {
            flex: 1 1 480px;
            max-width: 480px;
            min-width: 0;
            margin-top: 0;
        }
        .profil-card-col {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .rollen-auswahl {
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 12px;
        }
        #mitgliederCard {
            max-width: 984px;
            width: 100%;
            box-sizing: border-box;
        }
        .mitglieder-verein {
            margin: 0 0 8px 0;
            font-size: 14px;
            font-weight: 800;
            color: var(--text-main);
        }
        .mitglieder-scroll {
            overflow-x: auto;
            margin-bottom: 24px;
        }
        .mitglieder-tabelle {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .mitglieder-tabelle th,
        .mitglieder-tabelle td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }
        .mitglieder-tabelle th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
        }
        @media (max-width: 850px) {
            .profil-card-row {
                flex-direction: column;
            }
            .profil-card-row > .mdc-card,
            .profil-card-row > .profil-card-col {
                max-width: 100%;
            }
        }
    </style>
    <script src="/js/menu.js"></script>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="profil-card-row">
<div class="mdc-card">
    <div class="form-title-area">
        <span class="material-icons">account_circle</span>
        <h1>Mein Profil</h1>
    </div>

    <form id="profilForm">
        <div class="profil-form-group">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" required>
        </div>
        <div class="profil-form-group">
            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" required>
        </div>
        <div class="profil-form-group">
            <label for="email">E-Mail-Adresse</label>
            <input type="email" id="email" required>
        </div>

        <div class="profil-section-title">Passwort ändern (optional)</div>
        <div class="profil-form-group">
            <label for="newPassword">Neues Passwort</label>
            <input type="password" id="newPassword" placeholder="Leer lassen, um unverändert zu bleiben" minlength="8">
        </div>
        <div class="profil-form-group">
            <label for="newPasswordConfirm">Neues Passwort bestätigen</label>
            <input type="password" id="newPasswordConfirm" minlength="8">
        </div>

        <div class="profil-section-title">Bestätigung</div>
        <div class="profil-form-group">
            <label for="currentPassword">Aktuelles Passwort</label>
            <input type="password" id="currentPassword" required placeholder="Zur Bestätigung erforderlich">
        </div>

        <button type="submit" class="btn btn-raised" style="width: 100%; margin-top: 10px;">Speichern</button>
    </form>
</div>

<div class="profil-card-col">
<div class="mdc-card">
    <div class="form-title-area">
        <span class="material-icons">groups</span>
        <h1>Meine Vereine</h1>
    </div>

    <div id="meineVereineListe" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;"></div>

    <a href="/verein_auswahl.html" class="btn btn-outlined" style="width: 100%; box-sizing: border-box; text-align: center; display: block; text-decoration: none;">Weiterem Verein beitreten</a>
</div>

<div class="mdc-card" id="beitrittsanfragenCard" style="display: none;">
    <div class="form-title-area">
        <span class="material-icons">how_to_reg</span>
        <h1>Beitrittsanfragen</h1>
    </div>
    <div id="beitrittsanfragenListe" style="display: flex; flex-direction: column;"></div>
</div>
</div>
</div>

<div class="mdc-card" id="superAdminCard" style="margin-top: 24px; display: none;">
    <div class="form-title-area">
        <span class="material-icons">verified_user</span>
        <h1>Erstregistrierungen prüfen</h1>
    </div>
    <div id="erstregistrierungenListe" style="display: flex; flex-direction: column;"></div>
</div>

<div class="mdc-card" id="mitgliederCard" style="margin-top: 24px; display: none;">
    <div class="form-title-area">
        <span class="material-icons">manage_accounts</span>
        <h1>Mitglieder verwalten</h1>
    </div>
    <div id="mitgliederBereich"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const vornameInput = document.getElementById('vorname');
        const nachnameInput = document.getElementById('nachname');
        const emailInput = document.getElementById('email');

        try {
            const resp = await fetch('/api/auth/me');
            if (resp.ok) {
                const data = await resp.json();
                vornameInput.value = data.user.vorname || '';
                nachnameInput.value = data.user.nachname || '';
                emailInput.value = data.user.email || '';
            }
        } catch (err) {
            console.error('Fehler beim Laden des Profils:', err);
        }

        document.getElementById('profilForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;

            if (newPassword && newPassword !== newPasswordConfirm) {
                const msg = 'Die neuen Passwörter stimmen nicht überein.';
                window.zeigeNotification ? window.zeigeNotification(msg, 'error') : alert(msg);
                return;
            }

            const payload = {
                vorname: vornameInput.value.trim(),
                nachname: nachnameInput.value.trim(),
                email: emailInput.value.trim(),
                currentPassword: document.getElementById('currentPassword').value
            };
            if (newPassword) {
                payload.newPassword = newPassword;
            }

            try {
                const response = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Speichern fehlgeschlagen.');
                }

                localStorage.setItem('dokume_token', data.token);
                localStorage.setItem('dokume_user', JSON.stringify(data.user));

                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('newPasswordConfirm').value = '';

                if (window.zeigeNotification) {
                    window.zeigeNotification('Profil erfolgreich aktualisiert.', 'success');
                } else {
                    alert('Profil erfolgreich aktualisiert.');
                }
            } catch (err) {
                if (window.zeigeNotification) {
                    window.zeigeNotification(err.message, 'error');
                } else {
                    alert(err.message);
                }
            }
        });

        // --- MEINE VEREINE ---
        // Alle Namen/Adressen stammen von anderen Konten: nur per textContent/createElement einsetzen.
        const meineVereineListe = document.getElementById('meineVereineListe');
        let aktuellerNutzer = null;
        let einzelbenutzer = false;
        const { ROLLEN_TEXT, vorbelegteFreigabeRolle } = await import('/js/shared/menueRechte.js');
        const { rolleReicht } = await import('/js/shared/rollen.js');

        try {
            const [meResp, configResp] = await Promise.all([fetch('/api/auth/me'), fetch('/api/config')]);
            if (meResp.ok) aktuellerNutzer = (await meResp.json()).user;
            if (configResp.ok) einzelbenutzer = !!(await configResp.json()).isOffline;
        } catch (err) {
            console.error('Fehler beim Laden des Vereinsstatus:', err);
        }

        const meldeFehler = (text) => window.zeigeNotification ? window.zeigeNotification(text, 'error') : alert(text);
        const meldeErfolg = (text) => { if (window.zeigeNotification) window.zeigeNotification(text); };

        function el(tag, eigenschaften = {}, ...kinder) {
            const e = document.createElement(tag);
            for (const [k, v] of Object.entries(eigenschaften)) {
                if (k === 'text') e.textContent = v;
                else if (k === 'class') e.className = v;
                else if (k === 'style') e.style.cssText = v;
                else e.setAttribute(k, v);
            }
            e.append(...kinder);
            return e;
        }

        const kleinerKnopf = (text, klasse, zusatzStil = '') =>
            el('button', { type: 'button', class: `btn ${klasse}`, text, style: `padding: 6px 12px; font-size: 11px;${zusatzStil}` });

        /** Auswahl Admin/Benutzer/Helfer für Freigaben und Rollenwechsel. */
        function rollenAuswahl(vorbelegt, beschriftung) {
            const auswahl = el('select', { class: 'rollen-auswahl', 'aria-label': beschriftung });
            for (const rolle of ['helfer', 'benutzer', 'admin']) {
                const option = el('option', { value: rolle, text: ROLLEN_TEXT[rolle] });
                if (rolle === vorbelegt) option.selected = true;
                auswahl.append(option);
            }
            return auswahl;
        }

        async function sendePost(url, daten) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(daten)
            });
            const antwort = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(antwort.error || 'Aktion fehlgeschlagen');
            return antwort;
        }

        function statusText(v) {
            if (!v.freigegeben) return 'Freigabe ausstehend';
            return v.rolle ? `Freigegeben als ${ROLLEN_TEXT[v.rolle] || v.rolle}` : 'Freigegeben';
        }

        // Als aktiven Verein der Verwaltung lassen sich nur Vereine setzen, in denen das Konto Benutzer oder
        // Admin ist (Spec 3.3); im Einzelbenutzerbetrieb und für Super-Admins wie bisher alle.
        const darfAktivSetzen = (v) => einzelbenutzer || !!(aktuellerNutzer && aktuellerNutzer.ist_super_admin) ||
            (v.freigegeben && rolleReicht(v.rolle, 'benutzer'));

        function renderMeineVereine() {
            if (!aktuellerNutzer || !Array.isArray(aktuellerNutzer.vereine) || aktuellerNutzer.vereine.length === 0) {
                meineVereineListe.replaceChildren(el('p', {
                    style: 'font-size: 13px; color: var(--text-muted); text-align: center;',
                    text: 'Sie sind aktuell keinem Verein zugeordnet.'
                }));
                return;
            }

            meineVereineListe.replaceChildren(...aktuellerNutzer.vereine.map(v => {
                const istAktiv = v.verein_id === aktuellerNutzer.verein_id;
                const aktionen = el('div', { class: 'verein-mitglied-actions' });

                if (!istAktiv && darfAktivSetzen(v)) {
                    const aktivKnopf = kleinerKnopf('Als aktiv setzen', 'btn-outlined');
                    aktivKnopf.dataset.action = 'aktivieren';
                    aktivKnopf.addEventListener('click', async () => {
                        try {
                            await sendePost('/api/vereine/aktiv', { vereinId: v.verein_id });
                            window.location.reload();
                        } catch (err) {
                            meldeFehler(err.message);
                        }
                    });
                    aktionen.append(aktivKnopf);
                }

                const verlassenKnopf = kleinerKnopf('Verlassen', 'btn-outlined', ' color: #ef4444; border-color: #ef4444;');
                verlassenKnopf.dataset.action = 'verlassen';
                verlassenKnopf.addEventListener('click', async () => {
                    const bestaetigt = await window.zeigeZentraleBestaetigung(
                        `Möchten Sie "${v.name}" wirklich verlassen?`,
                        'Verein verlassen',
                        'warning'
                    );
                    if (!bestaetigt) return;
                    try {
                        const data = await sendePost('/api/vereine/leave', { vereinId: v.verein_id });
                        let meldung = `"${v.name}" verlassen.`;
                        if (data.verein_geloescht) {
                            meldung += ' Der Verein wurde gelöscht, da er keine Mitglieder mehr hatte.';
                        }
                        meldeErfolg(meldung);
                        setTimeout(() => window.location.reload(), 1200);
                    } catch (err) {
                        meldeFehler(err.message || 'Verein konnte nicht verlassen werden.');
                    }
                });
                aktionen.append(verlassenKnopf);

                return el('div', { class: `verein-mitglied-row${istAktiv ? ' aktiv' : ''}`, 'data-verein-id': String(v.verein_id) },
                    el('div', {},
                        el('div', { class: 'verein-mitglied-name', text: `${v.name}${istAktiv ? ' (aktiv)' : ''}` }),
                        el('div', { class: 'verein-mitglied-status', text: statusText(v) })),
                    aktionen);
            }));
        }

        renderMeineVereine();

        /**
         * Zeile einer offenen Anfrage mit Rollenauswahl, „Freigeben“ und „Ablehnen“.
         * @param {object} p Anfrage aus /api/vereine/pending bzw. /super/pending
         * @param {{ pfad: string, vorbelegt: string, nachher: Function, freigabeText: string }} o
         */
        function anfrageZeile(p, { pfad, vorbelegt, nachher, freigabeText }) {
            const name = `${p.vorname || ''} ${p.nachname || ''}`.trim();
            const auswahl = rollenAuswahl(vorbelegt, `Rolle für ${name}`);
            const freigeben = kleinerKnopf('Freigeben', 'btn-raised');
            freigeben.dataset.action = 'approve';
            const ablehnen = kleinerKnopf('Ablehnen', 'btn-outlined');
            ablehnen.dataset.action = 'reject';

            const entscheide = async (aktion) => {
                freigeben.disabled = ablehnen.disabled = true;
                try {
                    const daten = { userId: p.id, vereinId: p.verein_id };
                    if (aktion === 'approve') daten.rolle = auswahl.value;
                    await sendePost(`/api/vereine/${pfad}${aktion}`, daten);
                    meldeErfolg(aktion === 'approve' ? freigabeText : 'Anfrage abgelehnt.');
                    nachher();
                    if (window.hajimeAktualisiereGenehmigungsHinweis) window.hajimeAktualisiereGenehmigungsHinweis();
                } catch (err) {
                    freigeben.disabled = ablehnen.disabled = false;
                    meldeFehler(err.message);
                }
            };
            freigeben.addEventListener('click', () => entscheide('approve'));
            ablehnen.addEventListener('click', () => entscheide('reject'));

            return el('div', { class: 'erstregistrierung-row', 'data-user-id': String(p.id) },
                el('div', {},
                    el('div', { class: 'erstregistrierung-name', text: name }),
                    el('div', { class: 'erstregistrierung-meta', text: `${p.email} · ${p.verein_name}` })),
                el('div', { class: 'erstregistrierung-actions' }, auswahl, freigeben, ablehnen));
        }

        // --- BEITRITTSANFRAGEN: Admins sehen die offenen Anfragen ihrer Vereine ---
        // /api/vereine/pending liefert 403, wenn das Konto in keinem Verein Admin ist; dann bleibt die Karte
        // ausgeblendet. Die Rolle ist vorbelegt (Helfer-App → Helfer, sonst Benutzer), der Admin entscheidet.
        async function ladeUndRendereBeitrittsanfragen() {
            const card = document.getElementById('beitrittsanfragenCard');
            const liste = document.getElementById('beitrittsanfragenListe');
            try {
                const resp = await fetch('/api/vereine/pending');
                const pending = resp.ok ? await resp.json() : [];
                if (!Array.isArray(pending) || pending.length === 0) {
                    card.style.display = 'none';
                    return;
                }
                card.style.display = 'block';
                liste.replaceChildren(...pending.map(p => anfrageZeile(p, {
                    pfad: '',
                    vorbelegt: vorbelegteFreigabeRolle(p.angefragt_ueber),
                    freigabeText: 'Mitglied freigegeben.',
                    nachher: () => { ladeUndRendereBeitrittsanfragen(); ladeUndRendereMitglieder(); }
                })));
            } catch (err) {
                console.error('Fehler beim Laden der Beitrittsanfragen:', err);
                card.style.display = 'none';
            }
        }

        ladeUndRendereBeitrittsanfragen();

        // --- SUPER-ADMIN: ERSTREGISTRIERUNGEN (Vereine ohne Admin) ---
        // Standardrolle Admin: die erste freigegebene Person eines Vereins ohne Admin wird dessen Admin.
        async function ladeUndRendereErstregistrierungen() {
            const liste = document.getElementById('erstregistrierungenListe');
            try {
                const resp = await fetch('/api/vereine/super/pending');
                if (!resp.ok) return;
                const pending = await resp.json();

                if (!Array.isArray(pending) || pending.length === 0) {
                    liste.replaceChildren(el('p', {
                        style: 'font-size: 13px; color: var(--text-muted); text-align: center;',
                        text: 'Keine offenen Erstregistrierungen.'
                    }));
                    return;
                }
                liste.replaceChildren(...pending.map(p => anfrageZeile(p, {
                    pfad: 'super/',
                    vorbelegt: 'admin',
                    freigabeText: 'Erstregistrierung freigegeben.',
                    nachher: () => { ladeUndRendereErstregistrierungen(); ladeUndRendereMitglieder(); }
                })));
            } catch (err) {
                console.error('Fehler beim Laden der Erstregistrierungen:', err);
            }
        }

        if (aktuellerNutzer && aktuellerNutzer.ist_super_admin) {
            document.getElementById('superAdminCard').style.display = 'block';
            ladeUndRendereErstregistrierungen();
        }

        // --- MITGLIEDERVERWALTUNG (Admins des Vereins, Super-Admins) ---
        // Rolle ändern (/api/vereine/rolle) und Entfernen (/api/vereine/entfernen); der Server lehnt z. B. das
        // Herabstufen oder Entfernen des letzten Admins ab, die Meldung erscheint als Snackbar.
        function verwalteteVereine() {
            if (!aktuellerNutzer || !Array.isArray(aktuellerNutzer.vereine)) return [];
            return aktuellerNutzer.vereine.filter(v =>
                aktuellerNutzer.ist_super_admin || (v.freigegeben && rolleReicht(v.rolle, 'admin')));
        }

        function mitgliedZeile(verein, m, neuLaden) {
            const name = `${m.vorname || ''} ${m.nachname || ''}`.trim();
            let rolleZelle;
            if (m.status === 'freigegeben') {
                const auswahl = rollenAuswahl(m.rolle, `Rolle von ${name}`);
                auswahl.addEventListener('change', async () => {
                    auswahl.disabled = true;
                    try {
                        await sendePost('/api/vereine/rolle', { userId: m.id, vereinId: verein.verein_id, rolle: auswahl.value });
                        meldeErfolg(`${name} ist jetzt ${ROLLEN_TEXT[auswahl.value]}.`);
                    } catch (err) {
                        auswahl.value = m.rolle;
                        meldeFehler(err.message);
                    }
                    neuLaden();
                });
                rolleZelle = auswahl;
            } else {
                rolleZelle = '–';
            }

            const entfernen = kleinerKnopf('Entfernen', 'btn-outlined', ' color: #ef4444; border-color: #ef4444;');
            entfernen.addEventListener('click', async () => {
                const bestaetigt = await window.zeigeZentraleBestaetigung(
                    `Möchten Sie ${name} wirklich aus "${verein.name}" entfernen?`, 'Mitglied entfernen', 'warning');
                if (!bestaetigt) return;
                try {
                    await sendePost('/api/vereine/entfernen', { userId: m.id, vereinId: verein.verein_id });
                    meldeErfolg(`${name} wurde entfernt.`);
                    if (aktuellerNutzer && m.id === aktuellerNutzer.id) {
                        setTimeout(() => window.location.reload(), 1200);
                        return;
                    }
                    neuLaden();
                    ladeUndRendereBeitrittsanfragen();
                } catch (err) {
                    meldeFehler(err.message);
                }
            });

            return el('tr', { 'data-user-id': String(m.id) },
                el('td', { text: name }),
                el('td', { text: m.email || '' }),
                el('td', {}, rolleZelle),
                el('td', { text: m.status === 'freigegeben' ? 'Freigegeben' : 'Wartet auf Freigabe' }),
                el('td', {}, entfernen));
        }

        async function rendereMitgliederVerein(verein, ziel) {
            const neuLaden = () => rendereMitgliederVerein(verein, ziel);
            try {
                const resp = await fetch(`/api/vereine/mitglieder?vereinId=${encodeURIComponent(verein.verein_id)}`);
                const daten = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(daten.error || 'Mitglieder konnten nicht geladen werden.');
                const kopf = el('tr', {}, ...['Name', 'E-Mail', 'Rolle', 'Status', ''].map(t => el('th', { text: t })));
                ziel.replaceChildren(el('table', { class: 'mitglieder-tabelle' },
                    el('thead', {}, kopf),
                    el('tbody', {}, ...daten.map(m => mitgliedZeile(verein, m, neuLaden)))));
            } catch (err) {
                ziel.replaceChildren(el('p', { style: 'font-size: 13px; color: var(--text-muted);', text: err.message }));
            }
        }

        function ladeUndRendereMitglieder() {
            const vereine = verwalteteVereine();
            const card = document.getElementById('mitgliederCard');
            const bereich = document.getElementById('mitgliederBereich');
            if (vereine.length === 0) {
                card.style.display = 'none';
                return;
            }
            card.style.display = 'block';
            bereich.replaceChildren(...vereine.map(v => {
                const ziel = el('div', { class: 'mitglieder-scroll', 'data-verein-id': String(v.verein_id) });
                rendereMitgliederVerein(v, ziel);
                return el('section', {}, el('h2', { class: 'mitglieder-verein', text: v.name }), ziel);
            }));
        }

        ladeUndRendereMitglieder();
    });
</script>
</body>
</html>
