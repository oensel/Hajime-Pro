<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Urkunden</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/menu.js"></script>
    <script src="/js/fabric/index.min.js"></script>
    <style>
        .urkunden-card { max-width: 1200px; margin: 24px auto; padding: 24px; }
        .urkunden-zeile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
        .urkunden-zeile label { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-size: 13px; font-weight: 700; }
        .urkunden-zeile input[type="checkbox"] { width: auto; margin: 0; }
        .urkunden-zeile input[type="color"] { width: 40px; height: 30px; padding: 0; margin: 0; }
        .urkunden-zeile select, .urkunden-zeile input[type="text"], .urkunden-zeile input[type="number"] {
            width: auto; margin: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: inherit;
        }
        #editorContainer { position: relative; width: 100%; border: 1px solid var(--border); background: #f4f4f4; min-height: 120px; }
        #editorLeer { padding: 24px; text-align: center; color: #777; }
        .werkzeugleiste { border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-bottom: 12px; }
        .werkzeugleiste[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
        .platzhalter-btn { font-size: 12px; padding: 4px 8px; }
        #feldText { min-width: 280px; flex: 1; }
        .pool-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 4px 16px; margin: 8px 0 12px; }
        .pool-liste h3 { grid-column: 1 / -1; margin: 8px 0 0; font-size: 14px; }
        .pool-hinweis { color: #b8860b; font-size: 12px; }
        .urkunden-hinweis { background: #fff8e1; border-left: 4px solid #f0b400; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; color: #333; }
    </style>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card urkunden-card">
    <div class="form-title-area">
        <span class="material-icons">workspace_premium</span>
        <h1>Urkunden-Vorlagen</h1>
    </div>

    <div id="hallenHinweis" class="urkunden-hinweis" style="display: none;">
        Änderungen an Vorlagen werden nicht in die Cloud übertragen.
    </div>

    <div class="urkunden-zeile">
        <label for="vorlagenAuswahl">Vorlage</label>
        <select id="vorlagenAuswahl"></select>
        <button type="button" class="btn btn-outlined" id="btnVorlageNeu">Neu</button>
        <button type="button" class="btn btn-outlined" id="btnVorlageDuplizieren">Duplizieren</button>
        <button type="button" class="btn btn-outlined" id="btnVorlageUmbenennen">Umbenennen</button>
        <button type="button" class="btn btn-outlined" id="btnVorlageLoeschen">Löschen</button>
        <input type="file" id="vorlageDatei" accept="application/pdf" style="display: none;">
    </div>

    <div class="urkunden-zeile">
        <button type="button" class="btn btn-raised" id="btnFeldPlatzhalter">+ Platzhalterfeld</button>
        <button type="button" class="btn btn-raised" id="btnFeldText">+ Freier Text</button>
        <label style="margin-left: auto;"><input type="checkbox" id="schalterBeispiel"> Beispieldaten</label>
    </div>

    <div class="werkzeugleiste" id="werkzeugleiste" aria-disabled="true">
        <div class="urkunden-zeile">
            <label for="feldText">Text</label>
            <input type="text" id="feldText" maxlength="200">
        </div>
        <div class="urkunden-zeile" id="platzhalterKnoepfe"></div>
        <div class="urkunden-zeile">
            <label for="feldSchrift">Schrift</label>
            <select id="feldSchrift"></select>
            <label for="feldGroesse">Größe (pt)</label>
            <input type="number" id="feldGroesse" min="4" max="200" step="0.5" style="width: 80px;">
            <label for="feldFarbe">Farbe</label>
            <input type="color" id="feldFarbe">
            <label for="feldAusrichtung">Ausrichtung</label>
            <select id="feldAusrichtung">
                <option value="links">links</option>
                <option value="zentriert">zentriert</option>
                <option value="rechts">rechts</option>
            </select>
            <button type="button" class="btn btn-outlined" id="btnFeldZentrieren">Auf Seite zentrieren</button>
            <button type="button" class="btn btn-outlined" id="btnFeldLoeschen">Feld löschen</button>
        </div>
    </div>

    <div id="editorContainer">
        <div id="editorLeer">Keine Vorlage gewählt. Lege mit „Neu“ eine Vorlage aus einer Blanko-Urkunde (PDF) an.</div>
        <canvas id="urkundenCanvas"></canvas>
    </div>

    <div class="urkunden-zeile" style="margin-top: 12px;">
        <label for="vorlagePlatzbereich">Voreinstellung Platzierungen</label>
        <select id="vorlagePlatzbereich">
            <option value="3">1.–3.</option>
            <option value="5">1.–5.</option>
            <option value="7">1.–7.</option>
            <option value="alle">alle</option>
        </select>
        <label for="vorlageReihenfolge">Reihenfolge</label>
        <select id="vorlageReihenfolge">
            <option value="siegerehrung">Siegerehrung (letzter Platz zuerst)</option>
            <option value="aufsteigend">aufsteigend (1. Platz zuerst)</option>
        </select>
        <label><input type="checkbox" id="vorlageBeiAbschluss"> Beim Pool-Abschluss Druck anbieten</label>
        <button type="button" class="btn btn-raised" id="btnVorlageSpeichern" style="margin-left: auto;">Speichern</button>
    </div>
</div>

<div class="mdc-card urkunden-card">
    <div class="form-title-area">
        <span class="material-icons">print</span>
        <h1>Urkunden generieren</h1>
    </div>
    <div class="urkunden-zeile">
        <label for="genVorlage">Vorlage</label>
        <select id="genVorlage"></select>
        <label for="genPlatzbereich">Platzierungen</label>
        <select id="genPlatzbereich">
            <option value="3">1.–3.</option>
            <option value="5">1.–5.</option>
            <option value="7">1.–7.</option>
            <option value="alle">alle (ohne Platz: Teilnahme)</option>
        </select>
        <label for="genReihenfolge">Reihenfolge</label>
        <select id="genReihenfolge">
            <option value="siegerehrung">Siegerehrung</option>
            <option value="aufsteigend">aufsteigend</option>
        </select>
    </div>
    <div id="genFelderHinweis" class="urkunden-hinweis" style="display: none;">Die gewählte Vorlage enthält noch keine Felder.</div>
    <div class="pool-liste" id="genPoolListe"></div>
    <div class="urkunden-zeile">
        <span id="genAnzahl"></span>
        <button type="button" class="btn btn-raised" id="btnGenerieren" style="margin-left: auto;">Urkunden generieren</button>
    </div>
</div>

<script type="module" src="/js/urkundenDruck.js"></script>
<script type="module" src="/js/urkunden.js"></script>
</body>
</html>
