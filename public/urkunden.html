<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Urkunden</title>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/menu.js"></script>
    <style>
        .urkunden-card { max-width: 1200px; margin: 24px auto; padding: 24px; }
        .urkunden-zeile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
        .urkunden-zeile label { display: inline-flex; align-items: center; gap: 4px; margin: 0; font-size: 13px; font-weight: 700; }
        .urkunden-zeile select {
            width: auto; margin: 0; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: inherit;
        }
        .vorlage-knopf { display: inline-flex; align-items: center; gap: 6px; min-width: 200px; max-width: 250px; justify-content: space-between; }
        .vorlage-knopf #genVorlageName { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pool-liste { display: flex; flex-direction: column; gap: 4px; margin: 8px 0 12px; }
        .pool-liste h3 { margin: 8px 0 0; font-size: 14px; }
        .pool-liste input[type="checkbox"] { width: 18px; height: 18px; margin: 0; flex-shrink: 0; accent-color: var(--primary); cursor: pointer; }
        .pool-eintrag {
            display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; padding: 0 8px;
            border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card);
        }
        .pool-eintrag label {
            display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; align-self: stretch; margin: 0;
            font-size: 14px; font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--text-main); cursor: pointer;
        }
        .pool-eintrag:not(.gesperrt):hover, .pool-eintrag:has(input:checked) { border-color: var(--primary); }
        /* Nicht wählbar: Pool noch nicht abgeschlossen */
        .pool-eintrag.gesperrt { border-style: dashed; background: transparent; }
        .pool-eintrag.gesperrt label { font-weight: 400; color: var(--text-muted); cursor: not-allowed; }
        .pool-pdf { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .pool-pdf-marke { display: inline-flex; align-items: center; gap: 2px; margin-right: 4px; font-size: 12px; color: #2e7d32; white-space: nowrap; }
        .pool-pdf .material-icons { font-size: 18px; }
        .pool-pdf-knopf { display: inline-flex; padding: 3px; border: 0; border-radius: 4px; background: none; color: inherit; cursor: pointer; }
        .pool-pdf-knopf:hover { background: rgba(0, 0, 0, 0.08); }
        .pool-hinweis { font-size: 12px; font-style: italic; }
        .pool-liste input[type="checkbox"]:disabled { cursor: not-allowed; }
        .urkunden-hinweis { background: #fff8e1; border-left: 4px solid #f0b400; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; color: #333; }
    </style>
</head>
<body>

<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<div class="mdc-card urkunden-card">
    <div class="form-title-area">
        <span class="material-icons">print</span>
        <h1>Urkunden generieren</h1>
    </div>
    <div id="keineVorlageHinweis" class="urkunden-hinweis" style="display: none;">
        Es gibt noch keine Urkunden-Vorlage. Lege im <a id="linkDesigner" href="/urkunden-designer.html">Urkunden-Designer</a> eine an.
    </div>
    <div class="urkunden-zeile">
        <label for="genVorlage">Vorlage</label>
        <button type="button" class="btn btn-outlined vorlage-knopf" id="genVorlage" data-vorlage-id="">
            <span id="genVorlageName">– keine Vorlage –</span>
            <span class="material-icons" style="font-size: 18px;">expand_more</span>
        </button>
        <label for="genPlatzbereich">Platzierungen</label>
        <select id="genPlatzbereich"></select>
        <label for="genReihenfolge">Reihenfolge</label>
        <select id="genReihenfolge"></select>
    </div>
    <div id="genFelderHinweis" class="urkunden-hinweis" style="display: none;">Die gewählte Vorlage enthält noch keine Felder.</div>
    <div class="pool-liste" id="genPoolListe"></div>
    <div class="urkunden-zeile">
        <span id="genAnzahl"></span>
        <button type="button" class="btn btn-raised" id="btnGenerieren" style="margin-left: auto;">Urkunden generieren</button>
    </div>
</div>

<script type="module" src="/js/urkundenDruck.js"></script>
<script type="module" src="/js/urkunden.js"></script>
</body>
</html>
