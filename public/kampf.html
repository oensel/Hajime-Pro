<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hajime Pro - Kampf-Steuerung</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/kampf.css">
    <script src="/js/menu.js"></script>
</head>
<body>

<!-- Kanji Wasserzeichen -->
<div class="kanji-left">柔</div>
<div class="kanji-right">道</div>

<!-- Card: Matten-Auswahl -->
<div class="mdc-card" style="margin-bottom: 24px; padding: 16px 24px;">
    <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span class="material-icons" style="font-size: 24px; color: var(--primary);">sports_kabaddi</span>
            <h1 style="font-size: 20px; margin: 0; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-main);">Kampf-Steuerung</h1>
        </div>
        
        <div style="display: flex; align-items: center; gap: 10px; width: 100%; max-width: 450px;">
            <select id="mattenSelect" class="form-control" style="margin: 0; text-align: center; text-align-last: center; height: 40px; padding: 8px 12px; font-size: 14px;">
                <option value="" disabled selected hidden>Bitte wählen...</option>
            </select>
            <button type="button" class="btn btn-outlined" id="refreshBtn" style="padding: 0 16px; height: 40px; display: flex; align-items: center; gap: 8px; margin: 0;" title="Aktualisieren">
                <span class="material-icons" style="font-size: 20px;">refresh</span>
                <span>Aktualisieren</span>
            </button>
        </div>
    </div>
    
    <!-- Offline-Bereich -->
    <div id="offlineActions" style="display: none; border-top: 1px solid var(--border); margin-top: 16px; padding-top: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div style="font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">Offline-Datenaustausch:</div>
        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <button type="button" class="btn btn-outlined" id="exportBtn" style="height: 38px; display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 0 14px; margin: 0;">
                <span class="material-icons" style="font-size: 18px;">download</span>
                Daten herunterladen (JSON)
            </button>
            <label class="btn btn-outlined" style="height: 38px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 0 14px; margin: 0; cursor: pointer; text-transform: uppercase; font-weight: bold; box-sizing: border-box; justify-content: center; user-select: none;">
                <span class="material-icons" style="font-size: 18px;">upload</span>
                Ergebnisse einspielen (JSON)
                <input type="file" id="importInput" accept=".json" style="display: none;">
            </label>
        </div>
    </div>
</div>

<!-- Container für den Kampfplan -->
<div id="kampfplanContainer" style="display: none;">
    <!-- Sektion: Aktueller Kampf -->
    <div class="mdc-card current-fight-card" style="margin-bottom: 24px; border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(var(--primary-rgb), 0.15);">
        <div class="current-fight-header">
            <span class="badge laufend">Aktueller Kampf</span>
            <span class="current-pool-title" id="currentPoolTitle">Pool-Name</span>
        </div>
        
        <div class="current-fight-fighters">
            <div class="fighter-panel red">
                <div class="fighter-name" id="currentFighter1Name">Kämpfer 1</div>
                <div class="fighter-club" id="currentFighter1Club">Verein 1</div>
            </div>
            
            <div class="vs-divider">VS</div>
            
            <div class="fighter-panel white">
                <div class="fighter-name" id="currentFighter2Name">Kämpfer 2</div>
                <div class="fighter-club" id="currentFighter2Club">Verein 2</div>
            </div>
        </div>
        
        <div class="current-fight-actions" id="currentFightActions">
            <!-- Buttons werden reaktiv per JS erzeugt (Starten / Beenden) -->
        </div>
    </div>

    <!-- Sektion: Warteschlange (Nächste Kämpfe) -->
    <div class="mdc-card" style="margin-bottom: 24px;">
        <div class="form-title-area" style="padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border);">
            <span class="material-icons" style="font-size: 20px;">queue_play_next</span>
            <h2 style="font-size: 16px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 0.5px;">Warteliste</h2>
        </div>
        <div class="fights-list" id="upcomingFightsList">
            <!-- Dynamisch über JS -->
        </div>
    </div>

    <!-- Sektion: Beendete Kämpfe -->
    <div class="mdc-card">
        <div class="form-title-area" style="padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border);">
            <span class="material-icons" style="font-size: 20px;">history</span>
            <h2 style="font-size: 16px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 0.5px;">Verlauf (Beendete Kämpfe)</h2>
        </div>
        <div class="fights-list" id="finishedFightsList">
            <!-- Dynamisch über JS -->
        </div>
    </div>
</div>

<!-- Modal: Ergebnis eintragen -->
<div id="resultModal" class="modal-wrapper" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); z-index: 9999; align-items: center; justify-content: center;">
    <div class="mdc-card" style="max-width: 480px; padding: 24px; border-radius: 4px; border: 2px solid var(--border); box-shadow: var(--shadow); background-color: var(--bg-card);">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
            <span class="material-icons" style="font-size: 28px; color: var(--primary);">emoji_events</span>
            <h2 style="margin: 0; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Ergebnis eintragen</h2>
        </div>
        
        <form id="resultForm">
            <input type="hidden" id="modalKampfId">
            
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="siegerSelect" style="display:block; margin-bottom: 8px; font-weight: 700;">Sieger</label>
                <select id="siegerSelect" required style="width: 100%;">
                    <option value="" disabled selected hidden>Bitte wählen...</option>
                </select>
            </div>
            
            <div class="grid-2" style="gap: 16px; margin-bottom: 16px;">
                <div class="form-group">
                    <label id="scoreLabel1" for="score1" style="font-weight: 700;">Score Kämpfer 1 (Rot)</label>
                    <select id="score1" required class="form-control">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="5">5</option>
                        <option value="7">7</option>
                        <option value="10" selected>10</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="scoreLabel2" for="score2" style="font-weight: 700;">Score Kämpfer 2 (Weiß)</label>
                    <select id="score2" required class="form-control">
                        <option value="0" selected>0</option>
                        <option value="1">1</option>
                        <option value="5">5</option>
                        <option value="7">7</option>
                        <option value="10">10</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label for="kampfzeit" style="font-weight: 700;">Kampfzeit (Sekunden)</label>
                <input type="number" id="kampfzeit" min="1" required placeholder="z.B. 120">
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 12px;">
                <button type="button" class="btn btn-outlined" id="cancelResultBtn">Abbrechen</button>
                <button type="submit" class="btn btn-raised">Speichern</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/kampf.js"></script>
</body>
</html>
